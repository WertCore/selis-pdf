# Conformance areas — SL-0.OPS.02.
#
# Machine-readable twin of 20-CONFORMANCE-PROGRAM.md. Every area starts at
# level 0 (None). `xtask conformance report` renders the current state as the
# project's real status page; CI publishes it.
#
# Ladder levels (20-CONFORMANCE-PROGRAM.md):
#   0 None       — nothing implemented, nothing claimed.
#   1 Identify   — the engine recognises the construct.
#   2 Parse      — the engine parses it without loss.
#   3 Render     — it renders correctly.
#   4 Extract    — text/structure can be extracted.
#   5 Edit       — it can be modified and saved back.
#   6 Author     — the engine can author new documents using it.
#
# Promotion record (SL-3.CONF.05, 2026-09-16): TEXT.11 re-measure. Both full sweeps (text
# 3,862 files @ C:\selis-build\conf05-text, render 11,321 outcomes @
# C:\selis-build\conf05-render) reproduce the CONF.02 readout within one file per band;
# levels unchanged, the row numbers now quote the merged tree. CI oracle pins re-recorded
# (run 34820871908) — the pinned-container legs return 0 comparable on two counts
# (superseded 2026-09-09 digests no longer resolve; the by-file output bind + the text
# plan's mutool alias), the first of which re-pinning fixes and the second now fixed in
# SL-3.CONF.02 with tests — so the next scheduled run is the first credible post-bind
# evidence (SL-3.CONF.06 asserts it and the §4 cells).
#
# Promotion record (SL-3.CONF.02, 2026-09-14): second ladder update, on the post-
# merge tree (3,860-file regenerated corpus incl. the SL-3.TEXT.10 BT fix). `text`
# moves None -> Parse (Unicode extraction measured across the corpus; Render and
# Extract both withheld — see the row). `render` stays Parse with the bar
# re-measured: it now clears Bar A and Bar B on the MuPDF leg, and only the
# two-independent-oracle CI legs keep it down. Tolerances were read against
# SL-0.ORACLE.04's noise floor, not against the red build.

# Promotion record (SL-2.CONF.02, 2026-09-11): first ladder update. Levels are
# measurements against the SL-2.CONF.03 calibrated bar (Bar A: >=95% of
# comparable pages <=25% differing pixels @150 DPI; Bar B: selis's <=2%/<=5%/
# <=10% band fractions within 5pp of the best oracle pair). No area meets the
# full bar — Bar B fails at <=2% (76.2 vs best pair 82.3, 1.1pp past the 5pp
# allowance; SL-2.RAST.14) — so nothing promotes to Render. Areas with
# measured Parse evidence sit at Parse; everything unmeasured stays at None,
# including the G2 Identify targets for annotations/AcroForm (ADR-P0010).

