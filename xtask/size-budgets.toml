# WASM size budgets — SL-0.WS.09 (ADR-P0011) + SL-4.WASM.02 code splitting.
# Brotli-compressed bytes of the wasm-opt -O3 output.
#
# `artifact` names the linked wasm artefact a budget is evaluated against
# (file stem, cargo normalises `-` to `_`). A budget whose artifact is not
# measured yet is reported as "not measured" — never as passing. The 6-chunk
# split lands here: core (viewer, ≤3 MB) + 5 lazy chunks (jpx, cjk, ocr,
# convert, editor). Viewer never downloads editor — proven by the
# `Manifest::validate_viewer_isolation` unit test and the `wasm-loader`
# vitest suite.

[[budget]]
chunk = "core"
artifact = "selis_pdf_wasm"
budget = 3000000

[[budget]]
chunk = "jpx"
artifact = "selis_pdf_wasm_jpx"
budget = 400000

[[budget]]
chunk = "cjk"
artifact = "selis_pdf_wasm_cjk"
budget = 500000

[[budget]]
chunk = "ocr"
artifact = "selis_pdf_wasm_ocr"
budget = 800000

# The convert chunk (Markdown, HTML, CSV, LaTeX, SVG, EPUB, Word, PowerPoint,
# Excel → PDF). It is still the smallest lazy chunk; the nine converters cost
# 136 633 B brotli (424 456 B raw) measured together, all behind their format
# codes. The 2% regression rule accepted the +11.7% drift when the OOXML
# readers landed; the budget stays at 600 000.
[[budget]]
chunk = "convert"
artifact = "selis_pdf_wasm_convert"
budget = 600000

[[budget]]
chunk = "editor"
artifact = "selis_pdf_wasm_editor"
budget = 900000

# The tool-first page's lazy chunk (merge/split/rotate/delete/reorder/metadata).
# It must stay import-free; `place-assets` fails the build if it grows JS glue.
# 300 000 covered the chunk up to its 26th operation; the 27th (the read-only
# metadata report, whose export shape is a serialized struct) crossed it, so the
# budget moved to the next round number rather than the feature being cut. The
# 2% baseline rule still gates every later slice.
# 320 000 then covered it through the 28th operation. The 29th and 30th (the
# AcroForm field report and the fill writer) add a whole field walk, a value
# codec and its read-back check — a measured 16.9 KB - so the budget moved one
# more round step to 340 000 rather than shipping a form tool that only reads
# half a form. The growth is in the two operations themselves, not in a
# dependency, and the 2% rule still gates every later slice.
[[budget]]
chunk = "tools"
artifact = "selis_pdf_wasm_tools"
budget = 340000

# The raster page's lazy chunk (PDF → PNG, JPG, TIFF and WebP). It carries the
# whole render walk, tiny-skia, the built-in Liberation fallback faces, the owned
# baseline JPEG coder, the owned multi-page TIFF and the owned VP8L lossless
# WebP, each with its read-back verification, so it is the largest lazy chunk; it
# must still stay import-free and off the tools page's critical path.
# Measured at 1 115 272 B brotli with all four formats (1 097 631 B with three,
# 1 093 374 B with both raster formats, 1 088 448 B before the JPEG arrived),
# hence the 1.3 MB ceiling. The WebP coder cost 17 641 B and did not need a
# fifth chunk or a raised ceiling.
[[budget]]
chunk = "raster"
artifact = "selis_pdf_wasm_raster"
budget = 1300000

# The HTML page's lazy chunk (PDF → HTML). It is the engine's extraction pipeline
# — display list, Unicode recovery, line assembly, reading order — plus the
# positioned emitter and its strict reader. No rasteriser, no built-in face and no
# entropy source: text extraction reads the document's own fonts, which is why this
# is a quarter of the raster chunk. Measured at 228 325 B brotli, hence 300 000.
[[budget]]
chunk = "html"
artifact = "selis_pdf_wasm_html"
budget = 300000

# The security page's lazy chunk (unlock, protect, clear permissions). It is the
# only chunk that links the crypto handler and the engine's decryption resolver,
# and it is deliberately not part of the tools chunk: the plain tools chunk sits
# 15 KB under its own ceiling, and a password card is opened far less often than
# a merge. The 64 bytes of key material are injected by the page, so no entropy
# import reaches the guest and the chunk stays import-free.
[[budget]]
chunk = "security"
artifact = "selis_pdf_wasm_security"
budget = 200000

# The signing page's lazy chunk (stamp, certificate signature, signature report).
# This is the only chunk that links an RSA implementation, the DER/CMS encoder and
# the X.509 chain walker, which is why it is separate from both the tools chunk and
# the security chunk. The private key is read by the page and sent as PEM in the
# options JSON, so no entropy import reaches the guest and the chunk stays
# import-free. Measured at 220 308 B brotli with all three operations, hence the
# 400 000 ceiling.
[[budget]]
chunk = "sign"
artifact = "selis_pdf_wasm_sign"
budget = 400000

# Automation binary (native, also built for wasm32 as the size canary).
[[budget]]
chunk = "engine-viewer"
artifact = "xtask"
budget = 400000

# The text chunk (Phase 3: PDF → text with its quality report, tables, split by
# text, reflow, Word, PowerPoint, Excel). It is the second chunk that links the
# engine's extraction pipeline (the HTML chunk was the first), so it is budgeted
# on its own rather than at the tools chunk's door: `selis-pdf-tools` ships the
# text tools behind a `text` feature and the plain tools chunk does not enable
# it. Measured at 309 126 B brotli (1 030 683 B raw) with all eight operations,
# hence the 400 000 ceiling.
[[budget]]
chunk = "text"
artifact = "selis_pdf_wasm_text"
budget = 400000
