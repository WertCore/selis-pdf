# WASM size budgets — SL-0.WS.09 (ADR-P0011) + SL-4.WASM.02 code splitting.
# Brotli-compressed bytes of the wasm-opt -O3 output.
#
# `artifact` names the linked wasm artefact a budget is evaluated against
# (file stem, cargo normalises `-` to `_`). A budget whose artifact is not
# measured yet is reported as "not measured" — never as passing. The 6-chunk
# split lands here: core (viewer, ≤3 MB) + 5 lazy chunks (jpx, cjk, ocr,
# convert, editor). Viewer never downloads editor — proven by the
# `Manifest::validate_viewer_isolation` unit test and the `wasm-loader`
# vitest suite.

[[budget]]
chunk = "core"
artifact = "selis_pdf_wasm"
budget = 3000000

[[budget]]
chunk = "jpx"
artifact = "selis_pdf_wasm_jpx"
budget = 400000

[[budget]]
chunk = "cjk"
artifact = "selis_pdf_wasm_cjk"
budget = 500000

[[budget]]
chunk = "ocr"
artifact = "selis_pdf_wasm_ocr"
budget = 800000

[[budget]]
chunk = "convert"
artifact = "selis_pdf_wasm_convert"
budget = 600000

[[budget]]
chunk = "editor"
artifact = "selis_pdf_wasm_editor"
budget = 900000

# The tool-first page's lazy chunk (merge/split/rotate/delete/reorder/metadata).
# It must stay import-free; `place-assets` fails the build if it grows JS glue.
# 300 000 covered the chunk up to its 26th operation; the 27th (the read-only
# metadata report, whose export shape is a serialized struct) crossed it, so the
# budget moved to the next round number rather than the feature being cut. The
# 2% baseline rule still gates every later slice.
[[budget]]
chunk = "tools"
artifact = "selis_pdf_wasm_tools"
budget = 320000

# The raster page's lazy chunk (PDF → PNG). It carries the whole render walk,
# tiny-skia and the built-in Liberation fallback faces, so it is the largest
# lazy chunk; it must still stay import-free and off the tools page's critical
# path. Measured at 1 142 920 B before fat LTO, hence the 1.3 MB ceiling.
[[budget]]
chunk = "raster"
artifact = "selis_pdf_wasm_raster"
budget = 1300000

# Automation binary (native, also built for wasm32 as the size canary).
[[budget]]
chunk = "engine-viewer"
artifact = "xtask"
budget = 400000
