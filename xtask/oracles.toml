# Oracle tool pinning (SL-0.ORACLE.01, ADR-P0009).
#
# Every oracle runs as an external process â€” locally when the tool is
# installed (local-first dispatch), otherwise inside the pinned container
# built from docker/oracles/<tool>/Dockerfile. Nothing here is ever linked
# into a Selis build, and AGPL tools (MuPDF, Ghostscript) exist only inside
# their containers (ADR-P0021).
#
# Pinning strength, per tool:
#   - `image`    the container we build from the checked-in Dockerfile.
#                Published by the CI `oracle-images` job to GHCR.
#   - `digest`   the image manifest digest, recorded from the CI push of
#                2026-09-09 (all five built + smoke-rendered + pushed).
#   - `base`     the base image, pinned by manifest digest. Every digest in
#                this file was resolved live from the registry API on
#                2026-09-08.
#   - `source_*` the exact tool artifact built inside the container, pinned
#                by sha256 computed from a local download (npm tarballs are
#                additionally cross-checked against the registry's published
#                integrity hash).
#
# Local binaries on the dev host (recorded here for drift visibility; the
# authoritative comparison identity is the container):
#   qpdf  12.4.1 (winget)   mutool 1.23.0 (winget)   gs: not installed

