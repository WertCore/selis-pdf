# ADR-P0003 — strict, mechanically-enforced layering.
# `cargo xtask check-layers` fails the build on any edge that violates this file.
#
# Rule: a crate may depend on STRICTLY LOWER layers only. Sideways edges within
# a layer require an entry in [[edge]] with a written justification.
#
# Crates listed here but not yet present in the workspace are planned (later
# phases); check-layers ignores absent crates and reports them as `planned`.

[layers]
# L0 — Foundation
selis-error = 0
selis-bytes = 0
selis-geom  = 0
selis-color = 0
selis-log   = 0

# L1 — Abstraction
selis-io      = 1
selis-sandbox = 1
selis-crypto  = 1

# L2 — Domain
selis-pdf-cos      = 2
selis-pdf-filter   = 2
selis-pdf-doc      = 2
selis-pdf-edit     = 2
selis-pdf-optimize = 2
selis-image        = 2
selis-raster       = 2
selis-font         = 2
selis-shape        = 2
selis-pdf-content  = 2 # planned — Phase 2
selis-pdf-text     = 2
selis-pdf-annot    = 2 # planned — Phase 5
selis-pdf-form     = 2 # planned — Phase 5
selis-pdf-redact   = 2 # planned — Phase 5
selis-pdf-sign     = 2 # planned — Phase 5

# L3 — Orchestration
selis-pdf-engine = 3
selis-policy     = 3
selis-job        = 3
selis-pdf-convert = 3

# L4 — Bindings
selis-pdf-wasm = 4
selis-pdf-ffi  = 4 # planned — Phase 7

# L5 — Apps
selis-cli = 5

# ---------------------------------------------------------------------------
# The explicit L2 sideways-edge allowlist (01-ARCHITECTURE.md §3).
# Each edge needs a justification. Adding one needs review, not a drive-by.
# ---------------------------------------------------------------------------

[[edge]]
from = "selis-pdf-doc"
to = "selis-pdf-cos"
why = """
The document model is a typed view over the COS object graph. Catalog, page
tree and inheritance are defined in terms of COS objects; re-abstracting them
would mean a parallel object model with no additional information."""

[[edge]]
from = "selis-pdf-doc"
to = "selis-pdf-filter"
why = """
Stream decoding is required to read metadata (XMP), object streams, and the
structure tree. Filters are a leaf concern with no reverse dependency."""

[[edge]]
from = "selis-pdf-cos"
to = "selis-pdf-filter"
why = """
Object streams (/ObjStm) and cross-reference streams are Flate-encoded by
construction; the COS layer cannot build an index without decoding them."""

[[edge]]
from = "selis-pdf-edit"
to = "selis-pdf-cos"
why = "01-ARCHITECTURE.md §3 — declared exception. The writer serialises COS objects."

[[edge]]
from = "selis-pdf-edit"
to = "selis-pdf-doc"
why = "01-ARCHITECTURE.md §3 — declared exception. Page operations act on the page tree."

[[edge]]
from = "selis-pdf-edit"
to = "selis-pdf-filter"
why = "The writer re-encodes streams it emits (object streams, recompression)."

[[edge]]
from = "selis-pdf-optimize"
to = "selis-pdf-cos"
why = "Deduplication and GC operate on the object graph directly."

[[edge]]
from = "selis-pdf-optimize"
to = "selis-pdf-doc"
why = "Reachability analysis starts from the catalog and page tree."

[[edge]]
from = "selis-pdf-optimize"
to = "selis-pdf-edit"
why = "Optimisation emits a document through the writer; it does not have its own."

[[edge]]
from = "selis-pdf-optimize"
to = "selis-pdf-filter"
why = "Stream recompression is the core of the lossless tier."

[[edge]]
from = "selis-pdf-content"
to = "selis-font"
why = "01-ARCHITECTURE.md §3 — declared exception. Glyph resolution during interpretation."

[[edge]]
from = "selis-pdf-content"
to = "selis-image"
why = "01-ARCHITECTURE.md §3 — declared exception. Inline images and Image XObjects."

[[edge]]
from = "selis-pdf-text"
to = "selis-pdf-content"
why = "01-ARCHITECTURE.md §3 — declared exception. Extraction consumes the display list."

[[edge]]
from = "selis-pdf-text"
to = "selis-font"
why = """
Text recovery and extraction resolve glyph names and encodings through the
font model (ToUnicode CMaps, the AGL, glyph-name conventions); the font crate
is a leaf L2 with no reverse dependency."""

[[edge]]
from = "selis-pdf-form"
to = "selis-pdf-annot"
why = "01-ARCHITECTURE.md §3 — declared exception. Widget annotations are field appearances."

[[edge]]
from = "selis-pdf-engine"
to = "selis-policy"
why = """
The engine is the only L3 crate an app talks to; budget surfaces, entitlement
sets and CloudConsent are policy decisions, and the engine is where they are
consulted per operation. Policy is a leaf with no reverse dependency."""

[[edge]]
from = "selis-pdf-engine"
to = "selis-job"
why = """
Batch operations (merge, split, OCR, convert) are scheduled through selis-job
for progress, cancellation and resumability; the engine drives them to completion."""

[[edge]]
from = "selis-color"
to = "selis-geom"
why = """
Colour transforms operate on geometry: conversion matrices (Matrix), sample
points (Point) and gamut bounds (Rect). Geom is a leaf L0 crate with no reverse
dependency."""

[[edge]]
from = "selis-color"
to = "selis-error"
why = """
PDF functions (SL-2.COLOR.05) return typed errors (FUNCTION_INPUT_COUNT,
FUNCTION_BUDGET) from the shared registry; the error crate is a leaf L0 with
no reverse dependency."""

[[edge]]
from = "selis-color"
to = "selis-error"
why = """
PDF functions (SL-2.COLOR.05) return typed errors (FUNCTION_INPUT_COUNT,
FUNCTION_BUDGET) from the shared registry; the error crate is a leaf L0 with
no reverse dependency."""

[[edge]]
from = "selis-shape"
to = "selis-font"
why = """
The shaper consumes font programs and their metrics (the `Shaper` trait takes
`font_data: &[u8]`). The PDF justification formula (§9.2.7) is shared between
the shaping path (selis-shape) and the content-interpreter replay path
(selis-pdf-content → selis-font); the canonical implementation lives in
selis-font, and selis-shape re-exports it."""

[[edge]]
from = "selis-image"
to = "selis-pdf-filter"
why = """
Image XObjects are decoded through the stream filters (Flate, DCTDecode,
JPXDecode); the image crate orchestrates codec selection but never re-implements
a codec. Filter is a leaf L2 crate with no reverse dependency."""

# ---------------------------------------------------------------------------
# check-purity (SL-0.WS.04) — ADR-P0005 / P0011 / P0016.
# No crate at L0–L3 may name a filesystem, network, clock, or environment API.
# ---------------------------------------------------------------------------
[purity]
banned = [
    "std::fs",
    "std::net",
    "std::env",
    "std::process",
    "std::time::Instant",
    "std::time::SystemTime",
    "reqwest",
    "tokio::net",
    "ureq",
]

# Crates exempt from a specific banned path, with the reason.
[[purity_allow]]
crate = "selis-io"
paths = ["std::fs", "std::env", "std::process"]
why = """
FileSource / FileSink are the shipped native DocSource+DocSink implementations
and are compiled only under the `native-io` feature. They exist precisely so
that no crate above L1 needs to name the filesystem. WASM builds exclude them.
Tests use env/process for temp dirs and unique file names."""

[[purity_allow]]
crate = "selis-sandbox"
paths = ["std::time::Instant"]
why = """
`InstantClock` (SL-0.SBX.07) is the one sanctioned clock adapter: defined in
the sandbox so every L4/L5 shell shares a single audited `std::time::Instant`
wrapper instead of growing its own. Construction is restricted to shells by
the `instant-clock` cargo feature (a platform capability L0-L3 crates do not
enable — they receive `&dyn Clock` from their caller), and the module is
compiled out for wasm32, where the browser shell wraps `performance.now`
(ADR-P0011). The kernel itself (`Budget`, `BudgetGuard`, cancellation) never
names it."""
