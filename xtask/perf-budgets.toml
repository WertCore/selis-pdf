# Performance budgets — 03-CONVENTIONS.md §12, SL-0.PERF.02.
#
# Every path in §12 gets an entry here. `metric` selects the measurement the
# budget applies to:
#   mean-ns        — criterion mean wall time in nanoseconds (`xtask bench`)
#   ratio          — unitless throughput ratio against PDFium (>= min)
#   percent        — a percentage (frame budget misses, differing pixels)
#   bytes          — peak memory in bytes
#   duration-ms    — an end-to-end latency in milliseconds
#
# `status` records measurability honestly:
#   measuring      — a benchmark exists and the budget is enforced now.
#   not-measurable — no benchmark exists yet; the budget FAILS as
#                    `not implemented` (never passes silently) until a
#                    benchmark lands. Wired into CI as a warning; flips to a
#                    hard gate per artifact as benchmarks appear.
#
# `bench` is the criterion benchmark name for metric=mean-ns.
# `gate` selects the regression comparison for measuring rows:
#   baseline-2     — fails when the current mean exceeds the recorded
#                    bench/baselines.json mean by >5% (03-CONVENTIONS.md §9
#                    release rule; the historical 2% figure was unrunnable
#                    on noisy hardware).
#   none           — absolute budget only.
#
# For the kernel/cache micro-rows the absolute `budget` is 2x the recorded
# reference-machine baseline (cross-machine noise headroom); the enforced
# limit is the 5% baseline regression gate (03-CONVENTIONS.md §9). Reference
# machine: bench/README.md.

[[budget]]
path     = "budget_charge (sandbox kernel charge)"
section  = "budget kernel"
metric   = "mean-ns"
budget   = 40
bench    = "budget_charge"
status   = "measuring"
gate     = "baseline-2"

