<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>selis browser harness - app shell</title>
    <!--
      The app's own stylesheet, linked for the same reason `#selis-app` is
      present below. The printed output is decided by this file, so a harness
      that loads boot.js but not style.css can test the Print button and find
      no print rules at all - which is what happened, and it looked exactly
      like "the app ships no print stylesheet".
    -->
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <!--
      WEB.02, the part the existing `service-worker` check deliberately does not
      do: drive the REAL apps/web/host worker rather than a minimal stand-in.

      The committed `service-worker` check proves the ENGINE delivers install /
      activate / clients.claim() / respondWith. This proves the APP'S OWN worker
      does those things against the app's real precache list - and that the shell
      survives with no network, which is the DoD's actual sentence ("open a local
      PDF, view, search, print" offline; view and print are shell properties, so
      what is machine-checkable here is the shell plus its precached assets).

      The distinction matters because the two failure modes are different. The
      engine check can pass while the app worker never activates, because the
      stand-in worker only ever does three things the app worker also does. What
      only this check can catch is the app worker's own policy refusing something
      it should allow, or its precache list naming a path the build does not
      produce - which would make `addAll` fail atomically and leave the app
      permanently online-only with no error anywhere.

      The app files are served from this directory by the same harness origin,
      copied in by the xtask step that builds the host first. Serving the REAL
      files (not a fixture) is the point: a fixture would test the fixture.
    -->
    <pre id="verdict">PENDING</pre>

    <!--
      The app mounts into `#selis-app`; that is the app's contract, declared by
      apps/web/host/public/index.html. This harness page has to carry the same
      mount or the app has nowhere to draw, and the view check fails with a
      blank canvas.

      That failure is not hypothetical: this element was missing when the view
      check was first written, and the check went red with "the painted page
      reported no screen ink" while every other verdict stayed green. The app
      was right to refuse to paint into a page with no mount - the check was
      asking the app to display a document somewhere it had not been given.
    -->
    <main id="selis-app" aria-busy="true">
      <p>Loading Selis PDF Viewerâ€¦</p>
    </main>

    <!--
      The app's failure panel (SL-4.UI.12), declared by
      apps/web/host/public/index.html. This harness page REPLACES that file -
      `stage` copies the check over the app's own index.html, deliberately, so
      the page that reports the verdict is the one on disk - so it has to carry
      the panel too, exactly as it has to carry `#selis-app` above.

      It is a SIBLING of `#selis-app`, not a child, and that is load-bearing:
      boot.js rewrites `#selis-app`'s textContent when it mounts, so a panel
      inside it would be erased by the very write that precedes most failures.
    -->
    <section id="selis-failure" role="alert" aria-live="assertive" data-severity=""></section>

    <script type="module">
      // The app's own boot path does exactly this; the check mirrors it rather
      // than importing it, because the point is to observe what the app does,
      // and `__selisBoot` / `__selisServiceWorker` are the app's own globals.
      import { registerServiceWorker } from "/sw-register.js";

      // The `window.print` stub's state, at SCRIPT scope rather than inside a
      // `.then` callback. The stub is installed in one stage of the chain and
      // restored in a later one, and a `var` declared in a callback is scoped
      // to that callback - so hoisting it is what stops the restore stage from
      // throwing a ReferenceError that kills the whole check with a page that
      // simply stops reporting.
      var printReal = null;
      var printCalls = 0;
      var RESULT_PATH = "/__selis_result";
      var out = {
        schema: 1,
        check: "app-shell",
        boot: null,
        registration: null,
        controlled: null,
        scope: null,
        // Fetched with the network shape the DoD cares about: no-store, so only
        // the worker's own respondWith can answer.
        shellAsset: null,
        precacheHit: null,
        // Whether the app's OWN runtime-cached assets answer from the worker:
        // [layout.js, windowing.js, the engine].
        offlineAssets: null,
        offlineEngineBytes: null,
        offlineLayoutReal: null,
        offlineWindowingReal: null,
        // The DoD's second verb: a real <canvas> in the document, read back
        // from the browser. Null means the page was never painted.
        view: null,
        // Whether the app actually MOUNTED the viewer and the engine, from the
        // app's own `__selisApp`. Null means boot.js never got that far.
        appMounted: null,
        engineExports: null,
        engineDispatch: null,
        windowedPages: null,
        appError: null,
        // The FIRST uncaught error and the FIRST unhandled rejection, captured
        // on `window` before boot.js is imported.
        //
        //     Without these, a boot.js exception is invisible: the chain below
        //     only waits for `__selisApp` to appear, and an exception thrown
        //     during the module's own evaluation means it never does. The
        //     report then says "mount and registration never settled" and stops
        //     - which is true, and useless. This was found the hard way: a
        //     failure panel was wired in, the check went red with exactly that
        //     message, and nothing on screen or in the report said why.
        bootError: null,
        swRegistration: null,
        bootStage: null,
        watchdog: null,
        watchdogStage: null,
        watchdogApp: null,
        watchdogSw: null,
        chainMs: null,
        failure: null,
        damagedOpen: null,
        // UI.13: progress and cancellation. Recorded in stages so the Rust
        // verdict can check the claim that was true at THAT moment - a bar
        // that was honest when busy and lies once settled is still a liar.
        chromeIdle: null,
        progressAtStart: null,
        chromeAtStart: null,
        cancelRequest: null,
        captionAfterCancel: null,
        chromeAfterCancel: null,
        printAfterCancel: null,
        chromeAfterCancelSettled: null,
        failureAfterCancel: null,
        // UI.07: the axe-core scan. `null` means the scan never ran, which the
        // Rust verdict treats as a FAILURE rather than a pass — "axe-core
        // clean" is the DoD, and a run that quietly omits the scan would report
        // the item as unverified while looking green.
        a11y: null,
        // UI.07: the screen-reader walk over the accessibility tree.
        reader: null,
        // The raw structure report, for diagnosing a refused outline.
        structure: null,
        // UI.06: the bookmark outline, driven from the real engine op.
        bookmarks: null,
        firstRejection: null,
        fatal: null,
        // The result of opening a REAL PDF through the app's own document path
        // (`__selisOpen`). Null means the check never got that far.
        open: null,
        // Populated by `report()` from `networkTrace()`. It is the difference
        // between "the import failed" and "the browser never asked for it".
        trace: null,
      };

      // Installed before anything is imported, so a throw inside boot.js's own
      // module evaluation is recorded rather than lost. `once` because the
      // FIRST error is the informative one; a cascade of later ones is noise.
      window.addEventListener(
        "error",
        function (event) {
          if (out.bootError === null) {
            out.bootError = String(
              (event && (event.message || event.error)) || "unknown error",
            );
          }
        },
        true,
      );
      window.addEventListener("unhandledrejection", function (event) {
        if (out.firstRejection === null) {
          const why = event && event.reason;
          out.firstRejection = String((why && (why.message || why)) || why);
        }
      });

      // A WATCHDOG that posts whatever is known if the chain below has not
      // finished.
      //
      //     Without it, a chain that stops RESOLVING - rather than rejecting -
      //     posts nothing at all, and the harness reports only "the page did not
      //     report within 30000ms". That is the one failure shape with no
      //     evidence in it: no error, no rejection, no partial report.
      //
      //     The threshold is deliberately close to the harness's own 30s
      //     deadline (DEFAULT_TIMEOUT_MS), not to this page's fastest observed
      //     run. The chain legitimately takes well over ten seconds - it opens
      //     a document, rasterises pages at print resolution and arms an
      //     offline cut - so an early watchdog is not a safety net, it is a
      //     second deadline that fires during healthy runs and reports a
      //     failure that did not happen. It should only fire when the harness
      //     is about to give up anyway.
      //
      //     `chainMs` records how long the chain actually took, so the next
      //     person to retune this threshold does not have to guess.
      var chainStartedAt = Date.now();
      var reported = false;
      setTimeout(function () {
        if (reported) return;
        out.fatal = out.fatal || "the page did not finish its chain before the watchdog";
        out.watchdog = true;
        // Snapshot the globals NOW: by the time the harness reads the report
        // they may have settled, and the question is what they were at the
        // moment the chain stalled.
        out.watchdogStage = globalThis.__selisBootStage || "absent";
        out.watchdogApp = globalThis.__selisApp ? "present" : "absent";
        out.watchdogSw = globalThis.__selisServiceWorker === undefined ? "absent" : "present";
        out.chainMs = Date.now() - chainStartedAt;
        report();
      }, 26000);

      // bytes of a plain-text file. It exists for UI.12, because a document that
      // will not open is the commonest failure a reader meets, and the shell
      // that preceded this answered it with a single line of text and no way
      // forward.
      //
