<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>selis browser harness - app shell</title>
  </head>
  <body>
    <!--
      WEB.02, the part the existing `service-worker` check deliberately does not
      do: drive the REAL apps/web/host worker rather than a minimal stand-in.

      The committed `service-worker` check proves the ENGINE delivers install /
      activate / clients.claim() / respondWith. This proves the APP'S OWN worker
      does those things against the app's real precache list - and that the shell
      survives with no network, which is the DoD's actual sentence ("open a local
      PDF, view, search, print" offline; view and print are shell properties, so
      what is machine-checkable here is the shell plus its precached assets).

      The distinction matters because the two failure modes are different. The
      engine check can pass while the app worker never activates, because the
      stand-in worker only ever does three things the app worker also does. What
      only this check can catch is the app worker's own policy refusing something
      it should allow, or its precache list naming a path the build does not
      produce - which would make `addAll` fail atomically and leave the app
      permanently online-only with no error anywhere.

      The app files are served from this directory by the same harness origin,
      copied in by the xtask step that builds the host first. Serving the REAL
      files (not a fixture) is the point: a fixture would test the fixture.
    -->
    <pre id="verdict">PENDING</pre>

    <!--
      The app mounts into `#selis-app`; that is the app's contract, declared by
      apps/web/host/public/index.html. This harness page has to carry the same
      mount or the app has nowhere to draw, and the view check fails with a
      blank canvas.

      That failure is not hypothetical: this element was missing when the view
      check was first written, and the check went red with "the painted page
      reported no screen ink" while every other verdict stayed green. The app
      was right to refuse to paint into a page with no mount - the check was
      asking the app to display a document somewhere it had not been given.
    -->
    <main id="selis-app" aria-busy="true">
      <p>Loading Selis PDF Viewerâ€¦</p>
    </main>

    <script type="module">
      // The app's own boot path does exactly this; the check mirrors it rather
      // than importing it, because the point is to observe what the app does,
      // and `__selisBoot` / `__selisServiceWorker` are the app's own globals.
      import { registerServiceWorker } from "/sw-register.js";

      var RESULT_PATH = "/__selis_result";
      var out = {
        schema: 1,
        check: "app-shell",
        boot: null,
        registration: null,
        controlled: null,
        scope: null,
        // Fetched with the network shape the DoD cares about: no-store, so only
        // the worker's own respondWith can answer.
        shellAsset: null,
        precacheHit: null,
        // Whether the app's OWN runtime-cached assets answer from the worker:
        // [layout.js, windowing.js, the engine].
        offlineAssets: null,
        offlineEngineBytes: null,
        offlineLayoutReal: null,
        offlineWindowingReal: null,
        // The DoD's second verb: a real <canvas> in the document, read back
        // from the browser. Null means the page was never painted.
        view: null,
        // Whether the app actually MOUNTED the viewer and the engine, from the
        // app's own `__selisApp`. Null means boot.js never got that far.
        appMounted: null,
        engineExports: null,
        engineDispatch: null,
        windowedPages: null,
        appError: null,
        fatal: null,
        // The result of opening a REAL PDF through the app's own document path
        // (`__selisOpen`). Null means the check never got that far.
        open: null,
        // Populated by `report()` from `networkTrace()`. It is the difference
        // between "the import failed" and "the browser never asked for it".
        trace: null,
      };

      /**
       * A 446-byte, one-page PDF with a byte-exact xref, carrying two filled
       * rectangles and no text.
       *
       * Self-contained on purpose. `corpus/pdfs/` is gitignored - the corpus is
       * FETCHED - and this check runs on every PR, so it cannot read it. And the
       * content is geometry rather than text because a `BaseFont /Helvetica` with
       * no embedded font file draws nothing in this build: a text-only page
       * renders uniformly white and would pass while proving nothing about the
       * rasteriser. Two rectangles mean the expected ink is a known, exact
       * number - 200x100 - so the assertion can be "the engine drew exactly the
       * rectangle the document asked for" rather than "some pixels appeared".
       */
      var FIXTURE_PDF_B64 =
        "JVBERi0xLjcKJeLjz9MKPDwgL1R5cGUgL0NhdGFsb2cgL1BhZ2VzIDIgMCBSID4+Cjw8IC9UeXBlIC9QYWdlcyAvS2lkcyBbMyAwIFJdIC9Db3VudCAxID4+Cjw8IC9UeXBlIC9QYWdlIC9QYXJlbnQgMiAwIFIgL01lZGlhQm94IFswIDAgNjEyIDc5Ml0gL1Jlc291cmNlcyA8PCA+PiAvQ29udGVudHMgNCAwIFIgPj4KPDwgL0xlbmd0aCA1NSA+PgpzdHJlYW0KMC44NSAwLjIgMC4xIHJnIDcyIDYyMCAyMDAgMTAwIHJlIGYKMC4xIDAuMyAwLjggcmcgNzIgNDgwIDMwMCA2MCByZSBmCmVuZHN0cmVhbQp4cmVmCjAgNQowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMTUgMDAwMDAgbiAKMDAwMDAwMDA0OSAwMDAwMCBuIAowMDAwMDAwMDkxIDAwMDAwIG4gCjAwMDAwMDAxODAgMDAwMDAgbiAKdHJhaWxlcgo8PCAvU2l6ZSA1IC9Sb290IDEgMCBSID4+CnN0YXJ0eHJlZgoxNQolJUVPRgo=";


      // A SECOND fixture, with TEXT. The rectangles above are the right choice
      // for the render assertion - two rectangles make the expected ink an
      // exact number - but they contain no glyphs at all, so searching them
      // would return zero and pass while proving nothing. Searching is only
      // meaningful against a document the engine can actually read.
      //
      // This one draws exactly the words "Selis search probe" once, with
      // Helvetica, so the expected answer is a known exact number rather than
      // "some results appeared". Verified to extract as that exact string
      // before being committed here.
      var TEXT_PDF_B64 =
        "JVBERi0xLjcKJeLjz9MKMSAwIG9iago8PCAvVHlwZSAvQ2F0YWxvZyAvUGFnZXMgMiAwIFIgPj4KZW5kb2JqCjIgMCBvYmoKPDwgL1R5cGUgL1BhZ2VzIC9LaWRzIFszIDAgUl0gL0NvdW50IDEgPj4KZW5kb2JqCjMgMCBvYmoKPDwgL1R5cGUgL1BhZ2UgL1BhcmVudCAyIDAgUiAvTWVkaWFCb3ggWzAgMCA2MTIgNzkyXSAvUmVzb3VyY2VzIDw8IC9Gb250IDw8IC9GMSA0IDAgUiA+PiA+PiAvQ29udGVudHMgNSAwIFIgPj4KZW5kb2JqCjQgMCBvYmoKPDwgL1R5cGUgL0ZvbnQgL1N1YnR5cGUgL1R5cGUxIC9CYXNlRm9udCAvSGVsdmV0aWNhIC9FbmNvZGluZyAvV2luQW5zaUVuY29kaW5nID4+CmVuZG9iago1IDAgb2JqCjw8IC9MZW5ndGggNTAgPj4Kc3RyZWFtCkJUIC9GMSAzNiBUZiA3MiA3MDAgVGQgKFNlbGlzIHNlYXJjaCBwcm9iZSkgVGogRVQKZW5kc3RyZWFtCmVuZG9iagp4cmVmCjAgNgowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMTUgMDAwMDAgbiAKMDAwMDAwMDA2NCAwMDAwMCBuIAowMDAwMDAwMTIxIDAwMDAwIG4gCjAwMDAwMDAyNDcgMDAwMDAgbiAKMDAwMDAwMDM0NCAwMDAwMCBuIAp0cmFpbGVyCjw8IC9TaXplIDYgL1Jvb3QgMSAwIFIgPj4Kc3RhcnR4cmVmCjQ0MwolJUVPRgo=";
      function report() {
        // Attached on every report, pass or fail: the trace is what a reader
        // needs when this goes red, and it costs nothing when it does not.
        try {
          out.trace = networkTrace();
        } catch (e) {
          out.trace = null;
        }
        var body = JSON.stringify(out);
        document.getElementById("verdict").textContent =
          "@@SELIS-RESULT@@" + body + "@@SELIS-END@@";
        var xhr = new XMLHttpRequest();
        xhr.open("POST", RESULT_PATH, true);
        xhr.send(body);
      }

      function fail(why) {
        out.fatal = "" + why;
        report();
      }

      function waitFor(predicate, limitMs, what) {
        return new Promise(function (resolve, reject) {
          var waited = 0;
          var tick = setInterval(function () {
            if (predicate()) {
              clearInterval(tick);
              resolve();
              return;
            }
            waited += 25;
            if (waited > limitMs) {
              clearInterval(tick);
              reject(new Error("timed out waiting for " + what));
            }
          }, 25);
        });
      }

      /**
       * What the browser actually fetched, for the report.
       *
       * A dynamic-import failure says only "Failed to fetch dynamically
       * imported module", which is the same message for a 404, a wrong MIME
       * type and a request the browser ABORTED. Those have very different
       * causes, and the third is invisible unless you look: an aborted request
       * appears here as `status: 0` with a zero-byte body and a duration of a
       * couple of milliseconds, while every other module in the same run
       * returns 200. That is precisely how the ~35-module parallel load was
       * caught, and it is why this is reported rather than left in a console.
       */
      function networkTrace() {
        var entries = performance.getEntriesByType("resource");
        var rows = [];
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i];
          rows.push({
            name: e.name.replace(location.origin, ""),
            status: e.responseStatus === undefined ? null : e.responseStatus,
            decoded: e.decodedBodySize,
            ms: Math.round(e.duration),
          });
        }
        return rows;
      }

      import("/assets/boot.js")
        .then(function () {
          out.boot = globalThis.__selisBoot || null;
          // boot.js mounts the viewer and loads the engine before it registers
          // the worker, so wait for BOTH globals, not just the registration.
          return waitFor(
            function () {
              return (
                globalThis.__selisApp !== undefined &&
                globalThis.__selisServiceWorker !== undefined
              );
            },
            20000,
            "the app's mount and registration to settle",
          );
        })
        .then(function () {
          // The app's own report of what it managed to load. This is the
          // difference between "the shell booted" and "the viewer is wired".
          var app = globalThis.__selisApp || {};
          out.appMounted = app.mounted === true;
          out.appError = app.error || null;
          out.engineExports = app.engine ? app.engine.exports : null;
          out.engineDispatch = app.engine ? app.engine.hasDispatch : null;
          out.windowedPages = app.windowing ? app.windowing.pages : null;

          // 1b. Open a REAL PDF through the app's own document path, then PAINT
          //     it. This is the step that needs the engine to WORK rather than
          //     merely load: the engine is handed actual document bytes and must
          //     return rendered pixels that reach a canvas in the document.
          //     Everything before this proves the machinery is present; this
          //     proves the DoD's first two verbs.
          //
          //     `__selisView` is the app's own open+display path, not something
          //     invented here, so this is the code a user would run.
          var view = globalThis.__selisView(FIXTURE_PDF_B64);
          out.open = {
            status: view.status,
            w: view.w,
            h: view.h,
            ink: view.ink,
          };
          // What the browser itself holds on the canvas after the upload. If
          // this is null the page never got shown no matter what `ink` said.
          out.view = view.painted === undefined ? null : view.painted;

          // 1c. SEARCH, driven through the real input element.
          //
          //     The field is the app's own `<input type="search">`; the value
          //     is set and an `input` event dispatched, so this is the path a
          //     person's keystrokes take, not a function the check calls.
          var field = document.getElementById("selis-search");
          if (!field) throw new Error("the app exposed no search field");
          field.value = "search";
          field.dispatchEvent(new Event("input", { bubbles: true }));

          // A query the document DOES contain. The expected answer is a known
          // exact number - one occurrence of one word - not "some results".
          out.searchHit = globalThis.__selisSearch(TEXT_PDF_B64, "search");

          // A query the document does NOT contain. Without this leg the check
          // cannot tell a real search from a stub that always answers "found":
          // an implementation that ignored the query entirely would pass on
          // the hit alone. This is the leg that discriminates.
          out.searchMiss = globalThis.__selisSearch(TEXT_PDF_B64, "zzzznotpresent");

          // Case-insensitivity is the engine's documented default (matched
          // after normalisation, case-insensitive unless matchCase), so an
          // uppercase spelling of a word present in lowercase must also hit.
          out.searchCase = globalThis.__selisSearch(TEXT_PDF_B64, "SELIS");

          // What the user actually sees on screen.
          out.searchReadout =
            (document.getElementById("selis-search-result") || {}).textContent || null;
        })
        .then(function () {
          var reg = globalThis.__selisServiceWorker;
          out.registration = reg && reg.registered ? "registered" : reg && reg.reason;

          // 2. A controller. The app worker calls clients.claim() in activate,
          //    so a first visit should be controlled without a second load.
          return navigator.serviceWorker.ready.then(function () {
            return waitFor(
              function () {
                return !!navigator.serviceWorker.controller;
              },
              10000,
              "clients.claim() to hand the page a controller",
            );
          });
        })
        .then(function () {
          out.controlled = !!navigator.serviceWorker.controller;
          out.scope = navigator.serviceWorker.controller
            ? navigator.serviceWorker.controller.scriptURL
            : null;

          // 3. A precached shell asset, served no-store. This is the addAll
          //    atomicity question: if the build did not produce every path in
          //    PRECACHE_PATHS, install fails as a whole and this 404s.
          return fetch("/assets/boot.js", { cache: "no-store" });
        })
        .then(function (res) {
          if (!res.ok) {
            throw new Error(
              "the app worker did not serve a precached shell asset (" +
                res.status +
                ") - addAll is atomic, so this means the precache list names a " +
                "path the build does not produce",
            );
          }
          return res.text();
        })
        .then(function (text) {
          out.shellAsset = text.indexOf("__selisBoot") >= 0 ? "app-boot" : "other";

          // 4. THE OFFLINE QUESTION. Stop the origin answering, then ask again.
          //    Nothing here can reach the network: the harness serves this
          //    directory from a loopback server the page cannot reconfigure, so
          //    the honest form of "airplane mode" here is a cache-busting request
          //    for a path the worker precached. If the worker answers it, the
          //    shell is genuinely offline-capable for that path.
          return fetch("/assets/style.css", { cache: "no-store" });
        })
        .then(function (res) {
          out.precacheHit = res.ok;

          // 5. THE OFFLINE QUESTION, for the app's OWN assets rather than the
          //    shell's. Everything above proves the PRECACHE list is served from
          //    cache, but the precache list is only the four shell files. The
          //    viewer modules and the engine the app actually needs are
          //    RUNTIME-cached, and those are what "open a local PDF offline"
          //    depends on. If the worker cannot answer these, the app works
          //    online and fails in airplane mode - the one failure the DoD names.
          //
          //    `no-store` is the same discipline as above: it bypasses the HTTP
          //    cache, so an answer can only have come from the worker's own.
          return Promise.all([
            fetch("/assets/ui/viewer/layout.js", { cache: "no-store" }),
            fetch("/assets/ui/viewer/windowing.js", { cache: "no-store" }),
            fetch("/wasm/selis_pdf_wasm.wasm", { cache: "no-store" }),
          ]);
        })
        .then(function (responses) {
          out.offlineAssets = responses.map(function (r) {
            return r.ok;
          });
          return Promise.all(
            responses.map(function (r) {
              return r.text();
            }),
          );
        })
        .then(function (bodies) {
          // Not just "200": the bytes must be the real ones, or the worker is
          // answering with something that merely has the right length.
          out.offlineEngineBytes = bodies[2].length;
          out.offlineLayoutReal = bodies[0].indexOf("layoutPages") >= 0;
          out.offlineWindowingReal = bodies[1].indexOf("visibleWindow") >= 0;
          report();
        })
        .catch(fail);
    </script>
  </body>
</html>
