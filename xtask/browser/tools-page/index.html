<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>selis browser harness - tools page</title>
    <style>
      iframe { width: 1100px; height: 900px; border: 1px solid #ccc; }
      #verdict { font: 14px monospace; }
    </style>
  </head>
  <body>
    <!-- @@SELIS-RESULT@@: the harness stages this page over the app's own index.html. -->
    <pre id="verdict">PENDING</pre>
    <iframe id="tools" src="about:blank" title="Selis tools page"></iframe>
    <script type="module">
      // The tools page is the product surface: it is loaded as the REAL
      // `/tools.html` from the staged app tree inside this same-origin frame.
      // This harness page only drives the DOM and reports, so a test cannot
      // pass by exercising a fixture that re-implements the page.
      //
      // Two legs, because "works online" and "works in airplane mode" are
      // different claims (SL-4.TOOLS.05):
      //
      //   1. load the real page, wait for its own worker registration to claim
      //      it, then merge and mix PDFs, run the split-every, split-size, and
      //      split-bookmark modes, duplicate a page, insert a blank page, stamp
      //      page numbers, a watermark, a header/footer and Bates numbers,
      //      compress a PDF, crop and flip pages, set page labels, resize pages,
      //      extract embedded attachments, and remove metadata;
      //   2. flip the harness origin's offline switch, reload the SAME page,
      //      and repeat those runs. Every module, the CSS, and the tools WASM
      //      chunk must come back from the worker's cache; the origin answers
      //      503.
      const out = { schema: 1, check: "tools-page" };
      let posted = false;

      function post() {
        if (posted) return;
        posted = true;
        fetch("/__selis_result", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(out),
        });
      }

      function fail(error) {
        out.fatal = String((error && error.stack) || error);
        post();
      }

      function waitFor(probe, timeoutMs, label) {
        return new Promise((resolve, reject) => {
          const started = performance.now();
          const tick = () => {
            let value = false;
            try {
              value = probe();
            } catch (_) {
              value = false;
            }
            if (value) {
              resolve(value);
              return;
            }
            if (performance.now() - started > timeoutMs) {
              reject(new Error("timed out waiting for " + label));
              return;
            }
            setTimeout(tick, 40);
          };
          tick();
        });
      }

      function withTimeout(promise, timeoutMs, label) {
        let timer;
        return Promise.race([
          promise,
          new Promise((_, reject) => {
            timer = setTimeout(
              () => reject(new Error("timed out waiting for " + label)),
              timeoutMs,
            );
          }),
        ]).finally(() => clearTimeout(timer));
      }

      function waitForLoad(frame) {
        return new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener(
            "error",
            () => reject(new Error("the tools iframe failed to load")),
            { once: true },
          );
        });
      }

      function frameDocument(frame) {
        const current = frame.contentDocument;
        if (!current) throw new Error("the tools iframe has no document");
        return current;
      }

      function readNetwork(win) {
        // Resource Timing is the page's own account of every subresource it
        // fetched. All of them must be this origin; no document body is
        // observable here, which is why the page's recorder assertion is the
        // other half of the network claim.
        const resources = win.performance
          .getEntriesByType("resource")
          .map((entry) => entry.name)
          .filter((name) => name.startsWith("http"));
        const origin = win.location.origin;
        return {
          origin,
          resources: resources.length,
          foreign: resources.filter((name) => new URL(name).origin !== origin),
          paths: resources.map((name) => new URL(name).pathname).sort(),
        };
      }

      async function waitForCards(frame, label) {
        await waitFor(
          () => frameDocument(frame).querySelectorAll("#tool-grid .tool-card").length === 18,
          15_000,
          label,
        );
        return frameDocument(frame).querySelectorAll("#tool-grid .tool-card").length;
      }

      async function readOutput(win, row, label, needles, absent) {
        const download = row.querySelector("a.primary-link");
        if (!download) throw new Error("a result row had no download link (" + label + ")");
        const preview = row.querySelector("a.text-button");
        const href = download.getAttribute("href") || "";
        const output = {
          kind: row.dataset.kind || "",
          name: row.dataset.name || "",
          pages: Number(row.dataset.pages || "0"),
          overTarget: row.dataset.overTarget === "true",
          declaredBytes: Number(row.dataset.bytes || "0"),
          blob: href.startsWith("blob:"),
          previewBlob: preview
            ? (preview.getAttribute("href") || "").startsWith("blob:")
            : null,
          downloadName: download.getAttribute("download"),
        };
        if (!output.blob) throw new Error("the download was not a Blob URL (" + label + ")");
        const bytes = new Uint8Array(await fetch(href).then((r) => r.arrayBuffer()));
        output.bytes = bytes.length;
        output.header = new TextDecoder().decode(bytes.subarray(0, 5));
        if (output.kind === "file") {
          output.text = new TextDecoder("latin1").decode(bytes.subarray(0, 256));
        }
        output.zip =
          bytes.length >= 4 &&
          bytes[0] === 0x50 &&
          bytes[1] === 0x4b &&
          bytes[2] === 0x03 &&
          bytes[3] === 0x04;
        if (needles && needles.length > 0) {
          const text = new TextDecoder("latin1").decode(bytes);
          output.found = needles.map((needle) => text.includes(needle));
        }
        if (absent && absent.length > 0) {
          const text = new TextDecoder("latin1").decode(bytes);
          // Each entry records whether the removed text is STILL present, so a
          // `false` is the pass: the browser-side output proves the bytes the
          // operation was supposed to drop are gone from the actual download.
          output.absentFound = absent.map((needle) => text.includes(needle));
        }
        return output;
      }

      async function readResult(frame, label, needles, absent) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        const result = {
          title: doc.getElementById("result-title").textContent.trim(),
          meta: doc.getElementById("result-meta").textContent.trim(),
          rows: Array.from(doc.querySelectorAll("#result-rows .result-row")).map(
            (row) => ({
              label: row.querySelector("dt").textContent.trim(),
              value: row.querySelector("dd").textContent.trim(),
            }),
          ),
        };
        const outputs = [];
        for (const row of doc.querySelectorAll("#result-outputs .output-row")) {
          outputs.push(await readOutput(win, row, label, needles, absent));
        }
        return {
          result,
          outputs,
          output: outputs.find((output) => output.kind === "pdf") || null,
        };
      }

      async function attachFiles(frame, fixture, name, label, count) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        const makeFile = (fileName) =>
          new win.File([fixture.slice(0)], fileName, { type: "application/pdf" });
        const transfer = new win.DataTransfer();
        if (count === 1) {
          transfer.items.add(makeFile(name));
        } else {
          transfer.items.add(makeFile("alpha.pdf"));
          transfer.items.add(makeFile("beta.pdf"));
        }
        const input = doc.getElementById("file-input");
        input.files = transfer.files;
        input.dispatchEvent(new win.Event("change", { bubbles: true }));
        await waitFor(
          () => doc.querySelectorAll("#file-list .file-row").length === count,
          5_000,
          count + " selected PDF(s) (" + label + ")",
        );
        return doc.querySelectorAll("#file-list .file-row").length;
      }

      async function attachPair(frame, first, firstName, second, secondName, label) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        const transfer = new win.DataTransfer();
        transfer.items.add(
          new win.File([first.slice(0)], firstName, { type: "application/pdf" }),
        );
        transfer.items.add(
          new win.File([second.slice(0)], secondName, { type: "application/pdf" }),
        );
        const input = doc.getElementById("file-input");
        input.files = transfer.files;
        input.dispatchEvent(new win.Event("change", { bubbles: true }));
        await waitFor(
          () => doc.querySelectorAll("#file-list .file-row").length === 2,
          5_000,
          "two selected PDFs (" + label + ")",
        );
        return doc.querySelectorAll("#file-list .file-row").length;
      }

      async function mergeInFrame(frame, fixture, label) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        const merge = doc.querySelector('[data-tool="merge"]');
        if (!merge) throw new Error("the page offered no Merge card");
        merge.click();
        await waitFor(
          () => !doc.getElementById("workspace").hidden,
          5_000,
          "the merge workspace (" + label + ")",
        );

        const fileRows = await attachFiles(frame, fixture, "alpha.pdf", label, 2);
        const run = doc.getElementById("run-tool");
        await waitFor(() => !run.disabled, 5_000, "the Merge button to enable (" + label + ")");
        const runLabel = run.textContent.trim();
        run.click();

        await waitFor(
          () =>
            doc.documentElement.dataset.noUpload === "verified" &&
            !doc.getElementById("result").hidden,
          30_000,
          "the merge result and the no-upload assertion (" + label + ")",
        );

        const read = await readResult(frame, label);
        return {
          win,
          fileRows,
          runLabel,
          noUpload: doc.documentElement.dataset.noUpload,
          status: doc.getElementById("status").textContent.trim(),
          result: read.result,
          outputs: read.outputs,
          output: read.output,
          network: readNetwork(win),
        };
      }

      async function mixInFrame(frame, first, firstName, second, secondName, label) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        if (doc.getElementById("tools").hidden) {
          doc.getElementById("back-to-tools").click();
          await waitFor(
            () => !doc.getElementById("tools").hidden,
            5_000,
            "the tools grid (" + label + ")",
          );
        }
        const mix = doc.querySelector('[data-tool="mix"]');
        if (!mix) throw new Error("the page offered no Mix pages card");
        mix.click();
        await waitFor(
          () => !doc.getElementById("workspace").hidden,
          5_000,
          "the mix workspace (" + label + ")",
        );

        const fileRows = await attachPair(frame, first, firstName, second, secondName, label);
        const run = doc.getElementById("run-tool");
        await waitFor(() => !run.disabled, 5_000, "the Mix pages button to enable (" + label + ")");
        const runLabel = run.textContent.trim();
        run.click();

        await waitFor(
          () =>
            doc.documentElement.dataset.noUpload === "verified" &&
            !doc.getElementById("result").hidden,
          30_000,
          "the mix result and the no-upload assertion (" + label + ")",
        );

        const read = await readResult(frame, label);
        return {
          win,
          fileRows,
          runLabel,
          noUpload: doc.documentElement.dataset.noUpload,
          status: doc.getElementById("status").textContent.trim(),
          result: read.result,
          outputs: read.outputs,
          output: read.output,
          network: readNetwork(win),
        };
      }

      async function splitInFrame(frame, fixture, fixtureName, label, splitMode, inputs) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        if (doc.getElementById("tools").hidden) {
          doc.getElementById("back-to-tools").click();
          await waitFor(
            () => !doc.getElementById("tools").hidden,
            5_000,
            "the tools grid (" + label + ")",
          );
        }
        const split = doc.querySelector('[data-tool="split"]');
        if (!split) throw new Error("the page offered no Split card");
        split.click();
        await waitFor(
          () => !doc.getElementById("workspace").hidden,
          5_000,
          "the split workspace (" + label + ")",
        );

        const mode = doc.getElementById("option-mode");
        mode.value = splitMode;
        mode.dispatchEvent(new win.Event("change", { bubbles: true }));
        if (inputs.every !== undefined) {
          const everyInput = doc.getElementById("option-every");
          everyInput.value = String(inputs.every);
          everyInput.dispatchEvent(new win.Event("input", { bubbles: true }));
        }
        if (inputs.target !== undefined) {
          const targetInput = doc.getElementById("option-target");
          targetInput.value = String(inputs.target);
          targetInput.dispatchEvent(new win.Event("input", { bubbles: true }));
        }

        const fileRows = await attachFiles(frame, fixture, fixtureName, label, 1);
        const run = doc.getElementById("run-tool");
        await waitFor(() => !run.disabled, 5_000, "the Split button to enable (" + label + ")");
        const runLabel = run.textContent.trim();
        run.click();

        await waitFor(
          () =>
            doc.documentElement.dataset.noUpload === "verified" &&
            !doc.getElementById("result").hidden,
          30_000,
          "the split result and the no-upload assertion (" + label + ")",
        );

        const read = await readResult(frame, label);
        return {
          win,
          fileRows,
          runLabel,
          noUpload: doc.documentElement.dataset.noUpload,
          status: doc.getElementById("status").textContent.trim(),
          result: read.result,
          outputs: read.outputs,
          output: read.output,
          network: readNetwork(win),
        };
      }

      async function organizeInFrame(frame, fixture, fixtureName, label, organizeMode, inputs) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        if (doc.getElementById("tools").hidden) {
          doc.getElementById("back-to-tools").click();
          await waitFor(
            () => !doc.getElementById("tools").hidden,
            5_000,
            "the tools grid (" + label + ")",
          );
        }
        const organize = doc.querySelector('[data-tool="reorder"]');
        if (!organize) throw new Error("the page offered no Organize pages card");
        organize.click();
        await waitFor(
          () => !doc.getElementById("workspace").hidden,
          5_000,
          "the organize workspace (" + label + ")",
        );

        const mode = doc.getElementById("option-mode");
        mode.value = organizeMode;
        mode.dispatchEvent(new win.Event("change", { bubbles: true }));
        for (const [key, value] of Object.entries(inputs)) {
          const field = doc.getElementById("option-" + key);
          if (!field) throw new Error("the organize page offered no " + key + " field");
          field.value = String(value);
          field.dispatchEvent(new win.Event("input", { bubbles: true }));
        }

        const fileRows = await attachFiles(frame, fixture, fixtureName, label, 1);
        const run = doc.getElementById("run-tool");
        await waitFor(() => !run.disabled, 5_000, "the Organize button to enable (" + label + ")");
        const runLabel = run.textContent.trim();
        run.click();

        await waitFor(
          () =>
            doc.documentElement.dataset.noUpload === "verified" &&
            !doc.getElementById("result").hidden,
          30_000,
          "the organize result and the no-upload assertion (" + label + ")",
        );

        const read = await readResult(frame, label);
        return {
          win,
          fileRows,
          runLabel,
          noUpload: doc.documentElement.dataset.noUpload,
          status: doc.getElementById("status").textContent.trim(),
          result: read.result,
          outputs: read.outputs,
          output: read.output,
          network: readNetwork(win),
        };
      }

      async function toolInFrame(
        frame,
        fixture,
        fixtureName,
        label,
        toolId,
        inputs,
        needles,
        absent,
      ) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        if (doc.getElementById("tools").hidden) {
          doc.getElementById("back-to-tools").click();
          await waitFor(
            () => !doc.getElementById("tools").hidden,
            5_000,
            "the tools grid (" + label + ")",
          );
        }
        const card = doc.querySelector('[data-tool="' + toolId + '"]');
        if (!card) throw new Error("the page offered no " + toolId + " card");
        card.click();
        await waitFor(
          () => !doc.getElementById("workspace").hidden,
          5_000,
          "the " + toolId + " workspace (" + label + ")",
        );

        for (const [key, value] of Object.entries(inputs || {})) {
          const field = doc.getElementById("option-" + key);
          if (!field) throw new Error("the " + toolId + " page offered no " + key + " field");
          field.value = String(value);
          field.dispatchEvent(new win.Event("input", { bubbles: true }));
          field.dispatchEvent(new win.Event("change", { bubbles: true }));
        }

        const fileRows = await attachFiles(frame, fixture, fixtureName, label, 1);
        const run = doc.getElementById("run-tool");
        await waitFor(() => !run.disabled, 5_000, "the " + toolId + " button to enable");
        const runLabel = run.textContent.trim();
        run.click();

        await waitFor(
          () =>
            doc.documentElement.dataset.noUpload === "verified" &&
            !doc.getElementById("result").hidden,
          30_000,
          "the " + toolId + " result and the no-upload assertion (" + label + ")",
        );

        const read = await readResult(frame, label, needles, absent);
        return {
          win,
          fileRows,
          runLabel,
          noUpload: doc.documentElement.dataset.noUpload,
          status: doc.getElementById("status").textContent.trim(),
          result: read.result,
          outputs: read.outputs,
          output: read.output,
          network: readNetwork(win),
        };
      }

      const watchdog = setTimeout(
        () => fail(new Error("the tools page did not finish inside 180s")),
        180_000,
      );

      (async () => {
        const frame = document.getElementById("tools");
        const firstLoad = waitForLoad(frame);
        frame.src = "/tools.html";
        await firstLoad;
        const win = frame.contentWindow;
        if (!win) throw new Error("the tools iframe had no window");
        out.cards = await waitForCards(frame, "the eighteen tool cards");
        out.pageTitle = frameDocument(frame).title;

        // The page registers the worker itself. Wait for that registration to
        // finish and for the worker to claim THIS document, so the online merge
        // is already running behind the same request path the offline reload
        // will use. A page that forgot to register fails here, not silently
        // passes an online-only run.
        await waitFor(
          () => frameDocument(frame).documentElement.dataset.sw !== undefined,
          10_000,
          "the page's service-worker registration result",
        );
        out.sw = {
          registration: frameDocument(frame).documentElement.dataset.sw,
          script: win.navigator.serviceWorker?.controller?.scriptURL || null,
        };
        if (out.sw.registration !== "registered") {
          throw new Error("the tools page did not register its worker: " + out.sw.registration);
        }
        await withTimeout(win.navigator.serviceWorker.ready, 20_000, "the worker to activate");
        await waitFor(
          () => win.navigator.serviceWorker.controller !== null,
          10_000,
          "the worker to claim the tools page",
        );
        out.sw.controlled = win.navigator.serviceWorker.controller !== null;
        out.sw.script = win.navigator.serviceWorker.controller?.scriptURL || null;

        const fixture = await fetch("one.pdf").then((r) => {
          if (!r.ok) throw new Error("one.pdf fixture returned " + r.status);
          return r.arrayBuffer();
        });
        const splitFixture = await fetch("report.pdf").then((r) => {
          if (!r.ok) throw new Error("report.pdf fixture returned " + r.status);
          return r.arrayBuffer();
        });
        const outlinedFixture = await fetch("outlined.pdf").then((r) => {
          if (!r.ok) throw new Error("outlined.pdf fixture returned " + r.status);
          return r.arrayBuffer();
        });
        const attachmentsFixture = await fetch("attachments.pdf").then((r) => {
          if (!r.ok) throw new Error("attachments.pdf fixture returned " + r.status);
          return r.arrayBuffer();
        });
        const metadataFixture = await fetch("metadata.pdf").then((r) => {
          if (!r.ok) throw new Error("metadata.pdf fixture returned " + r.status);
          return r.arrayBuffer();
        });

        const online = await mergeInFrame(frame, fixture, "online");
        out.fileRows = online.fileRows;
        out.runLabel = online.runLabel;
        out.noUpload = online.noUpload;
        out.status = online.status;
        out.result = online.result;
        out.output = online.output;
        out.outputs = online.outputs;
        out.network = online.network;

        const onlineMix = await mixInFrame(
          frame,
          splitFixture,
          "report.pdf",
          fixture,
          "one.pdf",
          "online mix",
        );
        out.mix = {
          fileRows: onlineMix.fileRows,
          runLabel: onlineMix.runLabel,
          noUpload: onlineMix.noUpload,
          status: onlineMix.status,
          result: onlineMix.result,
          outputs: onlineMix.outputs,
          output: onlineMix.output,
          network: onlineMix.network,
        };

        const onlineSplit = await splitInFrame(
          frame,
          splitFixture,
          "report.pdf",
          "online split",
          "every",
          { every: 1 },
        );
        out.split = {
          fileRows: onlineSplit.fileRows,
          runLabel: onlineSplit.runLabel,
          noUpload: onlineSplit.noUpload,
          status: onlineSplit.status,
          result: onlineSplit.result,
          outputs: onlineSplit.outputs,
          network: onlineSplit.network,
        };

        const onlineSize = await splitInFrame(
          frame,
          outlinedFixture,
          "outlined.pdf",
          "online size split",
          "size",
          { target: "0.001" },
        );
        out.splitSize = {
          fileRows: onlineSize.fileRows,
          runLabel: onlineSize.runLabel,
          noUpload: onlineSize.noUpload,
          status: onlineSize.status,
          result: onlineSize.result,
          outputs: onlineSize.outputs,
          network: onlineSize.network,
        };

        const onlineBookmarks = await splitInFrame(
          frame,
          outlinedFixture,
          "outlined.pdf",
          "online bookmark split",
          "bookmarks",
          {},
        );
        out.splitBookmarks = {
          fileRows: onlineBookmarks.fileRows,
          runLabel: onlineBookmarks.runLabel,
          noUpload: onlineBookmarks.noUpload,
          status: onlineBookmarks.status,
          result: onlineBookmarks.result,
          outputs: onlineBookmarks.outputs,
          network: onlineBookmarks.network,
        };

        const onlineDuplicate = await organizeInFrame(
          frame,
          outlinedFixture,
          "outlined.pdf",
          "online duplicate",
          "duplicate",
          { pages: "1" },
        );
        out.duplicate = {
          fileRows: onlineDuplicate.fileRows,
          runLabel: onlineDuplicate.runLabel,
          noUpload: onlineDuplicate.noUpload,
          status: onlineDuplicate.status,
          result: onlineDuplicate.result,
          outputs: onlineDuplicate.outputs,
          output: onlineDuplicate.output,
          network: onlineDuplicate.network,
        };

        const onlineBlanks = await organizeInFrame(
          frame,
          outlinedFixture,
          "outlined.pdf",
          "online blank pages",
          "blank",
          { after: "1", count: "1" },
        );
        out.blanks = {
          fileRows: onlineBlanks.fileRows,
          runLabel: onlineBlanks.runLabel,
          noUpload: onlineBlanks.noUpload,
          status: onlineBlanks.status,
          result: onlineBlanks.result,
          outputs: onlineBlanks.outputs,
          output: onlineBlanks.output,
          network: onlineBlanks.network,
        };

        const onlineNumbers = await toolInFrame(
          frame,
          splitFixture,
          "report.pdf",
          "online page numbers",
          "page_numbers",
          { pages: "1,3", start: "5", format: "fraction" },
          ["(5/3) Tj", "(6/3) Tj"],
        );
        out.pageNumbers = {
          fileRows: onlineNumbers.fileRows,
          runLabel: onlineNumbers.runLabel,
          noUpload: onlineNumbers.noUpload,
          status: onlineNumbers.status,
          result: onlineNumbers.result,
          outputs: onlineNumbers.outputs,
          output: onlineNumbers.output,
          network: onlineNumbers.network,
        };

        const onlineWatermark = await toolInFrame(
          frame,
          outlinedFixture,
          "outlined.pdf",
          "online watermark",
          "watermark",
          { text: "CONFIDENTIAL", opacity: "0.35", pages: "2" },
          ["(CONFIDENTIAL) Tj", "/SelisOverlayGS gs"],
        );
        out.watermark = {
          fileRows: onlineWatermark.fileRows,
          runLabel: onlineWatermark.runLabel,
          noUpload: onlineWatermark.noUpload,
          status: onlineWatermark.status,
          result: onlineWatermark.result,
          outputs: onlineWatermark.outputs,
          output: onlineWatermark.output,
          network: onlineWatermark.network,
        };

        const onlineHeaderFooter = await toolInFrame(
          frame,
          splitFixture,
          "report.pdf",
          "online header/footer",
          "header_footer",
          {
            "header-left": "Page {page} of {pages}",
            "header-center": "Center",
            "footer-right": "Draft",
          },
          ["(Page 1 of 3) Tj", "(Center) Tj", "(Draft) Tj"],
        );
        out.headerFooter = {
          fileRows: onlineHeaderFooter.fileRows,
          runLabel: onlineHeaderFooter.runLabel,
          noUpload: onlineHeaderFooter.noUpload,
          status: onlineHeaderFooter.status,
          result: onlineHeaderFooter.result,
          outputs: onlineHeaderFooter.outputs,
          output: onlineHeaderFooter.output,
          network: onlineHeaderFooter.network,
