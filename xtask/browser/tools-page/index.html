<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>selis browser harness - tools page</title>
    <style>
      iframe { width: 1100px; height: 900px; border: 1px solid #ccc; }
      #verdict { font: 14px monospace; }
    </style>
  </head>
  <body>
    <!-- @@SELIS-RESULT@@: the harness stages this page over the app's own index.html. -->
    <pre id="verdict">PENDING</pre>
    <iframe id="tools" src="about:blank" title="Selis tools page"></iframe>
    <script type="module">
      // The tools page is the product surface: it is loaded as the REAL
      // `/tools.html` from the staged app tree inside this same-origin frame.
      // This harness page only drives the DOM and reports, so a test cannot
      // pass by exercising a fixture that re-implements the page.
      //
      // Two legs, because "works online" and "works in airplane mode" are
      // different claims (SL-4.TOOLS.05):
      //
      //   1. load the real page, wait for its own worker registration to claim
      //      it, then merge and mix PDFs, run the split-every, split-size, and
      //      split-bookmark modes, duplicate a page, insert a blank page, stamp
      //      page numbers, a watermark, a header/footer and Bates numbers,
      //      compress a PDF, crop and flip pages, set page labels, resize pages,
      //      place them N-up, extract embedded attachments, report a document's
      //      metadata as JSON, and remove metadata;
      //   2. flip the harness origin's offline switch, reload the SAME page,
      //      and repeat those runs. Every module, the CSS, and the tools WASM
      //      chunk must come back from the worker's cache; the origin answers
      //      503.
      const out = { schema: 1, check: "tools-page" };
      let posted = false;

      function post() {
        if (posted) return;
        posted = true;
        fetch("/__selis_result", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(out),
        });
      }

      function fail(error) {
        out.fatal = String((error && error.stack) || error);
        // How far the driver got is the useful half of a failure: which cards it
        // had already opened when it stopped.
        out.clicked = clickRecord();
        post();
      }

      function pageSaid() {
        try {
          const doc = document.getElementById("tools").contentDocument;
          const status = doc && doc.getElementById("status");
          const text = status ? status.textContent.trim().replace(/\s+/g, " ") : "";
          return text === "" ? "" : " -- the page said: " + text.slice(0, 400);
        } catch (_) {
          return "";
        }
      }

      function waitFor(probe, timeoutMs, label) {
        return new Promise((resolve, reject) => {
          const started = performance.now();
          const tick = () => {
            let value = false;
            try {
              value = probe();
            } catch (_) {
              value = false;
            }
            if (value) {
              resolve(value);
              return;
            }
            if (performance.now() - started > timeoutMs) {
              reject(new Error("timed out waiting for " + label + pageSaid()));
              return;
            }
            setTimeout(tick, 40);
          };
          tick();
        });
      }

      function withTimeout(promise, timeoutMs, label) {
        let timer;
        return Promise.race([
          promise,
          new Promise((_, reject) => {
            timer = setTimeout(
              () => reject(new Error("timed out waiting for " + label)),
              timeoutMs,
            );
          }),
        ]).finally(() => clearTimeout(timer));
      }

      function waitForLoad(frame) {
        return new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener(
            "error",
            () => reject(new Error("the tools iframe failed to load")),
            { once: true },
          );
        });
      }

      function frameDocument(frame) {
        const current = frame.contentDocument;
        if (!current) throw new Error("the tools iframe has no document");
        return current;
      }

      function readNetwork(win) {
        // Resource Timing is the page's own account of every subresource it
        // fetched. All of them must be this origin; no document body is
        // observable here, which is why the page's recorder assertion is the
        // other half of the network claim.
        const resources = win.performance
          .getEntriesByType("resource")
          .map((entry) => entry.name)
          .filter((name) => name.startsWith("http"));
        const origin = win.location.origin;
        return {
          origin,
          resources: resources.length,
          foreign: resources.filter((name) => new URL(name).origin !== origin),
          paths: resources.map((name) => new URL(name).pathname).sort(),
        };
      }

      // Which cards this run actually opened, per phase. The gate is not "the
      // page renders a card" — a card nobody clicks can break without the check
      // noticing — so every click is recorded and the verdict compares the two
      // sets against the ids the grid rendered.
      const clickedOnline = new Set();
      const clickedOffline = new Set();
      let offlinePhase = false;

      function markClick(card) {
        const id = card.getAttribute("data-tool");
        if (id) {
          if (offlinePhase) {
            clickedOffline.add(id);
          } else {
            clickedOnline.add(id);
          }
        }
        card.click();
      }

      // The card count the grid must reach before anything is run. `TOOLS_PAGE_CARDS`
      // in xtask/src/browser.rs holds the same list, and the verdict compares the
      // ids, so a page that renders a different number fails here with a message
      // that names the count it was waiting for.
      const CARD_COUNT = 34;

      function cardIds(frame) {
        return [...frameDocument(frame).querySelectorAll("#tool-grid .tool-card")]
          .map((card) => card.getAttribute("data-tool") || "")
          .sort();
      }

      function clickRecord() {
        return { online: [...clickedOnline].sort(), offline: [...clickedOffline].sort() };
      }

      async function waitForCards(frame, label) {
        await waitFor(
          () => frameDocument(frame).querySelectorAll("#tool-grid .tool-card").length === CARD_COUNT,
          15_000,
          label,
        );
        return frameDocument(frame).querySelectorAll("#tool-grid .tool-card").length;
      }

      /**
       * The frame of a JPEG, or null when the bytes are not a complete one.
       * A JPEG opens with SOI (FF D8) and closes with EOI (FF D9); the pixel
       * size lives in the first start-of-frame marker, so this walks the marker
       * segments the way a decoder does — standalone markers carry no length,
       * every other segment skips its own. Baseline sequential is SOF0 (FF C0);
       * a progressive frame (FF C2) would mean the writer is not the one shipped.
       */
      function jpegFrame(bytes) {
        const last = bytes.length - 1;
        if (
          bytes.length < 20 ||
          bytes[0] !== 0xff ||
          bytes[1] !== 0xd8 ||
          bytes[last - 1] !== 0xff ||
          bytes[last] !== 0xd9
        ) {
          return null;
        }
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        let pos = 2;
        while (pos + 3 < bytes.length) {
          if (bytes[pos] !== 0xff) {
            pos += 1;
            continue;
          }
          const marker = bytes[pos + 1];
          if (marker === 0x01 || (marker >= 0xd0 && marker <= 0xd9)) {
            pos += 2;
            continue;
          }
          const size = view.getUint16(pos + 2);
          const isSof =
            marker >= 0xc0 && marker <= 0xcf && marker !== 0xc4 && marker !== 0xc8 && marker !== 0xcc;
          if (isSof) {
            return {
              width: view.getUint16(pos + 7),
              height: view.getUint16(pos + 5),
              baseline: marker === 0xc0,
            };
          }
          if (size < 2) {
            return null;
          }
          pos += 2 + size;
        }
        return null;
      }

      /**
       * The page chain of a TIFF, or null when the bytes are not one.
       *
       * A TIFF opens with `II` or `MM`, the version 42 in the writer's own byte
       * order, and the offset of the first IFD. Each IFD is an entry count, that
       * many 12-byte tags, and the offset of the next one, so the chain is
       * walkable without decoding a pixel — which is what makes this the proof
       * that a multi-page container arrived rather than a truncated single page.
       * The chain must move forward and stay inside the file, so a loop or an
       * offset past the end reports null instead of hanging the harness.
       *
       * Every page is measured against the profile the raster chunk writes: RGB
       * photometric, three contiguous samples, one Deflate strip whose
       * RowsPerStrip is the whole page. Sample depth lives behind an offset this
       * walk does not follow; the engine's reader refuses a file that is not
       * 8-bit, and the leg below proves the two claims independently.
       */
      function tiffChain(bytes) {
        if (bytes.length < 8) {
          return null;
        }
        const le = bytes[0] === 0x49 && bytes[1] === 0x49;
        if (!le && !(bytes[0] === 0x4d && bytes[1] === 0x4d)) {
          return null;
        }
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const u16 = (at) => (at + 2 > bytes.length ? null : view.getUint16(at, le));
        const u32 = (at) => (at + 4 > bytes.length ? null : view.getUint32(at, le));
        if (u16(2) !== 42) {
          return null;
        }
        const pages = [];
        let previous = 0;
        let ifd = u32(4);
        while (ifd !== null && ifd !== 0) {
          if (ifd <= previous || ifd + 2 > bytes.length || pages.length === 64) {
            return null;
          }
          const count = u16(ifd);
          const entries = ifd + 2 + count * 12;
          if (count === null || count === 0 || entries + 4 > bytes.length) {
            return null;
          }
          const page = {
            width: 0,
            height: 0,
            compression: 0,
            photometric: 0,
            samples: 0,
            rows: 0,
            planar: 0,
            strips: 0,
            byteCounts: 0,
          };
          for (let i = 0; i < count; i += 1) {
            const at = ifd + 2 + i * 12;
            const tag = u16(at);
            const field = u16(at + 2);
            const values = u32(at + 4);
            const inline = field === 4 ? u32(at + 8) : u16(at + 8);
            if (tag === null || values === null || inline === null) {
              return null;
            }
            if (tag === 256) page.width = inline;
            else if (tag === 257) page.height = inline;
            else if (tag === 259) page.compression = inline;
            else if (tag === 262) page.photometric = inline;
            else if (tag === 273) page.strips = values;
            else if (tag === 277) page.samples = inline;
            else if (tag === 278) page.rows = inline;
            else if (tag === 279) page.byteCounts = values;
            else if (tag === 284) page.planar = inline;
          }
          pages.push(page);
          previous = ifd;
          ifd = u32(entries);
        }
        if (pages.length === 0) {
          return null;
        }
        const profile = pages.every(
          (page) =>
            page.width > 0 &&
            page.height > 0 &&
            page.compression === 8 &&
            page.photometric === 2 &&
            page.samples === 3 &&
            page.planar === 1 &&
            page.strips === 1 &&
            page.byteCounts === 1 &&
            page.rows === page.height,
        );
        return {
          count: pages.length,
          width: pages[0].width,
          height: pages[0].height,
          profile,
        };
      }

      /**
       * The frame of a lossless WebP, or null when the bytes are not one.
       *
       * A WebP is a RIFF container whose first chunk names the coding, and
       * `VP8L` is the lossless one this writer makes. The chunk opens with a 0x2F
       * signature byte and then a bit stream read least-significant-bit first:
       * 14 bits of width-1, 14 of height-1, one alpha bit and three reserved
       * bits that a version-0 stream must leave zero. That names the canvas
       * without decoding a pixel, which is what makes this the proof that a real
       * frame arrived rather than a renamed, truncated or lossy one. The RIFF
       * length has to agree with the file the harness was handed, so a Blob that
       * stopped short reports null instead of a smaller picture.
       */
      function vp8lFrame(bytes) {
        if (bytes.length < 22) {
          return null;
        }
        const fourcc = (at) =>
          String.fromCharCode(bytes[at], bytes[at + 1], bytes[at + 2], bytes[at + 3]);
        if (fourcc(0) !== "RIFF" || fourcc(8) !== "WEBP") {
          return null;
        }
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        if (view.getUint32(4, true) + 8 !== bytes.length) {
          return null;
        }
        if (fourcc(12) !== "VP8L" || bytes[20] !== 0x2f) {
          return null;
        }
        const chunk = view.getUint32(16, true);
        if (chunk + 20 > bytes.length) {
          return null;
        }
        // The bit stream starts at bit 168: one byte of signature past the
        // twelve header bytes and the four-byte chunk length.
        let bit = 168;
        const readBits = (count) => {
          let value = 0;
          for (let index = 0; index < count; index += 1) {
            const at = (bit + index) >> 3;
            if (at >= bytes.length) {
              return null;
            }
            if (((bit + index) & 7) === 0 && at + 1 > chunk + 20) {
              return null;
            }
            const shift = (bit + index) & 7;
            if ((bytes[at] & (1 << shift)) !== 0) {
              value += 1 << index;
            }
          }
          bit += count;
          return value;
        };
        const width = readBits(14);
        const height = readBits(14);
        const alpha = readBits(1);
        const version = readBits(3);
        if (width === null || height === null || alpha === null || version === null) {
          return null;
        }
        return {
          width: width + 1,
          height: height + 1,
          alpha: alpha === 1,
          lossless: version === 0,
        };
      }

      /**
       * The bytes painted by the browser's own image decoder, digested.
       *
       * Chromium is a second, unrelated implementation of every format it can
       * display, and the only one that says what the user who opens this file
       * will actually see. The leg records the size it decoded and an FNV-1a
       * digest of the samples, so two lossless files of one render can be
       * compared by the verdict rather than by the engine that wrote them. Null
       * when the browser refuses the bytes outright, which the verdict reads as
       * a failure of the file, not of the harness.
       */
      async function chromiumPixels(bytes) {
        let bitmap = null;
        try {
          bitmap = await createImageBitmap(new Blob([bytes]));
          const width = bitmap.width;
          const height = bitmap.height;
          const canvas = new OffscreenCanvas(width, height);
          const context = canvas.getContext("2d", { willReadFrequently: true });
          if (context === null) {
            return null;
          }
          context.drawImage(bitmap, 0, 0);
          const samples = context.getImageData(0, 0, width, height).data;
          let hash = 0x811c9dc5;
          for (let index = 0; index < samples.length; index += 1) {
            hash ^= samples[index];
            hash = Math.imul(hash, 0x01000193) >>> 0;
          }
          return { width, height, digest: hash >>> 0, samples: samples.length };
        } catch {
          return null;
        } finally {
          if (bitmap !== null) {
            bitmap.close();
          }
        }
      }

      /**
       * The positioned HTML document the card handed over, walked independently
       * of the engine that wrote it.
       *
       * The bytes go through the browser's own HTML parser — a second, unrelated
       * implementation of the format, and the only reading of it that says what
       * a user who opens this file will actually see. Each `<section>` gives up
       * the page number and canvas the writer claims, each positioned paragraph
       * gives up its text and its four box edges, and a document that dropped a
       * word or pushed it off the page shows up here instead of in the writer's
       * own tests.
       *
       * The byte-level structure is counted in the raw text rather than the
       * parsed tree, because a parser repairs what it is given: three
       * concatenated `<html>` roots would still parse, which is exactly the file
       * the previous shape used to produce. Null when these are not HTML bytes.
       */
      function htmlDocument(bytes) {
        const head = new TextDecoder("latin1").decode(bytes.subarray(0, 24)).trimStart();
        if (!/^<!doctype html>/i.test(head)) {
          return null;
        }
        const text = new TextDecoder("latin1").decode(bytes);
        const count = (needle) => text.split(needle).length - 1;
        const utf8 = new TextDecoder().decode(bytes);
        const parsed = new DOMParser().parseFromString(utf8, "text/html");
        const sections = parsed.querySelectorAll("main > section.page");
        const pages = [];
        for (const section of sections) {
          const width = Number(section.getAttribute("data-width") || "NaN");
          const height = Number(section.getAttribute("data-height") || "NaN");
          const style = section.getAttribute("style") || "";
          const spans = [];
          let outside = 0;
          for (const paragraph of section.querySelectorAll("p.s")) {
            const edges = (paragraph.getAttribute("data-box") || "").split(",");
            if (edges.length !== 4) {
              return null;
            }
            const box = edges.map(Number);
            if (box.some((edge) => !Number.isFinite(edge))) {
              return null;
            }
            const paragraphStyle = paragraph.getAttribute("style") || "";
            const size = Number((paragraphStyle.match(/font-size:([0-9.]+)px/) || [])[1]);
            if (!Number.isFinite(size) || size <= 0) {
              return null;
            }
            if (
              box[0] < 0 ||
              box[1] < 0 ||
              box[2] > width ||
              box[3] > height ||
              box[2] < box[0] ||
              box[3] < box[1]
            ) {
              outside += 1;
            }
            spans.push({ text: paragraph.textContent, box, size });
          }
          pages.push({
            number: Number(section.getAttribute("data-page") || "NaN"),
            width,
            height,
            styleMatches:
              style.includes("width:" + width + "px") && style.includes("height:" + height + "px"),
            spans: spans.length,
            words: spans.map((span) => span.text).join(" ").slice(0, 400),
            outside,
            marker: section.querySelectorAll("p.low-confidence").length,
          });
        }
        return {
          roots: count("<html"),
          closers: count("</html>"),
          doctypes: count("<!doctype html>"),
          mains: count("<main>"),
          title: (parsed.querySelector("title") || {}).textContent || "",
          pages,
        };
      }

      async function readOutput(win, row, label, needles, absent) {
        const download = row.querySelector("a.primary-link");
        if (!download) throw new Error("a result row had no download link (" + label + ")");
        const preview = row.querySelector("a.text-button");
        const href = download.getAttribute("href") || "";
        const output = {
          kind: row.dataset.kind || "",
          name: row.dataset.name || "",
          pages: Number(row.dataset.pages || "0"),
          overTarget: row.dataset.overTarget === "true",
          declaredBytes: Number(row.dataset.bytes || "0"),
          blob: href.startsWith("blob:"),
          previewBlob: preview
            ? (preview.getAttribute("href") || "").startsWith("blob:")
            : null,
          downloadName: download.getAttribute("download"),
        };
        if (!output.blob) throw new Error("the download was not a Blob URL (" + label + ")");
        const bytes = new Uint8Array(await fetch(href).then((r) => r.arrayBuffer()));
        output.bytes = bytes.length;
        output.header = new TextDecoder().decode(bytes.subarray(0, 5));
        if (output.kind === "file") {
          output.text = new TextDecoder("latin1").decode(bytes.subarray(0, 256));
        }
        output.zip =
          bytes.length >= 4 &&
          bytes[0] === 0x50 &&
          bytes[1] === 0x4b &&
          bytes[2] === 0x03 &&
          bytes[3] === 0x04;
        // A real PNG starts with the 8-byte signature; IHDR follows at byte 8,
        // so its width/height are readable at 16 and 20 without decoding IDAT.
        output.png =
          bytes.length >= 24 &&
          bytes[0] === 0x89 &&
          bytes[1] === 0x50 &&
          bytes[2] === 0x4e &&
          bytes[3] === 0x47 &&
          bytes[4] === 0x0d &&
          bytes[5] === 0x0a &&
          bytes[6] === 0x1a &&
          bytes[7] === 0x0a;
        if (output.png) {
          const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
          output.pngWidth = view.getUint32(16);
          output.pngHeight = view.getUint32(20);
        }
        // A JPEG has no fixed-offset header: the size is in a marker, so the
        // sniff walks the segments. `jpeg` true means SOI, a readable frame and
        // EOI all agree — a truncated or mis-marked stream reports false.
        const jpeg = jpegFrame(bytes);
        output.jpeg = jpeg !== null;
        if (jpeg !== null) {
          output.jpegWidth = jpeg.width;
          output.jpegHeight = jpeg.height;
          output.jpegBaseline = jpeg.baseline;
        }
        // A TIFF is read by walking its IFD chain, so `tiff` true means a header
        // the harness parsed, a chain that terminated, and one page per link.
        // The count is the container's own claim about how many pages it holds.
        const tiff = tiffChain(bytes);
        output.tiff = tiff !== null;
        if (tiff !== null) {
          output.tiffPages = tiff.count;
          output.tiffWidth = tiff.width;
          output.tiffHeight = tiff.height;
          output.tiffProfile = tiff.profile;
        }
        // A WebP is read from its VP8L chunk header, so `webp` true means the
        // RIFF container, the chunk name, the signature byte and the two 14-bit
        // dimensions all agree with the bytes that were downloaded.
        const webp = vp8lFrame(bytes);
        output.webp = webp !== null;
        if (webp !== null) {
          output.webpWidth = webp.width;
          output.webpHeight = webp.height;
          output.webpAlpha = webp.alpha;
          output.webpLossless = webp.lossless;
        }
        // The browser's own decoder is asked only about the formats it claims to
        // display. A TIFF is not one of them, so its leg reports the sniff and
        // nothing more — which is also what the card's missing preview says.
        const displayable = output.png || output.jpeg || output.webp;
        output.chromium = displayable ? await chromiumPixels(bytes) : null;
        // An HTML document is walked by the browser's own parser, which is a
        // second implementation of the format and the only one that says what
        // the user who opens this file will see. `html` true means the bytes
        // open with a doctype and every page in them parsed with a readable box.
        const html = htmlDocument(bytes);
        output.html = html !== null;
        if (html !== null) {
          output.htmlRoots = html.roots;
          output.htmlClosers = html.closers;
          output.htmlDoctypes = html.doctypes;
          output.htmlMains = html.mains;
          output.htmlTitle = html.title;
          output.htmlPages = html.pages.map((page) => ({
            number: page.number,
            width: page.width,
            height: page.height,
            style: page.styleMatches,
            spans: page.spans,
            outside: page.outside,
            marker: page.marker,
            words: page.words,
          }));
        }
        if (needles && needles.length > 0) {
          const text = new TextDecoder("latin1").decode(bytes);
          output.found = needles.map((needle) => text.includes(needle));
          // The count proves a repeat: a tiled watermark must appear more than
          // once, which a plain presence check cannot distinguish.
          output.foundCounts = needles.map(
            (needle) => text.split(needle).length - 1,
          );
        }
        if (absent && absent.length > 0) {
          const text = new TextDecoder("latin1").decode(bytes);
          // Each entry records whether the removed text is STILL present, so a
          // `false` is the pass: the browser-side output proves the bytes the
          // operation was supposed to drop are gone from the actual download.
          output.absentFound = absent.map((needle) => text.includes(needle));
        }
        return output;
      }

      async function readResult(frame, label, needles, absent) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        const result = {
          title: doc.getElementById("result-title").textContent.trim(),
          meta: doc.getElementById("result-meta").textContent.trim(),
          rows: Array.from(doc.querySelectorAll("#result-rows .result-row")).map(
            (row) => ({
              label: row.querySelector("dt").textContent.trim(),
              value: row.querySelector("dd").textContent.trim(),
            }),
          ),
        };
        const outputs = [];
        for (const row of doc.querySelectorAll("#result-outputs .output-row")) {
          outputs.push(await readOutput(win, row, label, needles, absent));
        }
        return {
          result,
          outputs,
          output: outputs.find((output) => output.kind === "pdf") || null,
        };
      }

      // Attach an explicit list of files. `toolInFrame` uses this for the
      // image→PDF leg, where the inputs are a PNG and a JPEG rather than PDFs,
      // so the MIME type and the count both come from the caller.
      async function attachList(frame, files, label) {
        const win = frame.contentWindow;
        const doc = frameDocument(frame);
        const transfer = new win.DataTransfer();
        for (const file of files) {
          transfer.items.add(
            new win.File([file.bytes.slice(0)], file.name, { type: file.type }),
          );
        }
        const input = doc.getElementById("file-input");
        input.files = transfer.files;
        input.dispatchEvent(new win.Event("change", { bubbles: true }));
        await waitFor(
          () => doc.querySelectorAll("#file-list .file-row").length === files.length,
