<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>selis browser harness - editor</title>
    <style>
      iframe { width: 1100px; height: 900px; border: 1px solid #ccc; }
      #verdict { font: 14px monospace; }
    </style>
  </head>
  <body>
    <!-- @@SELIS-RESULT@@: the harness stages this page over the app's own index.html. -->
    <pre id="verdict">PENDING</pre>
    <iframe id="editor" src="about:blank" title="Selis PDF editor"></iframe>
    <script type="module">
      // The editor workspace is a document editor: the thing under test is the
      // real `/edit-pdf/` page from the staged app tree, loaded in this
      // same-origin frame. This harness page only drives the DOM and reports,
      // so the check cannot pass by exercising a fixture that re-implements
      // the editor.
      //
      // The legs, in the order a person would do them:
      //
      //   1. open a PDF and wait for the pages to be drawn with a text layer;
      //   2. click a line of text, change it, and check the page redrew it;
      //   3. undo, and check the document came back exactly as it was;
      //   4. redo, and check the change came back;
      //   5. download, and read the produced bytes back to check they are a
      //      PDF carrying the change;
      //   6. check the page's own no-upload assertion, and that nothing was
      //      fetched from another origin.
      const out = { schema: 1, check: "editor" };
      let posted = false;

      function post() {
        if (posted) return;
        posted = true;
        fetch("/__selis_result", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(out),
        });
      }

      function fail(error) {
        out.fatal = String((error && error.stack) || error);
        post();
      }

      function frameDocument(frame) {
        const current = frame.contentDocument;
        if (!current) throw new Error("the editor iframe had no document");
        return current;
      }

      function statusText(doc) {
        const status = doc.getElementById("selis-editor-status");
        return status ? status.textContent.trim().replace(/\s+/g, " ") : "";
      }

      /**
       * Wait until the workspace has FINISHED what it was doing.
       *
       * The status line carries an ellipsis while an operation runs and drops
       * it when the operation is done — and the two look alike to a prefix
       * match ("Cropped page 1…" against "Cropped page 1"). Waiting for the
       * settled form is what makes the leg read the document the operation
       * produced rather than the one before it.
       */
      async function waitForSettled(doc, prefix, label) {
        await waitFor(
          () => {
            const status = doc.getElementById("selis-editor-status");
            if (!status || status.dataset.kind === "error") return false;
            const text = status.textContent.trim().replace(/\s+/g, " ");
            return text.startsWith(prefix) && !text.endsWith("…");
          },
          30_000,
          label,
        );
        return statusText(doc);
      }

      function waitFor(probe, timeoutMs, label) {
        return new Promise((resolve, reject) => {
          const started = performance.now();
          const tick = () => {
            let value = false;
            try {
              value = probe();
            } catch (_) {
              value = false;
            }
            if (value) {
              resolve(value);
              return;
            }
            if (performance.now() - started > timeoutMs) {
              reject(
                new Error(
                  "timed out waiting for " + label + " -- the page said: " + statusText(frameDocument(frame)),
                ),
              );
              return;
            }
            setTimeout(tick, 40);
          };
          tick();
        });
      }

      function waitForLoad(frame) {
        return new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener(
            "error",
            () => reject(new Error("the editor iframe failed to load")),
            { once: true },
          );
        });
      }

      /** The text of every line of the page's text layer, in order. */
      function lines(doc) {
        return [...doc.querySelectorAll(".selis-editor-line")].map((line) =>
          (line.textContent || "").trim(),
        );
      }

      async function main() {
        const frame = document.getElementById("editor");
        const load = waitForLoad(frame);
        frame.src = "/edit-pdf/";
        await load;
        const doc = frameDocument(frame);
        const win = frame.contentWindow;
        if (!win) throw new Error("the editor iframe had no window");

        out.path = win.location.pathname;
        out.title = doc.title;

        // The page booted: the status line invites a document.
        await waitFor(
          () => statusText(doc).includes("Open a PDF"),
          20_000,
          "the editor to boot",
        );

        // The fixture's bytes are read while the origin is still up.
        const fixtureBytes = new Uint8Array(
          await fetch("edit.pdf").then((r) => r.arrayBuffer()),
        );
        // And so is the image the placement leg puts on the page.
        const pngBytes = new Uint8Array(
          await fetch("mark.png").then((r) => r.arrayBuffer()),
        );

        // The worker has to be in control before the engine is fetched, or the
        // engine lands outside the runtime cache and the offline leg has
        // nothing to serve. The first visit registers the worker; the second
        // one is controlled by it from the start, which is the situation a
        // reader is in when they come back.
        await withTimeout(win.navigator.serviceWorker.ready, 30_000, "the worker to activate");
        await waitFor(
          () => win.navigator.serviceWorker.controller !== null,
          20_000,
          "the worker to claim the editor page",
        );
        const controlled = waitForLoad(frame);
        frame.contentWindow.location.reload();
        await controlled;
        const onlineDoc = frameDocument(frame);
        const onlineWin = frame.contentWindow;
        if (!onlineWin) throw new Error("the editor iframe had no window");
        await waitFor(
          () => statusText(onlineDoc).includes("Open a PDF"),
          30_000,
          "the editor to boot under the worker",
        );

        out.online = await driveLeg(onlineDoc, onlineWin, fixtureBytes, "edit.pdf", "online");
        out.before = out.online.before;
        out.after = out.online.after;
        out.undone = out.online.undone;
        out.redone = out.online.redone;
        out.output = out.online.output;

        // The three ways of changing what is ON the page: put new text in it,
        // put an image in it, and take text out of it.
        out.textBox = await textBoxLeg(onlineDoc, onlineWin, "online");
        out.image = await imageLeg(onlineDoc, onlineWin, pngBytes, "online");
        out.crop = await cropLeg(onlineDoc, onlineWin, "online");
        out.properties = await propertiesLeg(onlineDoc, onlineWin, "online");
        out.redact = await redactLeg(onlineDoc, onlineWin, "online");

        // The form's fields, on a document that has a form.
        const formBytes = new Uint8Array(
          await fetch("form.pdf").then((r) => r.arrayBuffer()),
        );
        out.form = await formLeg(onlineDoc, onlineWin, formBytes, "online");

        // The page's own no-upload assertion, and the origin of everything it
        // fetched.
        out.noUpload = onlineDoc.documentElement.dataset.noUpload || "";
        out.network = readNetwork(onlineWin);

        // Now cut the origin and reload the SAME page: the workspace, its
        // module graph, its stylesheet, the engine chunk and the tools chunk
        // must all come back from the worker's cache, and the same edit must
        // still work with the network gone.
        const cut = await fetch("/__selis_offline", { method: "POST" });
        if (!cut.ok) throw new Error("the offline switch returned " + cut.status);
        const secondLoad = waitForLoad(frame);
        frame.contentWindow.location.reload();
        await secondLoad;
        const offlineDoc = frameDocument(frame);
        const offlineWin = frame.contentWindow;
        if (!offlineWin) throw new Error("the offline editor iframe had no window");
        await waitFor(
          () => statusText(offlineDoc).includes("Open a PDF"),
          30_000,
          "the offline editor to boot",
        );
        out.offline = await driveLeg(
          offlineDoc,
          offlineWin,
          fixtureBytes,
          "edit.pdf",
          "offline",
        );
        out.offlineNetwork = readNetwork(offlineWin);
        post();
      }

      function withTimeout(promise, timeoutMs, label) {
        let timer;
        return Promise.race([
          promise,
          new Promise((_, reject) => {
            timer = setTimeout(
              () => reject(new Error("timed out waiting for " + label)),
              timeoutMs,
            );
          }),
        ]).finally(() => clearTimeout(timer));
      }

      /** Every resource the page fetched, and where from. */
      function readNetwork(win) {
        const resources = win.performance
          .getEntriesByType("resource")
          .map((entry) => entry.name)
          .filter((name) => name.startsWith("http"));
        return {
          resources: resources.length,
          foreign: resources.filter((name) => new URL(name).origin !== win.location.origin),
          paths: resources.map((name) => new URL(name).pathname).sort(),
        };
      }

      /**
       * Open the fixture, change a line of its text, undo it, redo it, and
       * download the result.
       *
       * The same leg runs twice: once online, and once with the origin cut.
       */
      async function driveLeg(doc, win, fixtureBytes, fixture, label) {
        // The fixture's bytes were read while the origin was still up: the
        // offline leg cannot fetch them, because the origin is answering 503
        // on purpose.
        const bytes = fixtureBytes;
        const file = new File([bytes], fixture, { type: "application/pdf" });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        const input = doc.getElementById("selis-open-file");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));

        await waitFor(
          () => doc.querySelectorAll(".selis-editor-page").length > 0,
          30_000,
          "the document to be drawn (" + label + ")",
        );
        await waitFor(() => lines(doc).length > 0, 20_000, "the text layer (" + label + ")");

        const record = {
          pages: doc.querySelectorAll(".selis-editor-page").length,
          before: lines(doc),
          opened: statusText(doc),
        };

        // Click a line and change it.
        const line = doc.querySelector(".selis-editor-line");
        if (!line) throw new Error("the document drew no clickable text");
        line.click();
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          10_000,
          "the inline text editor (" + label + ")",
        );
        const area = doc.querySelector(".selis-editor-inline__text");
        const original = record.before[0];
        const changed = original.replace("900", "1200");
        if (changed === original) {
          throw new Error("the fixture's text did not carry the word the check replaces");
        }
        record.replacement = changed;
        area.value = changed;
        area.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }),
        );

        await waitFor(
          () => {
            const now = lines(doc);
            return now.length > 0 && now[0] !== original;
          },
          30_000,
          "the text to change (" + label + ")",
        );
        record.after = lines(doc);
        record.edited = statusText(doc);

        // Undo must bring the document back exactly as it was.
        doc.getElementById("selis-undo").click();
        await waitFor(
          () => lines(doc)[0] === original,
          30_000,
          "the undo to restore the line (" + label + ")",
        );
        record.undone = lines(doc);
        record.undoStatus = statusText(doc);

        // And redo must bring the change back.
        doc.getElementById("selis-redo").click();
        await waitFor(
          () => lines(doc)[0] === changed,
          30_000,
          "the redo to restore the change (" + label + ")",
        );
        record.redone = lines(doc);

        record.output = await download(doc, win);
        record.noUpload = doc.documentElement.dataset.noUpload || "";
        return record;
      }

      /**
       * Add a text box where the reader clicks, and check the document carries
       * it.
       */
      async function textBoxLeg(doc, win, label) {
        useTool(doc, "box");
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        const box = canvas.getBoundingClientRect();
        const at = { x: 40, y: 220 };
        const opts = {
          clientX: box.left + at.x,
          clientY: box.top + at.y,
          bubbles: true,
          cancelable: true,
          button: 0,
          pointerId: 4,
          isPrimary: true,
        };
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...opts, buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...opts, buttons: 0 }));
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          10_000,
          "the text box editor (" + label + ")",
        );
        const area = doc.querySelector(".selis-editor-inline__text");
        const text = "Added by the editor";
        area.value = text;
        area.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }),
        );
        await waitFor(
          () => lines(doc).some((line) => line.includes(text)),
          30_000,
          "the text box to be drawn (" + label + ")",
        );
        const produced = await download(doc, win);
        return {
          text,
          lines: lines(doc),
          status: statusText(doc),
          bytes: produced.bytes,
          carriesText: produced.carriesText.indexOf(text) >= 0,
        };
      }

      /**
       * Place the picked image where the reader drags, and check the document
       * carries it.
       */
      async function imageLeg(doc, win, pngBytes, label) {
        const file = new File([pngBytes], "mark.png", { type: "image/png" });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        const input = doc.getElementById("selis-editor-image-input");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFor(
          () => doc.getElementById("selis-editor-doc").dataset.tool === "image",
          15_000,
          "the image tool (" + label + ")",
        );
        await dragOnCanvas(doc, { x: 30, y: 30 }, { x: 110, y: 90 });
        await waitForSettled(doc, "Added an image", "the image to be placed (" + label + ")");
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          bytes: produced.bytes,
          carriesImage: produced.carriesText.indexOf("/Subtype /Image") >= 0,
        };
      }

      /**
       * Redact the region the reader drags over, and check the text under it
       * is gone from the document.
       */
      async function redactLeg(doc, win, label) {
        useTool(doc, "redact");
        const line = doc.querySelector(".selis-editor-line");
        if (!line) throw new Error("the document drew no clickable text");
        const canvas = doc.querySelector("canvas");
        const text = line.getBoundingClientRect();
        const box = canvas.getBoundingClientRect();
        await dragOnCanvas(
          doc,
          { x: text.left - box.left - 4, y: text.top - box.top - 4 },
          { x: text.right - box.left + 4, y: text.bottom - box.top + 4 },
        );
        await waitForSettled(doc, "Redacted", "the region to be redacted (" + label + ")");
        const produced = await download(doc, win);
        const carried = produced.carriesText;
        return {
          status: statusText(doc),
          lines: lines(doc),
          bytes: produced.bytes,
          // The redacted text must be GONE from the file, not merely covered.
          stillCarriesText: carried.indexOf("Invoice total") >= 0,
          coversText: carried.indexOf("0 0 0 rg") >= 0,
        };
      }

      /** Arm the workspace for a tool. */
      function useTool(doc, tool) {
        doc.querySelector('#selis-editor-tools button[data-tool="' + tool + '"]').click();
      }

      /**
       * Crop the page by a margin, and check the page got smaller.
       */
      async function cropLeg(doc, win, label) {
        const before = doc.querySelector("canvas").getBoundingClientRect().width;
        doc.getElementById("selis-editor-crop-right").value = "20";
        doc.getElementById("selis-editor-crop-apply").click();
        await waitForSettled(doc, "Cropped", "the page to be cropped (" + label + ")");
        const after = doc.querySelector("canvas").getBoundingClientRect().width;
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          before: Math.round(before),
          after: Math.round(after),
          bytes: produced.bytes,
          narrowed: after < before,
        };
      }

      /**
       * Write the document's title, and check it is in the file.
       */
      async function propertiesLeg(doc, win, label) {
        doc.getElementById("selis-editor-title").value = "A title from the editor";
        doc.getElementById("selis-editor-properties-apply").click();
        await waitForSettled(
          doc,
          "Saved the document",
          "the properties to be saved (" + label + ")",
        );
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          bytes: produced.bytes,
          carriesTitle: produced.carriesText.indexOf("A title from the editor") >= 0,
        };
      }

      /**
       * Read the form's fields, fill one in, and check the value is in the
       * file.
       */
      async function formLeg(doc, win, formBytes, label) {
        // The form is a document of its own: the workspace holds one document
        // at a time, so the form replaces what was open.
        const file = new File([formBytes], "form.pdf", { type: "application/pdf" });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        const input = doc.getElementById("selis-open-file");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFor(
          () => statusText(doc).startsWith("Opened form.pdf"),
          30_000,
          "the form to be opened (" + label + ")",
        );
        doc.getElementById("selis-editor-fields-read").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return status.endsWith("found.") && !status.endsWith("…");
          },
          30_000,
          "the form's fields to be read (" + label + ")",
        );
        const fields = [...doc.querySelectorAll("#selis-editor-fields input[data-field]")].map(
          (input) => ({
            name: input.dataset.field,
            disabled: input.disabled,
            value: input.value,
          }),
        );
        // The read-only field is shown but not editable: the engine refuses to
        // override the flag, and a workspace that offered it would fail the
        // whole fill.
        const frozen = fields.find((field) => field.name === "Frozen");
        const name = doc.querySelector('#selis-editor-fields input[data-field="Name"]');
        name.value = "Filled by the editor";
        doc.getElementById("selis-editor-fields-apply").click();
        await waitForSettled(doc, "Filled the form fields", "the form to be filled (" + label + ")");
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          fields: fields.length,
          readOnlyNotEditable: frozen ? frozen.disabled === true : false,
          bytes: produced.bytes,
          carriesValue: produced.carriesText.indexOf("Filled by the editor") >= 0,
        };
      }

      /** Drag on the canvas, in the canvas's own CSS pixels. */
      async function dragOnCanvas(doc, from, to) {
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        const box = canvas.getBoundingClientRect();
        const at = (point) => ({
          clientX: box.left + point.x,
          clientY: box.top + point.y,
          bubbles: true,
          cancelable: true,
          button: 0,
          pointerId: 5,
          isPrimary: true,
        });
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...at(from), buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointermove", { ...at(to), buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...at(to), buttons: 0 }));
      }

      /**
       * Download the document and read the bytes back.
       *
       * The anchor's click is captured so the bytes can be read rather than
       * trusted.
       */
      async function download(doc, win) {
        // The download button is disabled while an operation runs, and the
        // status line says the operation is done a moment before the button
        // comes back. Waiting for the button is what makes the read the
        // document's real bytes rather than nothing at all.
        await waitFor(
          () => !doc.getElementById("selis-download").disabled,
          20_000,
          "the download to be ready",
        );
        const captured = {};
        const originalClick = win.HTMLAnchorElement.prototype.click;
        win.HTMLAnchorElement.prototype.click = function () {
          captured.href = this.href;
          captured.download = this.download;
        };
        doc.getElementById("selis-download").click();
        win.HTMLAnchorElement.prototype.click = originalClick;
        if (!captured.href) throw new Error("the download produced no blob URL");
        const blob = await win.fetch(captured.href).then((r) => r.blob());
        const produced = new Uint8Array(await blob.arrayBuffer());
        return {
          blob: true,
          downloadName: captured.download || "",
          bytes: produced.length,
          header: String.fromCharCode(...produced.slice(0, 5)),
          carriesText: new TextDecoder("latin1").decode(produced),
        };
      }

      main().catch(fail);
    </script>
  </body>
</html>
