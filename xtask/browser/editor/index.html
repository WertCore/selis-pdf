<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>selis browser harness - editor</title>
    <style>
      iframe { width: 1100px; height: 900px; border: 1px solid #ccc; }
      #verdict { font: 14px monospace; }
    </style>
  </head>
  <body>
    <!-- @@SELIS-RESULT@@: the harness stages this page over the app's own index.html. -->
    <pre id="verdict">PENDING</pre>
    <iframe id="editor" src="about:blank" title="Selis PDF editor"></iframe>
    <script type="module">
      // The editor workspace is a document editor: the thing under test is the
      // real `/edit-pdf/` page from the staged app tree, loaded in this
      // same-origin frame. This harness page only drives the DOM and reports,
      // so the check cannot pass by exercising a fixture that re-implements
      // the editor.
      //
      // The legs, in the order a person would do them:
      //
      //   1. open a PDF and wait for the pages to be drawn with a text layer;
      //   2. click a line of text, change it, and check the page redrew it;
      //   3. undo, and check the document came back exactly as it was;
      //   4. redo, and check the change came back;
      //   5. download, and read the produced bytes back to check they are a
      //      PDF carrying the change;
      //   6. check the page's own no-upload assertion, and that nothing was
      //      fetched from another origin.
      const out = { schema: 1, check: "editor" };
      let posted = false;
      // The frame under test. It is module-level because `waitFor` quotes the
      // page's own status when it gives up, and a frame that only existed
      // inside `main()` made that message throw — which left the promise
      // pending forever instead of rejecting, so a leg that timed out hung
      // the whole check instead of reporting what went wrong.
      let frame = null;

      function post() {
        if (posted) return;
        posted = true;
        fetch("/__selis_result", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(out),
        });
      }

      function fail(error) {
        out.fatal = String((error && error.stack) || error);
        post();
      }

      function frameDocument(target) {
        const current = target ? target.contentDocument : null;
        if (!current) throw new Error("the editor iframe had no document");
        return current;
      }

      function statusText(doc) {
        const status = doc.getElementById("selis-editor-status");
        return status ? status.textContent.trim().replace(/\s+/g, " ") : "";
      }

      /**
       * Wait until the workspace has FINISHED what it was doing.
       *
       * The status line carries an ellipsis while an operation runs and drops
       * it when the operation is done — and the two look alike to a prefix
       * match ("Cropped page 1…" against "Cropped page 1"). Waiting for the
       * settled form is what makes the leg read the document the operation
       * produced rather than the one before it.
       */
      async function waitForSettled(doc, prefix, label) {
        await waitFor(
          () => {
            const status = doc.getElementById("selis-editor-status");
            if (!status || status.dataset.kind === "error") return false;
            const text = status.textContent.trim().replace(/\s+/g, " ");
            return text.startsWith(prefix) && !text.endsWith("…");
          },
          30_000,
          label,
        );
        return statusText(doc);
      }

      function waitFor(probe, timeoutMs, label) {
        return new Promise((resolve, reject) => {
          const started = performance.now();
          const tick = () => {
            let value = false;
            try {
              value = probe();
            } catch (_) {
              value = false;
            }
            if (value) {
              resolve(value);
              return;
            }
            if (performance.now() - started > timeoutMs) {
              let said = "";
              try {
                said = statusText(frameDocument(frame));
              } catch (_) {
                said = "(the page could not be read)";
              }
              reject(new Error("timed out waiting for " + label + " -- the page said: " + said));
              return;
            }
            setTimeout(tick, 40);
          };
          tick();
        });
      }

      function waitForLoad(frame) {
        return new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener(
            "error",
            () => reject(new Error("the editor iframe failed to load")),
            { once: true },
          );
        });
      }

      /** The text of every line of the page's text layer, in order. */
      function lines(doc) {
        return [...doc.querySelectorAll(".selis-editor-line")].map((line) =>
          (line.textContent || "").trim(),
        );
      }

      async function main() {
        frame = document.getElementById("editor");
        const load = waitForLoad(frame);
        frame.src = "/edit-pdf/";
        await load;
        const doc = frameDocument(frame);
        const win = frame.contentWindow;
        if (!win) throw new Error("the editor iframe had no window");

        out.path = win.location.pathname;
        out.title = doc.title;

        // The page booted: the status line invites a document.
        await waitFor(
          () => statusText(doc) !== "" && !statusText(doc).endsWith("…"),
          30_000,
          "the editor to boot",
        );

        // The fixture's bytes are read while the origin is still up.
        const fixtureBytes = new Uint8Array(
          await fetch("edit.pdf").then((r) => r.arrayBuffer()),
        );
        // And so is the image the placement leg puts on the page.
        const pngBytes = new Uint8Array(
          await fetch("mark.png").then((r) => r.arrayBuffer()),
        );

        // The worker has to be in control before the engine is fetched, or the
        // engine lands outside the runtime cache and the offline leg has
        // nothing to serve. The first visit registers the worker; the second
        // one is controlled by it from the start, which is the situation a
        // reader is in when they come back.
        await withTimeout(win.navigator.serviceWorker.ready, 30_000, "the worker to activate");
        await waitFor(
          () => win.navigator.serviceWorker.controller !== null,
          20_000,
          "the worker to claim the editor page",
        );
        const controlled = waitForLoad(frame);
        frame.contentWindow.location.reload();
        await controlled;
        const onlineDoc = frameDocument(frame);
        const onlineWin = frame.contentWindow;
        if (!onlineWin) throw new Error("the editor iframe had no window");
        await waitFor(
          () => statusText(onlineDoc) !== "" && !statusText(onlineDoc).endsWith("…"),
          30_000,
          "the editor to boot under the worker",
        );

        // The workspace's FACE, before a document is opened: the invitation to
        // open a file must be on the screen (not below the fold), and the
        // panels must be able to go away and come back.
        out.face = await faceLeg(onlineDoc, onlineWin, "online");

        out.online = await driveLeg(onlineDoc, onlineWin, fixtureBytes, "edit.pdf", "online");
        out.before = out.online.before;
        out.after = out.online.after;
        out.undone = out.online.undone;
        out.redone = out.online.redone;
        out.output = out.online.output;

        // The three ways of changing what is ON the page: put new text in it,
        // put an image in it, and take text out of it.
        out.textBox = await textBoxLeg(onlineDoc, onlineWin, "online");
        out.palette = await paletteLeg(onlineDoc, onlineWin, "online");
        out.panels = await panelsLeg(onlineDoc, onlineWin, "online");
        out.tools = await toolsLeg(onlineDoc, onlineWin, "online");
        out.markup = await markupLeg(onlineDoc, onlineWin, "online");
        out.placement = await placementLeg(onlineDoc, onlineWin, "online");
        out.inline = await inlineLeg(onlineDoc, onlineWin, "online");
        out.image = await imageLeg(onlineDoc, onlineWin, pngBytes, "online");
        out.crop = await cropLeg(onlineDoc, onlineWin, "online");
        out.resize = await resizeLeg(onlineDoc, onlineWin, "online");
        out.bookmarks = await bookmarksLeg(onlineDoc, onlineWin, "online");
        out.properties = await propertiesLeg(onlineDoc, onlineWin, "online");
        out.redact = await redactLeg(onlineDoc, onlineWin, "online");
        out.shell = await shellLeg(onlineDoc, onlineWin, "online");
        out.theme = await themeLeg(onlineDoc, onlineWin, "online");
        out.export = await exportLeg(onlineDoc, onlineWin, "online");
        out.bates = await batesLeg(onlineDoc, onlineWin, "online");

        // The form's fields, on a document that has a form.
        const formBytes = new Uint8Array(
          await fetch("form.pdf").then((r) => r.arrayBuffer()),
        );
        out.form = await formLeg(onlineDoc, onlineWin, formBytes, "online");

        // The page's own no-upload assertion, and the origin of everything it
        // fetched.
        out.noUpload = onlineDoc.documentElement.dataset.noUpload || "";
        out.network = readNetwork(onlineWin);

        // The session leg RELOADS the frame, so it runs after every leg
        // that holds the frame's document.
        out.session = await sessionLeg(onlineDoc, onlineWin, "online");

        // Now cut the origin and reload the SAME page: the workspace, its
        // module graph, its stylesheet, the engine chunk and the tools chunk
        // must all come back from the worker's cache, and the same edit must
        // still work with the network gone.
        const cut = await fetch("/__selis_offline", { method: "POST" });
        if (!cut.ok) throw new Error("the offline switch returned " + cut.status);
        const secondLoad = waitForLoad(frame);
        frame.contentWindow.location.reload();
        await secondLoad;
        const offlineDoc = frameDocument(frame);
        const offlineWin = frame.contentWindow;
        if (!offlineWin) throw new Error("the offline editor iframe had no window");
        await waitFor(
          () => statusText(offlineDoc) !== "" && !statusText(offlineDoc).endsWith("…"),
          30_000,
          "the offline editor to boot",
        );
        out.offline = await driveLeg(
          offlineDoc,
          offlineWin,
          fixtureBytes,
          "edit.pdf",
          "offline",
        );
        out.offlineNetwork = readNetwork(offlineWin);
        post();
      }

      function withTimeout(promise, timeoutMs, label) {
        let timer;
        return Promise.race([
          promise,
          new Promise((_, reject) => {
            timer = setTimeout(
              () => reject(new Error("timed out waiting for " + label)),
              timeoutMs,
            );
          }),
        ]).finally(() => clearTimeout(timer));
      }

      /** Every resource the page fetched, and where from. */
      function readNetwork(win) {
        const resources = win.performance
          .getEntriesByType("resource")
          .map((entry) => entry.name)
          .filter((name) => name.startsWith("http"));
        return {
          resources: resources.length,
          foreign: resources.filter((name) => new URL(name).origin !== win.location.origin),
          paths: resources.map((name) => new URL(name).pathname).sort(),
        };
      }

      /**
       * Open the fixture, change a line of its text, undo it, redo it, and
       * download the result.
       *
       * The same leg runs twice: once online, and once with the origin cut.
       */
      async function driveLeg(doc, win, fixtureBytes, fixture, label) {
        // The fixture's bytes were read while the origin was still up: the
        // offline leg cannot fetch them, because the origin is answering 503
        // on purpose.
        const bytes = fixtureBytes;
        const file = new File([bytes], fixture, { type: "application/pdf" });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        const input = doc.getElementById("selis-open-file");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));

        await waitFor(
          () => doc.querySelectorAll(".selis-editor-page").length > 0,
          30_000,
          "the document to be drawn (" + label + ")",
        );
        // The open is FINISHED when the status says so: the workspace keeps
        // a copy of the document for a reload, and that copy is written
        // before the open is announced as done. A leg that edits while the
        // open is still holding the workspace is testing the wrong thing.
        await waitForSettled(doc, "Opened", "the document to be opened (" + label + ")");
        await waitFor(() => lines(doc).length > 0, 20_000, "the text layer (" + label + ")");

        const record = {
          pages: doc.querySelectorAll(".selis-editor-page").length,
          before: lines(doc),
          opened: statusText(doc),
        };

        // Click a line and change it.
        const line = doc.querySelector(".selis-editor-line");
        if (!line) throw new Error("the document drew no clickable text");
        line.click();
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          10_000,
          "the inline text editor (" + label + ")",
        );
        const area = doc.querySelector(".selis-editor-inline__text");
        const original = record.before[0];
        const changed = original.replace("900", "1200");
        if (changed === original) {
          throw new Error("the fixture's text did not carry the word the check replaces");
        }
        record.replacement = changed;
        area.value = changed;
        area.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }),
        );

        try {
          await waitFor(
            () => {
              const now = lines(doc);
              return now.length > 0 && now[0] !== original;
            },
            30_000,
            "the text to change (" + label + ")",
          );
        } catch (error) {
          throw new Error(
            String(error) +
              " -- the editor was " +
              (doc.querySelector(".selis-editor-inline__text") === null ? "closed" : "open") +
              ", the lines were " +
              JSON.stringify(lines(doc)) +
              ", and the status said " +
              statusText(doc) +
              ", the busy flag was " +
              (doc.getElementById("selis-editor-doc").dataset.busy || "?") +
              ", the inline state was " +
              (doc.getElementById("selis-editor-doc").dataset.inline || "?"),
          );
        }
        record.after = lines(doc);
        record.edited = statusText(doc);
        // The change is DONE when the status says so: the lines change as
        // soon as the new document is drawn, which is before the workspace
        // has finished with it.
        await waitForSettled(doc, "Changed the text", "the edit to settle (" + label + ")");

        // Undo must bring the document back exactly as it was.
        const undoButton = doc.getElementById("selis-undo");
        undoButton.click();
        try {
          await waitFor(
            () => lines(doc)[0] === original,
            30_000,
            "the undo to restore the line (" + label + ")",
          );
        } catch (error) {
          throw new Error(
            String(error) +
              " -- the undo button was " +
              (undoButton.disabled ? "disabled" : "enabled") +
              ", the lines were " +
              JSON.stringify(lines(doc)) +
              ", and the status said " +
              statusText(doc),
          );
        }
        record.undone = lines(doc);
        record.undoStatus = statusText(doc);

        // And redo must bring the change back.
        doc.getElementById("selis-redo").click();
        await waitFor(
          () => lines(doc)[0] === changed,
          30_000,
          "the redo to restore the change (" + label + ")",
        );
        record.redone = lines(doc);

        record.output = await download(doc, win);
        record.noUpload = doc.documentElement.dataset.noUpload || "";
        return record;
      }

      /**
       * Add a text box where the reader clicks, and check the document carries
       * it.
       */
      async function textBoxLeg(doc, win, label) {
        useTool(doc, "box");
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        const box = canvas.getBoundingClientRect();
        const at = { x: 40, y: 220 };
        const opts = {
          clientX: box.left + at.x,
          clientY: box.top + at.y,
          bubbles: true,
          cancelable: true,
          button: 0,
          pointerId: 4,
          isPrimary: true,
        };
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...opts, buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...opts, buttons: 0 }));
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          10_000,
          "the text box editor (" + label + ")",
        );
        const area = doc.querySelector(".selis-editor-inline__text");

        // The formatting row: the size and the colour the reader chooses
        // BEFORE the text is placed, the way Acrobat and Foxit do it. The
        // controls are checked against the DOCUMENT, not against the DOM:
        // the colour has to be IN the file.
        const tools = doc.querySelector(".selis-editor-inline__tools");
        const select = tools ? tools.querySelector("select") : null;
        const swatches = tools ? [...tools.querySelectorAll("button[data-color]")] : [];
        if (select) {
          select.value = "24";
          select.dispatchEvent(new Event("change", { bubbles: true }));
        }
        const red = swatches.find((swatch) => swatch.dataset.color === "Red");
        if (red) red.click();
        const chosenSize = select ? select.value : "";
        const chosenColour = red && red.getAttribute("aria-pressed") === "true" ? "Red" : "";

        // The styles: bold, italic and underline, the way every editor that
        // can draw text offers them.
        for (const flag of ["bold", "italic", "underline"]) {
          const button = tools.querySelector('button[data-style="' + flag + '"]');
          if (!button) throw new Error("the formatting row has no " + flag + " button");
          button.click();
        }
        const styles = [...tools.querySelectorAll("button[data-style]")].map((button) => ({
          flag: button.dataset.style,
          pressed: button.getAttribute("aria-pressed"),
        }));

        const text = "Added by the editor";
        area.value = text;
        area.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }),
        );
        await waitFor(
          () => lines(doc).some((line) => line.includes(text)),
          30_000,
          "the text box to be drawn (" + label + ")",
        );
        const produced = await download(doc, win);
        return {
          text,
          lines: lines(doc),
          status: statusText(doc),
          bytes: produced.bytes,
          carriesText: produced.carriesText.indexOf(text) >= 0,
          chosenSize: chosenSize,
          chosenColour: chosenColour,
          styles: styles,
          // The face is in the FILE, and so is the rule under the line.
          carriesTheFace: produced.carriesText.indexOf("Helvetica-BoldOblique") >= 0,
          carriesTheRule: produced.carriesText.indexOf(" l\n") >= 0,
          // The stamp writes the colour into the content stream as
          // "r g b rg". A red box has to be red in the FILE.
          carriesColour: produced.carriesText.indexOf("1 0 0 rg") >= 0,
        };
      }

      /**
       * Place the picked image where the reader drags, and check the document
       * carries it.
       */
      async function imageLeg(doc, win, pngBytes, label) {
        const file = new File([pngBytes], "mark.png", { type: "image/png" });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        const input = doc.getElementById("selis-editor-image-input");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFor(
          () => doc.getElementById("selis-editor-doc").dataset.tool === "image",
          15_000,
          "the image tool (" + label + ")",
        );
        await dragOnCanvas(doc, { x: 30, y: 30 }, { x: 110, y: 90 });
        await waitForSettled(doc, "Added an image", "the image to be placed (" + label + ")");
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          bytes: produced.bytes,
          carriesImage: produced.carriesText.indexOf("/Subtype /Image") >= 0,
        };
      }

      /**
       * Redact the region the reader drags over, and check the text under it
       * is gone from the document.
       */
      async function redactLeg(doc, win, label) {
        useTool(doc, "redact");
        const line = doc.querySelector(".selis-editor-line");
        if (!line) throw new Error("the document drew no clickable text");
        const canvas = doc.querySelector("canvas");
        const text = line.getBoundingClientRect();
        const box = canvas.getBoundingClientRect();
        await dragOnCanvas(
          doc,
          { x: text.left - box.left - 4, y: text.top - box.top - 4 },
          { x: text.right - box.left + 4, y: text.bottom - box.top + 4 },
        );
        await waitForSettled(doc, "Redacted", "the region to be redacted (" + label + ")");
        const produced = await download(doc, win);
        const carried = produced.carriesText;
        return {
          status: statusText(doc),
          lines: lines(doc),
          bytes: produced.bytes,
          // The redacted text must be GONE from the file, not merely covered.
          stillCarriesText: carried.indexOf("Invoice total") >= 0,
          coversText: carried.indexOf("0 0 0 rg") >= 0,
        };
      }

      /**
       * The workspace's own furniture: the ribbon, the rail's thumbnails, the
       * find box, the zoom, and the history panel.
       *
       * These are the parts of the shell a person touches before they change
       * anything, and each of them is checked against the DOCUMENT rather
       * than against the DOM alone: the watermark leg reads the produced bytes
       * back, because a watermark that is on the screen but not in the file
       * is not a watermark.
       */
      async function shellLeg(doc, win, label) {
        // The rail draws a thumbnail for every page. The thumbnail is drawn
        // out of band - it is a copy of the page's raster, produced
        // asynchronously - so the check WAITS for it rather than reading the
        // rail at a moment when the copy has not landed yet.
        await waitFor(
          () =>
            [...doc.querySelectorAll("#selis-page-list img[data-thumb]")].some((img) =>
              (img.getAttribute("src") || "").startsWith("blob:"),
            ),
          20_000,
          "the rail's thumbnail (" + label + ")",
        );
        const thumbs = [...doc.querySelectorAll("#selis-page-list img[data-thumb]")];
        const drawn = thumbs.filter((img) =>
          (img.getAttribute("src") || "").startsWith("blob:"),
        ).length;

        // The ribbon's tabs swap the commands under them.
        doc.getElementById("selis-editor-tab-organize").click();
        const organizeShown = !doc.getElementById("selis-editor-panel-organize").hidden;
        doc.getElementById("selis-editor-tab-edit").click();
        const editShown = !doc.getElementById("selis-editor-panel-edit").hidden;

        // The find box finds the text the document carries. It searches for
        // the text the text-box leg added rather than for the fixture's own
        // line: the redaction leg has already taken the fixture's line out
        // of the document, and a find box that found nothing would be right
        // to say so.
        const search = doc.getElementById("selis-editor-search");
        search.value = "Added by the editor";
        search.dispatchEvent(new Event("input", { bubbles: true }));
        await waitFor(
          () => doc.querySelectorAll('.selis-editor-line[data-match="true"]').length > 0,
          20_000,
          "the find box to match (" + label + ")",
        );
        const matched = doc.querySelectorAll('.selis-editor-line[data-match="true"]').length;
        const counted = doc.getElementById("selis-editor-search-count").textContent;

        // The zoom changes the size of the page on the canvas.
        const before = doc.querySelector("canvas").getBoundingClientRect().width;
        doc.getElementById("selis-editor-zoom-in").click();
        await waitFor(
          () => doc.querySelector("canvas").getBoundingClientRect().width !== before,
          30_000,
          "the zoom to change the page (" + label + ")",
        );
        const after = doc.querySelector("canvas").getBoundingClientRect().width;
        const zoom = doc.getElementById("selis-editor-zoom-level").textContent;

        // The history panel lists what has been done.
        const history = [
          ...doc.querySelectorAll("#selis-editor-history .selis-editor-history__item"),
        ].map((item) => (item.textContent || "").trim());

        // A watermark, read back out of the produced file.
        doc.getElementById("selis-editor-watermark-text").value = "DRAFT";
        doc.getElementById("selis-editor-watermark-apply").click();
        await waitForSettled(doc, "Applied the watermark", "the watermark (" + label + ")");
        const produced = await download(doc, win);

        return {
          status: statusText(doc),
          thumbnails: drawn,
          tabs: organizeShown && editShown,
          matched: matched,
          counted: counted,
          zoom: zoom,
          zoomed: after !== before,
          history: history.length,
          bytes: produced.bytes,
          carriesWatermark: produced.carriesText.indexOf("DRAFT") >= 0,
        };
      }

      /**
       * The workspace's face, before any document is open.
       *
       * Two things a reader meets in the first second: the invitation to
       * open a file, and the panel they can put away. The first must be ON
       * the screen - a reader who has to scroll to find out that they have
       * not opened a file yet has been told the wrong thing - and the second
       * must be a door and not a wall: a control that disappears with the
       * thing it controls is a one-way door.
       */
      async function faceLeg(doc, win, label) {
        const surface = doc.getElementById("selis-editor-surface");
        const card = doc.getElementById("selis-editor-empty");
        const surfaceBox = surface.getBoundingClientRect();
        const cardBox = card.getBoundingClientRect();
        const emptyVisible =
          cardBox.top >= surfaceBox.top && cardBox.bottom <= surfaceBox.bottom;
        // Nothing to scroll: the canvas holds exactly what is on the screen.
        const nothingToScroll = surface.scrollHeight <= surface.clientHeight + 1;

        // The invitation's own button must ask for a file: a button that
        // says "Open a PDF" and does nothing is worse than no button.
        const fileInput = doc.getElementById("selis-open-file");
        let pickerAsked = 0;
        const nativeClick = fileInput.click;
        fileInput.click = function () {
          pickerAsked += 1;
        };
        card.querySelector('button[data-action="open"]').click();
        fileInput.click = nativeClick;

        // The app bar with nothing open: there is nothing to download and
        // nothing to close. The measurement is VISIBILITY, not the
        // attribute: a button with `hidden` on it is still on the screen
        // when a class sets `display`, and that is what the reader saw.
        const visible = (id) => {
          const element = doc.getElementById(id);
          return element !== null && element.offsetParent !== null;
        };
        const emptyBar = {
          downloadShown: visible("selis-download"),
          openShown: visible("selis-open-file-button"),
          closeShown: visible("selis-close-file-button"),
        };

        const inspector = doc.getElementById("selis-editor-inspector");
        const toggle = doc.getElementById("selis-editor-inspector-toggle");
        const open = Math.round(inspector.getBoundingClientRect().width);
        toggle.click();
        const collapsed = Math.round(inspector.getBoundingClientRect().width);
        // The button is still there, and it is still a button.
        const buttonThere =
          toggle.offsetParent !== null && toggle.getBoundingClientRect().width > 0;
        const toggleLabel = toggle.getAttribute("aria-label");
        toggle.click();
        const restored = Math.round(inspector.getBoundingClientRect().width);
        return {
          emptyVisible: emptyVisible,
          nothingToScroll: nothingToScroll,
          emptyBar: emptyBar,
          open: open,
          collapsed: collapsed,
          restored: restored,
          buttonThere: buttonThere,
          pickerAsked: pickerAsked > 0,
          label: toggleLabel,
        };
      }

      /**
       * The theme switch.
       *
       * The switch is checked against the ROOT ELEMENT and the STORED
       * choice, because a switch that changed nothing would still look right.
       */
      async function themeLeg(doc, win, label) {
        const before = doc.documentElement.dataset.theme || "";
        doc.getElementById("selis-theme-toggle").click();
        await waitFor(
          () => (doc.documentElement.dataset.theme || "") !== before,
          10_000,
          "the theme to switch (" + label + ")",
        );
        const after = doc.documentElement.dataset.theme || "";
        const stored = doc.defaultView.localStorage.getItem("selis-theme");
        // Put it back, so the rest of the check runs in the theme it started in.
        doc.getElementById("selis-theme-toggle").click();
        return {
          before: before,
          after: after,
          stored: stored,
          switched: after !== before,
          remembered: stored === after,
        };
      }

      /**
       * The export: the document written out in another format.
       *
       * The file is read back rather than trusted: a Word document is a ZIP
       * container, so its first two bytes are "PK", and a deck and a workbook
       * are ZIP containers too.
       */
      async function exportLeg(doc, win, label) {
        doc.getElementById("selis-editor-tab-export").click();
        await waitFor(
          () => !doc.getElementById("selis-editor-panel-export").hidden,
          10_000,
          "the export tab (" + label + ")",
        );
        const formats = [...doc.querySelectorAll("#selis-editor-export button[data-export]")].map(
          (button) => button.dataset.export,
        );
        const word = await exportFile(doc, win, "word", label);
        const html = await exportFile(doc, win, "html", label);
        const png = await exportFile(doc, win, "png", label);
        // The file the export produced must STILL BE THERE afterwards: the
        // object URL is what the reader takes it with, and a revoked URL
        // downloads an EMPTY file rather than failing.
        const link = doc.querySelector("#selis-editor-export-result a");
        let alive = false;
        if (link) {
          try {
            const response = await doc.defaultView.fetch(link.getAttribute("href"));
            alive = response.ok;
          } catch (_) {
            alive = false;
          }
        }
        return {
          formats: formats,
          word: word.name,
          wordBytes: word.bytes,
          wordHeader: word.header,
          html: html.name,
          htmlBytes: html.bytes,
          htmlHeader: html.header,
          png: png.name,
          pngBytes: png.bytes,
          // A PNG starts with the four bytes 89 50 4E 47.
          pngHeader: png.header,
          htmlCarriesTheText: html.text.indexOf("Added") >= 0,
          offeredAgain: link !== null,
          stillThere: alive,
        };
      }
      /**
       * One exported file, captured rather than downloaded.
       *
       * The export is asynchronous, so the anchor's click is captured by
       * overriding it and the capture is waited for.
       */
      async function exportFile(doc, win, format, label) {
        const captured = {};
        const originalClick = win.HTMLAnchorElement.prototype.click;
        const originalCreate = win.URL.createObjectURL;
        // The blob is captured at CREATION, because the page releases the
        // object URL as soon as the download has been handed to the browser
        // - and the export is asynchronous, so the check's poll would arrive
        // after the URL was gone. The Blob itself outlives its URL.
        const blobs = new Map();
        win.URL.createObjectURL = function (blob) {
          const url = originalCreate.call(win.URL, blob);
          blobs.set(url, blob);
          return url;
        };
        win.HTMLAnchorElement.prototype.click = function () {
          captured.href = this.href;
          captured.download = this.download;
          captured.blob = blobs.get(this.href) || null;
        };
        try {
          doc.querySelector('#selis-editor-export button[data-export="' + format + '"]').click();
          await waitFor(
            () => captured.href !== undefined,
            60_000,
            "the " + format + " export (" + label + ")",
          );
          const blob = captured.blob;
          if (!blob) {
            throw new Error("the " + format + " export produced no blob to read");
          }
          const produced = new Uint8Array(await blob.arrayBuffer());
          return {
            name: captured.download || "",
            bytes: produced.length,
            header: String.fromCharCode(...produced.slice(0, 4)),
            text: new TextDecoder("latin1").decode(produced),
          };
        } finally {
          win.HTMLAnchorElement.prototype.click = originalClick;
          win.URL.createObjectURL = originalCreate;
        }
      }

      /**
       * The Bates numbers, read back out of the produced file.
       *
       * The prefix is the reader's own, so it is the thing worth looking for:
       * a stamp that is not in the file is not a stamp.
       */
      async function batesLeg(doc, win, label) {
        doc.getElementById("selis-editor-bates-prefix").value = "SELIS-";
        doc.getElementById("selis-editor-bates-apply").click();
        await waitForSettled(doc, "Stamped the Bates numbers", "the Bates numbers (" + label + ")");
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          bytes: produced.bytes,
          carriesThePrefix: produced.carriesText.indexOf("SELIS-") >= 0,
        };
      }

      /** Arm the workspace for a tool. */
      function useTool(doc, tool) {
        doc.querySelector('#selis-editor-tools button[data-tool="' + tool + '"]').click();
      }

      /**
       * Crop the page by a margin, and check the page got smaller.
       */
      async function cropLeg(doc, win, label) {
        const before = doc.querySelector("canvas").getBoundingClientRect().width;
        doc.getElementById("selis-editor-crop-right").value = "20";
        doc.getElementById("selis-editor-crop-apply").click();
        await waitForSettled(doc, "Cropped", "the page to be cropped (" + label + ")");
        const after = doc.querySelector("canvas").getBoundingClientRect().width;
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          before: Math.round(before),
          after: Math.round(after),
          bytes: produced.bytes,
          narrowed: after < before,
        };
      }

      /**
       * Resize the page to a named size, and check the page changed size.
       */
      async function resizeLeg(doc, win, label) {
        const before = doc.querySelector("canvas").getBoundingClientRect();
        const select = doc.getElementById("selis-editor-size");
        select.value = "a5";
        doc.getElementById("selis-editor-resize-apply").click();
        await waitForSettled(doc, "Resized", "the page to be resized (" + label + ")");
        const after = doc.querySelector("canvas").getBoundingClientRect();
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          before: Math.round(before.width) + "x" + Math.round(before.height),
          after: Math.round(after.width) + "x" + Math.round(after.height),
          bytes: produced.bytes,
          resized: Math.round(after.width) !== Math.round(before.width),
        };
      }

      /**
       * Read the document's bookmarks, add one, save them, and check the file
       * carries the new bookmark.
       */
      async function bookmarksLeg(doc, win, label) {
        doc.getElementById("selis-editor-outline-read").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return status.endsWith("read.") && !status.endsWith("…");
          },
          30_000,
          "the bookmarks to be read (" + label + ")",
        );
        const read = [...doc.querySelectorAll("#selis-editor-outline .selis-editor-bookmark")].length;
        doc.getElementById("selis-editor-outline-add").click();
        const title = doc.querySelector(
          "#selis-editor-outline .selis-editor-bookmark:last-child input[data-title]",
        );
        title.value = "A bookmark from the editor";
        doc.getElementById("selis-editor-outline-apply").click();
        await waitForSettled(doc, "Saved the bookmarks", "the bookmarks to be saved (" + label + ")");
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          read: read,
          bytes: produced.bytes,
          carriesBookmark: produced.carriesText.indexOf("A bookmark from the editor") >= 0,
        };
      }

      /**
       * Write the document's title, and check it is in the file.
       */
      async function propertiesLeg(doc, win, label) {        doc.getElementById("selis-editor-title").value = "A title from the editor";
        doc.getElementById("selis-editor-properties-apply").click();
        await waitForSettled(
          doc,
          "Saved the document",
          "the properties to be saved (" + label + ")",
        );
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          bytes: produced.bytes,
          carriesTitle: produced.carriesText.indexOf("A title from the editor") >= 0,
        };
      }

      /**
       * Read the form's fields, fill one in, and check the value is in the
       * file.
       */
      async function formLeg(doc, win, formBytes, label) {
        // The form is a document of its own: the workspace holds one document
        // at a time, so the form replaces what was open.
        const file = new File([formBytes], "form.pdf", { type: "application/pdf" });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        const input = doc.getElementById("selis-open-file");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFor(
          () => statusText(doc).startsWith("Opened form.pdf"),
          30_000,
          "the form to be opened (" + label + ")",
        );
        doc.getElementById("selis-editor-fields-read").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return status.endsWith("found.") && !status.endsWith("…");
          },
          30_000,
          "the form's fields to be read (" + label + ")",
        );
        const fields = [...doc.querySelectorAll("#selis-editor-fields input[data-field]")].map(
          (input) => ({
            name: input.dataset.field,
            disabled: input.disabled,
            value: input.value,
          }),
        );
        // The read-only field is shown but not editable: the engine refuses to
        // override the flag, and a workspace that offered it would fail the
        // whole fill.
        const frozen = fields.find((field) => field.name === "Frozen");
        const name = doc.querySelector('#selis-editor-fields input[data-field="Name"]');
        name.value = "Filled by the editor";
        doc.getElementById("selis-editor-fields-apply").click();
        await waitForSettled(doc, "Filled the form fields", "the form to be filled (" + label + ")");
        const produced = await download(doc, win);
        return {
          status: statusText(doc),
          fields: fields.length,
          readOnlyNotEditable: frozen ? frozen.disabled === true : false,
          bytes: produced.bytes,
          carriesValue: produced.carriesText.indexOf("Filled by the editor") >= 0,
        };
      }

      /** Drag on the canvas, in the canvas's own CSS pixels. */
      async function dragOnCanvas(doc, from, to) {
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        const box = canvas.getBoundingClientRect();
        const at = (point) => ({
          clientX: box.left + point.x,
          clientY: box.top + point.y,
          bubbles: true,
          cancelable: true,
          button: 0,
          pointerId: 5,
          isPrimary: true,
        });
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...at(from), buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointermove", { ...at(to), buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...at(to), buttons: 0 }));
      }

      /**
       * Download the document and read the bytes back.
       *
       * The anchor's click is captured so the bytes can be read rather than
       * trusted.
       */
      async function download(doc, win) {
        // The download button is disabled while an operation runs, and the
        // status line says the operation is done a moment before the button
        // comes back. Waiting for the button is what makes the read the
        // document's real bytes rather than nothing at all.
        await waitFor(
          () => !doc.getElementById("selis-download").disabled,
          20_000,
          "the download to be ready",
        );
        const captured = {};
        const originalClick = win.HTMLAnchorElement.prototype.click;
        win.HTMLAnchorElement.prototype.click = function () {
          captured.href = this.href;
          captured.download = this.download;
        };
        doc.getElementById("selis-download").click();
        win.HTMLAnchorElement.prototype.click = originalClick;
        if (!captured.href) throw new Error("the download produced no blob URL");
        const blob = await win.fetch(captured.href).then((r) => r.blob());
        const produced = new Uint8Array(await blob.arrayBuffer());
        return {
          blob: true,
          downloadName: captured.download || "",
          bytes: produced.length,
          header: String.fromCharCode(...produced.slice(0, 5)),
          carriesText: new TextDecoder("latin1").decode(produced),
        };
      }

      /**
       * The placement tools, tested the way a reader uses them.
       *
       * The check dispatches the click at the element the browser would
       * actually hit. The text layer covers the whole page, so while it took
       * the pointer, a click on EMPTY SPACE landed on the layer and never
       * reached the canvas - and every tool that puts something on the page
       * was dead on any page the reader did not click exactly on a word.
       *
       * Dispatching on the canvas directly, as the older leg did, is exactly
       * what hid the bug: it bypassed the hit test that a reader goes
       * through.
       */
      async function placementLeg(doc, win, label) {
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        // The tool is armed FIRST: the reader picks the tool, then clicks
        // the page, and what the page is for - to be read, or to be drawn on
        // - is decided by the tool.
        useTool(doc, "box");
        const box = canvas.getBoundingClientRect();

        // The blank part of the page: a click there must reach the canvas.
        // While the text layer took the pointer, it did not, and every
        // placement tool was dead on any page the reader did not click
        // exactly on a word.
        let blank = null;
        let hit = "";
        for (const share of [0.72, 0.62, 0.82, 0.52, 0.9]) {
          const candidate = doc.elementFromPoint(box.left + 60, box.top + Math.round(box.height * share));
          if (candidate === canvas) {
            blank = { x: box.left + 60, y: box.top + Math.round(box.height * share) };
            hit = candidate.className || candidate.tagName;
            break;
          }
        }
        if (!blank) {
          throw new Error("no blank spot on the page reached the canvas");
        }

        // And a click OVER TEXT must reach it too: a reader drags a text box
        // across a paragraph as often as not, and a word that takes the
        // event is a word that swallows the drag.
        // A line that actually carries words: the text layer can carry an
        // empty run, and an empty run has no width to click on.
        const line = [...doc.querySelectorAll(".selis-editor-line")].find((candidate) => {
          const rect = candidate.getBoundingClientRect();
          return (candidate.textContent || "").trim() !== "" && rect.width > 4;
        });
        if (!line) throw new Error("the document drew no clickable text");
        const lineBox = line.getBoundingClientRect();
        const over = { x: lineBox.left + 2, y: lineBox.top + lineBox.height / 2 };
        // What the browser would hit at that point. With a placement tool
        // armed the line does NOT take the pointer, so the answer is the
        // canvas underneath - and that is the whole claim: a click over
        // text reaches the canvas.
        const overTarget = doc.elementFromPoint(over.x, over.y);
        const overText =
          over.x >= lineBox.left &&
          over.x <= lineBox.right &&
          over.y >= lineBox.top &&
          over.y <= lineBox.bottom;

        const opts = {
          clientX: over.x,
          clientY: over.y,
          bubbles: true,
          cancelable: true,
          button: 0,
          pointerId: 6,
          isPrimary: true,
        };
        const target = overTarget === null ? canvas : overTarget;
        target.dispatchEvent(new PointerEvent("pointerdown", { ...opts, buttons: 1 }));
        target.dispatchEvent(new PointerEvent("pointerup", { ...opts, buttons: 0 }));
        try {
          await waitFor(
            () => doc.querySelector(".selis-editor-inline__text") !== null,
            10_000,
            "the text box editor on empty space (" + label + ")",
          );
        } catch (error) {
          throw new Error(
            String(error) +
              " -- the hit was " +
              hit +
              ", the tool was " +
              doc.getElementById("selis-editor-doc").dataset.tool +
              ", the status said " +
              statusText(doc) +
              ", the busy flag was " +
              (doc.getElementById("selis-editor-doc").dataset.busy || "?") +
              ", the hit target was " +
              (doc.getElementById("selis-editor-doc").dataset.hit || "?") +
              ", the tool was " +
              (doc.getElementById("selis-editor-doc").dataset.tool2 || "?") +
              ", the line's pointer was " +
              (() => {
                const line = doc.querySelector(".selis-editor-line");
                return line === null ? "no line" : getComputedStyle(line).pointerEvents;
              })() +
              ", the served css has the rule: " +
              (await doc.defaultView
                .fetch("/assets/editor.css")
                .then((response) => response.text())
                .then((text) => text.includes('[data-tool="text"]'))
                .catch(() => "not readable")) +
              ", the loaded sheets are " +
              Array.from(doc.styleSheets)
                .map((sheet) => sheet.href || "inline")
                .join(",") +
              ", the loaded editor css has the rule: " +
              Array.from(doc.styleSheets)
                .filter((sheet) => (sheet.href || "").includes("editor.css"))
                .map((sheet) => {
                  try {
                    return Array.from(sheet.cssRules)
                      .some((rule) => rule.selectorText && rule.selectorText.includes('[data-tool="text"]'));
                  } catch (error) {
                    return "unreadable";
                  }
                })
                .join(","),
          );
        }
        // The editor is cancelled, so the document is left as it was.
        doc.querySelector(".selis-editor-inline__text").dispatchEvent(
          new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }),
        );
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") === null,
          10_000,
          "the editor to close (" + label + ")",
        );
        return {
          hit: hit,
          onCanvas: blank !== null,
          overText: overText,
          overTheCanvas: overTarget === canvas,
          lineBox: [
            Math.round(lineBox.left),
            Math.round(lineBox.top),
            Math.round(lineBox.right),
            Math.round(lineBox.bottom),
          ],
          over: [Math.round(over.x), Math.round(over.y)],
          stack: Array.from(doc.elementsFromPoint(over.x, over.y)).map(
            (element) => element.className || element.tagName,
          ),
          opened: true,
        };
      }

      /**
       * The inline editor must BE the line it is over.
       *
       * The editor's text and the printed line's text have to share a
       * baseline: an editor that floats below the line it is editing is a
       * form, and a form is not editing a document. The size has to be the
       * line's own size, for the same reason.
       */
      async function inlineLeg(doc, win, label) {
        useTool(doc, "text");
        const line = doc.querySelector(".selis-editor-line");
        if (!line) throw new Error("the document drew no clickable text");
        line.click();
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          10_000,
          "the inline editor (" + label + ")",
        );
        const overlay = line.querySelector(".selis-editor-line__text");
        const area = doc.querySelector(".selis-editor-inline__text");
        const root = doc.querySelector(".selis-editor-inline");
        const overlayBox = overlay.getBoundingClientRect();
        const areaBox = area.getBoundingClientRect();
        const rootBox = root.getBoundingClientRect();
        const lineBox = line.getBoundingClientRect();
        const gap = Math.round((areaBox.top - overlayBox.top) * 100) / 100;
        const size = getComputedStyle(area).fontSize;
        const lineSize = getComputedStyle(overlay).fontSize;
        // Cancel, so the document is left as it was.
        area.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }),
        );
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") === null,
          10_000,
          "the editor to close (" + label + ")",
        );

        // Clicking away COMMITS the change, the way Acrobat does: an edit
        // that is thrown away because the reader looked elsewhere is a
        // silent loss, and a silent loss is worse than a visible change.
        line.click();
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          10_000,
          "the inline editor again (" + label + ")",
        );
        const again = doc.querySelector(".selis-editor-inline__text");
        const before = line.textContent;
        const changed = before.replace("1200", "1500");
        if (changed === before) {
          throw new Error("the fixture's text did not carry the word the check replaces");
        }
        again.value = changed;
        const canvas = doc.querySelector("canvas");
        const canvasBox = canvas.getBoundingClientRect();
        canvas.dispatchEvent(
          new PointerEvent("pointerdown", {
            clientX: canvasBox.left + 40,
            clientY: canvasBox.top + Math.round(canvasBox.height * 0.8),
            bubbles: true,
            cancelable: true,
            button: 0,
            buttons: 1,
            pointerId: 8,
            isPrimary: true,
          }),
        );
        await waitFor(
          () => lines(doc)[0] === changed,
          30_000,
          "the change to be committed by clicking away (" + label + ")",
        );
        const committed = lines(doc)[0] === changed;
        // And undo puts it back, so the rest of the check sees the document
        // it was given.
        doc.getElementById("selis-undo").click();
        await waitFor(
          () => lines(doc)[0] === before,
          30_000,
          "the undo to restore the line (" + label + ")",
        );

        return {
          gap: gap,
          size: size,
          lineSize: lineSize,
          overTheLine:
            Math.abs(rootBox.top - lineBox.top) < 1 && Math.abs(rootBox.left - lineBox.left) < 1,
          committedOnClickAway: committed,
        };
      }


      /**
       * The command palette.
       *
       * The palette is a VIEW over the ribbon, so the leg checks that it
       * really is one: it must offer the ribbon's commands, it must narrow
       * to what was typed, and running one must open the panel that command
       * opens.
       */
      async function paletteLeg(doc, win, label) {
        doc.getElementById("selis-editor-palette-button").click();
        await waitFor(
          () => doc.getElementById("selis-editor-palette").open,
          10_000,
          "the palette to open (" + label + ")",
        );
        const all = doc.querySelectorAll(".selis-editor-palette__item").length;
        const input = doc.getElementById("selis-editor-palette-input");
        input.value = "watermark";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        await waitFor(
          () =>
            doc.querySelectorAll(".selis-editor-palette__item").length > 0 &&
            doc.querySelectorAll(".selis-editor-palette__item").length < all,
          10_000,
          "the palette to narrow (" + label + ")",
        );
        const narrowed = doc.querySelectorAll(".selis-editor-palette__item").length;
        const text = doc.querySelector(".selis-editor-palette__item").textContent;
        // Running the command must open the panel that command opens.
        doc.querySelector(".selis-editor-palette__item").click();
        await waitFor(
          () => !doc.getElementById("selis-editor-palette").open,
          10_000,
          "the palette to close (" + label + ")",
        );
        const section = doc.getElementById("selis-editor-section-watermark");
        return {
          commands: all,
          narrowed: narrowed,
          matched: text,
          ran: section !== null && section.open,
        };
      }

      /**
       * The panels that read and change the document: the accessibility
       * report, the attachments and "keep these pages".
       */
      async function panelsLeg(doc, win, label) {
        // The accessibility report. The fixture carries no tag tree, so the
        // honest answer is "not tagged" - and the leg checks that the
        // report says that rather than claiming headings it never saw.
        doc.getElementById("selis-editor-accessibility-check").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("tagged");
          },
          30_000,
          "the accessibility report (" + label + ")",
        );
        const report = doc.getElementById("selis-editor-accessibility").textContent.trim();

        // The attachments: a file is attached, and it travels.
        const carried = new File([new Uint8Array([104, 105])], "notes.txt", { type: "text/plain" });
        const transfer = new DataTransfer();
        transfer.items.add(carried);
        const input = doc.getElementById("selis-editor-attachment-input");
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("notes.txt");
          },
          30_000,
          "the file to be attached (" + label + ")",
        );
        doc.getElementById("selis-editor-attachments-read").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("carries");
          },
          30_000,
          "the attachments to be read (" + label + ")",
        );
        const attachments = doc.getElementById("selis-editor-attachments").textContent.trim();

        // "Keep these pages": the first page of the first page is still
        // the first page.
        doc.getElementById("selis-editor-split-from").value = "1";
        doc.getElementById("selis-editor-split-to").value = "1";
        doc.getElementById("selis-editor-split-apply").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("Kept");
          },
          30_000,
          "the pages to be kept (" + label + ")",
        );
        const kept = statusText(doc);

        return {
          report: report,
          attachments: attachments,
          kept: kept,
          pages: doc.querySelectorAll(".selis-editor-page").length,
        };
      }


      /**
       * The measure tool and the signature.
       *
       * Both are tools the reader uses on the page itself, and both are
       * checked against the DOCUMENT: the measurement must be the page's own
       * distance, and the signature must be IN the file.
       */
      async function toolsLeg(doc, win, label) {
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        const box = canvas.getBoundingClientRect();
        const at = (x, y, buttons, type) =>
          new PointerEvent(type, {
            clientX: box.left + x,
            clientY: box.top + y,
            bubbles: true,
            cancelable: true,
            button: 0,
            buttons,
            pointerId: 7,
            isPrimary: true,
          });

        // The measurement: a drag between two points, and the number is the
        // page's own.
        useTool(doc, "measure");
        canvas.dispatchEvent(at(100, 100, 1, "pointerdown"));
        canvas.dispatchEvent(at(400, 300, 1, "pointermove"));
        canvas.dispatchEvent(at(400, 300, 0, "pointerup"));
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("Measured");
          },
          20_000,
          "the measurement (" + label + ")",
        );
        const measured = statusText(doc);
        const overlay = doc.querySelectorAll(".selis-editor-measure").length;

        // The signature: a drawn path, stamped onto the page.
        const before = doc.querySelectorAll(".selis-editor-line").length;
        useTool(doc, "sign");
        canvas.dispatchEvent(at(100, 200, 1, "pointerdown"));
        for (let i = 0; i <= 20; i += 1) {
          canvas.dispatchEvent(at(100 + i * 10, 200 - Math.sin(i / 2) * 30, 1, "pointermove"));
        }
        canvas.dispatchEvent(at(300, 200, 0, "pointerup"));
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("Signed");
          },
          30_000,
          "the signature (" + label + ")",
        );
        const signed = statusText(doc);
        const produced = await download(doc, win);

        return {
          measured: measured,
          overlay: overlay,
          signed: signed,
          bytes: produced.bytes,
          // The signature is a stamp on the page: the produced file carries
          // the stroke it drew. The stamp writes a freehand stroke as a
          // moveto and a run of linetos.
          carriesTheSignature: produced.carriesText.indexOf(" l\n") >= 0,
          linesBefore: before,
        };
      }


      /**
       * The markup: the marks a reader leaves on a document.
       *
       * The mark must be IN the file, and it must be a standard PDF
       * annotation - a highlight that is only on the screen is not a
       * highlight. The check reads the produced bytes for the annotation
       * itself and reads the document's own report back.
       */
      async function markupLeg(doc, win, label) {
        const canvas = doc.querySelector("canvas");
        if (!canvas) throw new Error("the document drew no canvas");
        const line = [...doc.querySelectorAll(".selis-editor-line")].find((candidate) => {
          if ((candidate.textContent || "").trim() === "") return false;
          return candidate.getBoundingClientRect().width > 4;
        });
        if (!line) throw new Error("the document drew no clickable text");
        const box = line.getBoundingClientRect();
        const at = (x, y, buttons, type) =>
          new PointerEvent(type, {
            clientX: x,
            clientY: y,
            bubbles: true,
            cancelable: true,
            button: 0,
            buttons,
            pointerId: 9,
            isPrimary: true,
          });

        // The highlight: a drag over the words.
        doc.getElementById("selis-editor-tab-edit").click();
        doc.querySelector('button[data-markup="highlight"]').click();
        canvas.dispatchEvent(at(box.left, box.top, 1, "pointerdown"));
        canvas.dispatchEvent(at(box.right, box.bottom, 1, "pointermove"));
        canvas.dispatchEvent(at(box.right, box.bottom, 0, "pointerup"));
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("mark");
          },
          30_000,
          "the highlight (" + label + ")",
        );
        const marked = statusText(doc);
        const produced = await download(doc, win);

        // The note: a click, and the comment is written where the note goes.
        // The canvas is looked up AGAIN: the highlight redrew the page, so
        // the canvas the drag was on is no longer in the document.
        doc.querySelector('button[data-markup="note"]').click();
        const fresh = doc.querySelector("canvas");
        const freshBox = fresh.getBoundingClientRect();
        fresh.dispatchEvent(at(freshBox.left + 40, freshBox.top + 160, 1, "pointerdown"));
        fresh.dispatchEvent(at(freshBox.left + 40, freshBox.top + 160, 0, "pointerup"));
        await waitFor(
          () => doc.querySelector(".selis-editor-inline__text") !== null,
          15_000,
          "the note's comment (" + label + ")",
        );
        const area = doc.querySelector(".selis-editor-inline__text");
        area.value = "A comment from the check";
        area.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }),
        );
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("note");
          },
          30_000,
          "the note (" + label + ")",
        );
        const noted = statusText(doc);

        // And the document's own report must list both.
        doc.getElementById("selis-editor-comments-read").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("comment");
          },
          30_000,
          "the comments to be read (" + label + ")",
        );
        const comments = doc.getElementById("selis-editor-comments").textContent.trim();

        // The mark can be picked up and put down: a drag that starts on
        // it moves it. The HIGHLIGHT is armed again first: the note left
        // the note kind armed, and a drag with that kind makes a note.
        doc.querySelector('button[data-markup="highlight"]').click();
        const page = doc.querySelector("canvas");
        // The drag starts ON the mark: the highlight was placed over the
        // line, so the line's own box is where the mark is.
        const movedLine = [...doc.querySelectorAll(".selis-editor-line")].find((candidate) => {
          if ((candidate.textContent || "").trim() === "") return false;
          return candidate.getBoundingClientRect().width > 4;
        });
        const movedBox = movedLine.getBoundingClientRect();
        page.dispatchEvent(at(movedBox.left + 4, movedBox.top + 4, 1, "pointerdown"));
        page.dispatchEvent(at(movedBox.left + 4, movedBox.top + 160, 1, "pointermove"));
        page.dispatchEvent(at(movedBox.left + 4, movedBox.top + 160, 0, "pointerup"));
        let moved = "";
        try {
          await waitFor(
            () => {
              const status = statusText(doc);
              return !status.endsWith("…") && status.includes("Moved");
            },
            30_000,
            "the mark to be moved (" + label + ")",
          );
          moved = statusText(doc);
        } catch (error) {
          moved = String(error);
        }

        // And it can be taken off from the panel.
        doc.getElementById("selis-editor-comments-read").click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("comment");
          },
          30_000,
          "the comments to be read again (" + label + ")",
        );
        const remove = doc.querySelector("#selis-editor-comments button");
        if (!remove) throw new Error("the comments panel offers no way to remove a mark");
        remove.click();
        await waitFor(
          () => {
            const status = statusText(doc);
            return !status.endsWith("…") && status.includes("Removed");
          },
          30_000,
          "the mark to be removed (" + label + ")",
        );
        const removed = statusText(doc);

        return {
          marked: marked,
          noted: noted,
          comments: comments,
          moved: moved,
          removed: removed,
          bytes: produced.bytes,
          // The annotation is IN the file, and it is a standard one.
          carriesTheAnnotation: produced.carriesText.indexOf("/Subtype /Highlight") >= 0,
          carriesTheAppearance: produced.carriesText.indexOf("/Subtype /Form") >= 0,
        };
      }


      /**
       * The session: the document the reader had open survives a reload.
       *
       * The frame is reloaded and the document must come back, because a
       * reader who hits reload by accident must not lose their work. The
       * app bar's buttons are checked too: with a document open the Open
       * button becomes a Close button, and with nothing open there is
       * nothing to download.
       */
      async function sessionLeg(doc, win, label) {
        const shown = (id) => {
          const element = doc.getElementById(id);
          return element !== null && element.offsetParent !== null;
        };
        const openShown = shown("selis-open-file-button");
        const closeShown = shown("selis-close-file-button");

        // Reload the frame: the document must come back.
        const reloaded = waitForLoad(frame);
        frame.contentWindow.location.reload();
        await reloaded;
        const after = frameDocument(frame);
        await waitFor(
          () => {
            const status = statusText(after);
            return !status.endsWith("…") && status.includes("Restored");
          },
          30_000,
          "the document to be restored (" + label + ")",
        );
        const pages = after.querySelectorAll(".selis-editor-page").length;
        const filename = (after.getElementById("selis-editor-filename").textContent || "").trim();
        const status = statusText(after);
        return {
          openShown: openShown,
          closeShown: closeShown,
          restoredPages: pages,
          restoredName: filename,
          restoredStatus: status,
        };
      }

      main().catch(fail);
    </script>
  </body>
</html>
