[package]
name = "xtask"
description = "All Selis automation, in Rust (ADR-P0002)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
miniz_oxide = { workspace = true }
selis-bytes = { workspace = true }
selis-crypto = { workspace = true }
# SL-3.FONT.10: the cjk-build asset pipeline runs the font-side chunk
# builder (FONT.11 subsetting under the hood).
selis-font = { workspace = true }
selis-pdf-content = { workspace = true }
selis-pdf-cos = { workspace = true }
# The render sweep decodes oracle-driver PNG output (PDFium/pdf.js) with the
# shared flate filter — harness-side decode of oracle output only (ADR-P0009).
selis-pdf-filter = { workspace = true }
selis-pdf-engine = { workspace = true }
selis-shape = { workspace = true }
# xtask is a tool at the shell boundary: it supplies the real monotonic clock
# so engine calls it drives measure genuine wall deadlines (SL-0.SBX.07).
selis-sandbox = { workspace = true, features = ["instant-clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
# sha256 for the CORP.03 golden hashes (text + renders). Already vendored via
# selis-crypto — no new supply-chain surface.
sha2 = { workspace = true }
toml = { workspace = true }
[features]
# The Tier-2 wasm codec shell (SL-1.FILT.08 Ghostscript differential). Enabled
# only by the native oracle/tooling legs. `selis-pdf-filter/wasm-host` pulls
# `selis-sandbox/wasm-host` -> wasmtime, which has no wasm32 target, so the
# feature must not be enabled in the wasm32 size-check build of `xtask`; the
# `jpx_gs` module that uses it is `#[cfg(all(feature = "wasm-host",
# not(target_arch = "wasm32")))]`-gated accordingly.
wasm-host = ["selis-pdf-filter/wasm-host"]

# Native-only tooling. wasmtime has no wasm32 target, and the SL-1.ENC.03
# fixture generator builds committed PDFs (never needed in a wasm build).
# The size-check job builds `-p xtask --target wasm32-unknown-unknown`, so
# both must stay cfg-gated or their weight lands in the wasm size canary.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true }
# SL-1.ENC.03 fixture generator: builds the committed public-key fixtures
# (RSA/EC CMS envelopes) and hashes the Algorithm-1 seed independently of
# selis-crypto's pkcs7 module, so the engine DoD tests cross-check it.
aes = { workspace = true }
md-5 = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
