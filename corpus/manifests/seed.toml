# Corpus manifest — SL-0.CORP.01.
#
# One file per corpus under corpus/manifests/. `xtask corpus fetch` downloads to
# a local cache and verifies sha256; the files themselves are NEVER committed
# (SL-0.LEGAL.04). `tags` drive selection for `smoke`/`render`/`text` runs.
#
# Fields:
#   id          stable identifier, kebab-case, used in expectations and CI.
#   name        human-readable name.
#   source_url  where the corpus is fetched from (may be a tarball/zip).
#   sha256      the *expected hash of the downloaded artifact*, hex.
#   licence     SPDX id or "fetch-only" (see corpus/LICENSING.md).
#   tags        selection tags for the test tiers.
#   notes       why this corpus matters.

[[corpus]]
id = "pdfjs"
name = "pdf.js test corpus"
source_url = "https://github.com/mozilla/pdf.js/archive/refs/tags/v3.11.174.tar.gz"
sha256 = ""
licence = "Apache-2.0 (test files carry varied licences; fetch-only)"
tags = ["smoke", "render", "text", "forms"]
notes = "Primary pdf.js reference corpus; drives smoke + text tiers."

[[corpus]]
id = "verapdf"
name = "veraPDF corpus"
source_url = "https://github.com/veraPDF/veraPDF-corpus/archive/refs/heads/master.tar.gz"
sha256 = ""
licence = "CC0 / varied; fetch-only"
tags = ["conformance", "pdfa"]
notes = "PDF/A validation corpus for the conformance ladder."

[[corpus]]
id = "isartor"
name = "Isartor PDF/A-1 test suite"
source_url = "https://github.com/veraPDF/isartor/archive/refs/heads/master.tar.gz"
sha256 = ""
licence = "fetch-only (varied test documents)"
tags = ["conformance", "pdfa", "negative"]
notes = "PDF/A-1 negative tests: every rule violated somewhere."

[[corpus]]
id = "ghent"
name = "Ghent Workgroup output suite"
source_url = "https://www.gwg.org/resources/"
sha256 = ""
licence = "fetch-only (commercial work samples)"
tags = ["render", "cmyk", "huge"]
notes = "Prepress files: CMYK, spot colours, transparency."

[[corpus]]
id = "pdfassoc"
name = "PDF Association test suite"
source_url = "https://www.pdfa.org/"
sha256 = ""
licence = "fetch-only"
tags = ["smoke", "render", "text"]
notes = "Spec-driven samples covering ISO 32000-2 constructs."

[[corpus]]
id = "govdocs1"
name = "govdocs1 sample (fuzz seeds)"
source_url = "https://digitalcorpora.org/corpora/govdocs1/"
sha256 = ""
licence = "Public domain (US federal works); fetch-only"
tags = ["fuzz", "huge"]
notes = "Fuzzing seed corpus; sample only, never the full set."
