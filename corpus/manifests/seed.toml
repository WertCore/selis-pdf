# Corpus manifest — SL-0.CORP.01.
#
# One file per corpus under corpus/manifests/. `xtask corpus fetch` downloads to
# a local cache and verifies sha256; the files themselves are NEVER committed
# (SL-0.LEGAL.04). `tags` drive selection for `smoke`/`render`/`text` runs.
#
# Fields:
#   id          stable identifier, kebab-case, used in expectations and CI.
#   name        human-readable name.
#   source_url  where the corpus is fetched from (may be a tarball/zip).
#   sha256      the *expected hash of the downloaded artifact*, hex.
#   licence     SPDX id or "fetch-only" (see corpus/LICENSING.md).
#   tags        selection tags for the test tiers.
#   notes       why this corpus matters.

[[corpus]]
id = "pdfjs"
name = "pdf.js test corpus"
source_url = "https://github.com/mozilla/pdf.js/archive/refs/tags/v3.11.174.tar.gz"
sha256 = "4203c56665d9ce5b65d652077744bc90d055aa10a14af9ae6069e9cc247cfdc6"
licence = "Apache-2.0 (test files carry varied licences; fetch-only)"
tags = ["smoke", "render", "text", "forms"]
notes = "Primary pdf.js reference corpus; drives smoke + text tiers."

[[corpus]]
id = "verapdf"
name = "veraPDF corpus"
source_url = "https://github.com/veraPDF/veraPDF-corpus/archive/refs/heads/master.tar.gz"
sha256 = "930be25dc4e30ea7908c274ff66164a0a18978b79159799ad7871bfa63a46480"
licence = "CC0 / varied; fetch-only"
tags = ["conformance", "pdfa"]
notes = "PDF/A validation corpus for the conformance ladder. Includes the Isartor PDF/A-1 test files as a subdirectory, so there is no separate isartor manifest entry."

[[corpus]]
id = "ghent"
name = "Ghent Workgroup output suite"
source_url = "https://web.archive.org/web/20190522015112id_/http://www.gwg.org/wp-content/uploads/Ghent_PDF_Output_Suite_V50.zip"
sha256 = ""
licence = "fetch-only (Ghent Workgroup test files; free download for prepress testing, no redistribution of modified versions)"
tags = ["render", "cmyk", "huge"]
notes = "Prepress files: CMYK, spot colours, transparency. Ghent PDF Output Suite 5.0 (144,934,235 bytes, application/zip). The live gwg.org download is email-gated and the original wp-content URL is dead; the Wayback Machine copy (snapshot 2019-05-22, `id_` raw-content endpoint) is the only stable direct-download endpoint. sha256 to be recorded on first fetch (the harness prints it)."

[[corpus]]
id = "pdfassoc"
name = "PDF Association test suite"
source_url = "https://github.com/pdf-association/pdf20examples/archive/refs/heads/master.tar.gz"
sha256 = "a10f104a51f07dec4c6453b03aba8b746dfd300980758b50c2b6a93fee8df935"
licence = "CC-BY-SA-4.0"
tags = ["smoke", "render", "text"]
notes = "pdf-association/pdf20examples: the PDF Association's official PDF 2.0 example files (UTF-8 strings, incremental save, offset start, black point compensation, page-level output intents, calibrated RGB). Spec-driven, small (7 PDFs, tarball ~22 KiB). The PDF Association's broader test suites are member-gated; this repo is their public, freely-licensed offering."

[[corpus]]
id = "govdocs1"
name = "govdocs1 sample (fuzz seeds)"
source_url = "https://digitalcorpora.s3.amazonaws.com/corpora/files/govdocs1/zipfiles/000.zip"
sha256 = "7fb4673ac1905a3ed16a9c5780a70c729c3abc575b06c155b7042b91fa5946aa"
licence = "Public domain (US federal works); fetch-only"
tags = ["fuzz", "huge"]
notes = "Fuzzing seed corpus; sample only, never the full set. Exact S3 key layout confirmed via the ListObjectsV2 API on the s3://digitalcorpora bucket: numbered zips live under corpora/files/govdocs1/zipfiles/ (000.zip .. 999.zip, each 180-490 MB). The gateway mirror downloads.digitalcorpora.org/corpora/files/govdocs1/zipfiles/000.zip also answers 200. Thread 000 is 486,762,106 bytes of mixed-type files - extract only *.pdf. Site terms: CC0 for Digital Corpora's own material; the documents themselves are US-government public domain."
