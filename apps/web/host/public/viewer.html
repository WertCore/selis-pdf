<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f2f4f7" />
		<meta
			name="description"
			content="Read PDFs privately in your browser. Your document is opened on your own device and never uploaded — no account, no limits."
		/>
		<title>Selis PDF Viewer — read PDFs privately, no upload</title>
		<link rel="canonical" href="https://pdf.selis.com/viewer.html" />
		<!--
			SL-4.WEB.01 static shell for the document viewer, reached from the tools
			grid's "Open a PDF to read" action. The React viewer app (boot.js) mounts
			into #selis-app; style.css is its design system, assembled by place-assets
			from @selis/ui-kit (tokens + base) + the app's own CSS + the viewer-shell
			header/footer — one design system, so the page frame and the app match.
			- CSP via response headers (src/headers.ts); every asset carries integrity
			  (sha384) + crossorigin, same-origin only (ADR-P0016). Recompute
			  style.css's digest when the ui-kit/app CSS changes (the build prints it);
			  boot.js's when the app bundle changes.
			- boot.js is a module; it imports /sw-register.js (offline worker,
			  SL-4.WEB.02). Threads need COOP/COEP; without them the engine uses the
			  identical single-threaded path.
		-->
		<link
			rel="stylesheet"
			href="/assets/style.css"
			integrity="sha384-fJ9XK/6aYKmCujaOyDDPDuvE7XCbNrw9jgNvMYz1eIlO3jCuS9YD3NJVJtnhYrn1"
			crossorigin="anonymous"
		/>
	</head>
	<body>
		<a class="skip-link" href="#selis-app">Skip to the document</a>
		<header class="selis-viewer-bar">
			<a class="selis-viewer-bar__brand" href="/" aria-label="Selis home">
				<span class="selis-viewer-bar__mark" aria-hidden="true">S</span>
				<span>Selis <span class="selis-viewer-bar__mute">Viewer</span></span>
			</a>
			<nav class="selis-viewer-bar__nav" aria-label="Primary">
				<button type="button" id="selis-open-file-button" class="selis-viewer-bar__open">
					Open a PDF
				</button>
				<input
					type="file"
					id="selis-open-file"
					accept="application/pdf,.pdf"
					hidden
				/>
				<div class="selis-viewer-bar__pager" id="selis-pager" hidden>
					<button
						type="button"
						id="selis-prev-page"
						class="selis-viewer-bar__page"
						aria-label="Previous page"
					>‹</button>
					<span id="selis-page-indicator" class="selis-viewer-bar__pageno">Page 1</span>
					<button
						type="button"
						id="selis-next-page"
						class="selis-viewer-bar__page"
						aria-label="Next page"
					>›</button>
				</div>
				<div class="selis-viewer-bar__zoom" id="selis-zoom" hidden>
					<button
						type="button"
						id="selis-zoom-out"
						class="selis-viewer-bar__page"
						aria-label="Zoom out"
					>−</button>
					<span id="selis-zoom-level" class="selis-viewer-bar__pageno">100%</span>
					<button
						type="button"
						id="selis-zoom-in"
						class="selis-viewer-bar__page"
						aria-label="Zoom in"
					>+</button>
				</div>
				<button
					type="button"
					id="selis-edit-toggle"
					class="selis-viewer-bar__edit"
					aria-pressed="false"
					hidden
				>Edit text</button>
				<a href="/">All tools</a>
				<span class="selis-viewer-bar__pill">No upload</span>
				<button
					type="button"
					id="selis-theme-toggle"
					class="selis-theme-toggle"
					title="Switch the theme"
					aria-label="Switch the theme"
				>
					<svg
						class="selis-theme-toggle__moon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
						focusable="false"
					>
						<path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2" />
					</svg>
					<svg
						class="selis-theme-toggle__sun"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
						focusable="false"
					>
						<path
							d="M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"
						/>
					</svg>
				</button>			</nav>
		</header>

		<!--
			The failure panel (SL-4.UI.08). A sibling of #selis-app, not a child,
			so it survives the mount replacing #selis-app's contents and is always
			present for `showFailure` to populate. Hidden by CSS while empty.
		-->
		<div
			id="selis-failure"
			class="selis-failure"
			role="alert"
			aria-live="assertive"
		></div>

		<main id="selis-app" aria-busy="true">
			<p class="selis-boot">Loading the private PDF viewer…</p>
			<noscript>
				<p>The Selis PDF Viewer needs JavaScript — it reads your document on
				this device, with no upload.</p>
			</noscript>
		</main>

		<footer class="selis-viewer-foot">
			<strong>Selis Viewer</strong> is part of the Selis PDF project.
			Local-only by construction — your document never leaves your machine.
			<a href="/">All tools</a>
		</footer>

		<script
			src="/assets/boot.js"
			integrity="sha384-yIJ9hSeHaI3CIbkDwyYJxiD8tO2moVnfy+9qFDO9r8bk0frqtHI/H2Agom8fUAmr"
			crossorigin="anonymous"
			defer
			type="module"
		></script>
	</body>
</html>
