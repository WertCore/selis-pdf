[package]
name = "selis-cli"
description = "The `selis` command-line interface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "selis"
path = "src/main.rs"

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-geom = { workspace = true }
selis-io = { workspace = true, features = ["native-io"] }
# The CLI is the L5 binding boundary: it supplies the real monotonic clock
# so `Budget::wall` is enforced on real parse paths (SL-0.SBX.07).
selis-sandbox = { workspace = true, features = ["instant-clock"] }
selis-log = { workspace = true }
selis-crypto = { workspace = true, features = ["rng"] }
selis-pdf-cos = { workspace = true, features = ["rng"] }
selis-pdf-doc = { workspace = true }
selis-pdf-tools = { workspace = true, features = ["native-fs", "security", "sign", "sign-logo", "text"] }
selis-pdf-edit = { workspace = true }
# SL-5.SIGN.04: the pure DSS embedder lives in the engine; the consent-gated
# network fetch lives ONLY here in the native binding layer. The engine never
# links a socket. sha2 hashes the signature before an explicit opt-in.
selis-pdf-sign = { workspace = true }
sha2 = { workspace = true }
selis-pdf-filter = { workspace = true }
selis-pdf-content = { workspace = true }
# Desktop target: ship the full twelve-face Liberation fallback set, so a
# document naming Helvetica with no embedded font renders offline and
# offline-only, with no lazy fetch. The web module leaves this OFF and
# keeps only the subsetted Serif faces (SL-3.FONT.12).
selis-pdf-engine = { workspace = true, features = ["builtin-fallback-fonts", "rng"] }
selis-pdf-text = { workspace = true }
selis-policy = { workspace = true }
# SL-5.JS.02: native form-script evaluation is consent-gated through the JS
# sandbox; the CLI is native-only, so rquickjs is linked here and never in WASM.
selis-pdf-js = { workspace = true }
selis-pdf-form = { workspace = true }
selis-job = { workspace = true }
selis-image = { workspace = true }
selis-pdf-convert = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
