[package]
name = "selis-cli"
description = "The `selis` command-line interface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "selis"
path = "src/main.rs"

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-geom = { workspace = true }
selis-io = { workspace = true, features = ["native-io"] }
selis-sandbox = { workspace = true }
selis-log = { workspace = true }
selis-crypto = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-pdf-doc = { workspace = true }
selis-pdf-edit = { workspace = true }
selis-pdf-filter = { workspace = true }
selis-pdf-content = { workspace = true }
selis-pdf-engine = { workspace = true }
selis-pdf-text = { workspace = true }
selis-policy = { workspace = true }
selis-job = { workspace = true }
selis-image = { workspace = true }
selis-pdf-convert = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Hash-pinning for the wild hang-regression fixtures (test-only; MIT/Apache,
# already in [workspace.dependencies]).
sha2 = { workspace = true }
