<!doctype html>
<html>
	<head><meta charset="utf-8" /><title>resource trace</title></head>
	<body>
		<pre id="verdict">PENDING</pre>
		<script type="module">
			// Import the app's real boot module exactly as the app-shell check
			// does, then report the browser's OWN resource log. `performance`
			// sees every request the page made, so a 404 or a truncated body is
			// visible here even though the import() error does not say so.
			const out = { schema: 1, ok: false, bootError: null, resources: [], tiny: [], failed: [] };

			try {
				await import("/assets/boot.js");
				out.bootOk = true;
				out.appState = globalThis.__selisApp ?? null;
			} catch (error) {
				out.bootOk = false;
				out.bootError = error instanceof Error ? error.message : String(error);
			}

			// Every resource the page fetched, in completion order.
			for (const entry of performance.getEntriesByType("resource")) {
				const row = {
					name: entry.name.replace(location.origin, ""),
					status: entry.responseStatus ?? null,
					size: entry.transferSize,
					decoded: entry.decodedBodySize,
					duration: Math.round(entry.duration),
				};
				out.resources.push(row);
				// A 200 with no body is the signature worth hunting: the server
				// responded but the module graph got nothing usable.
				if (row.status !== null && row.status !== 200) out.failed.push(row);
				if (row.status === 200 && row.decoded === 0) out.tiny.push(row);
			}
			out.ok = true;

			const body = JSON.stringify(out);
			document.getElementById("verdict").textContent =
				"@@SELIS-RESULT@@" + body + "@@SELIS-END@@";
			const xhr = new XMLHttpRequest();
			xhr.open("POST", "/__selis_result", true);
			xhr.send(body);
		</script>
	</body>
</html>
