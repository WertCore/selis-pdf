# cargo-fuzz workspace member — SL-0.SEC.02.
#
# One fuzz target per parser entry point, added as the entry points land
# (03-CONVENTIONS.md §6: "A new parser without a fuzz target does not merge").
# Every target constructs a Fuzz-budget and asserts: no panic, no OOM,
# terminates within the budget.

[package]
name = "selis-fuzz"
edition = "2021"
publish = false

# Standalone workspace root: the parent workspace excludes this directory,
# and a package without its own [workspace] table cannot be built locally.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
selis-sandbox = { path = "../crates/selis-sandbox" }
selis-pdf-cos = { path = "../crates/selis-pdf-cos" }
selis-pdf-filter = { path = "../crates/selis-pdf-filter" }
selis-bytes = { path = "../crates/selis-bytes" }
selis-font = { path = "../crates/selis-font" }
selis-shape = { path = "../crates/selis-shape" }
selis-pdf-wasm = { path = "../crates/selis-pdf-wasm" }

[[bin]]
name = "cos_parse"
path = "fuzz_targets/cos_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cos_lex"
path = "fuzz_targets/cos_lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_ttf"
path = "fuzz_targets/font_ttf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_cff"
path = "fuzz_targets/font_cff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_type1"
path = "fuzz_targets/font_type1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_cmap"
path = "fuzz_targets/font_cmap.rs"
test = false
