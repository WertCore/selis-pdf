# Selis — PDF platform workspace.
#
# `[workspace.dependencies]` is the ONLY place a dependency version appears
# (03-CONVENTIONS.md §1, ADR-P0002).
[workspace]
resolver = "2"
members = ["crates/*", "apps/cli", "xtask", "bench"]
exclude = ["fuzz"]

[workspace.package]
edition      = "2021"
rust-version = "1.85"
license      = "LicenseRef-Selis-Proprietary"
authors      = ["Selis"]
repository   = "https://github.com/selis/selis"
version      = "0.1.0"

# ---------------------------------------------------------------------------
# Dependencies. Versions live here and nowhere else.
# ADR-P0021: MIT / Apache-2.0 / BSD-2 / BSD-3 / ISC / Zlib / Unicode-3.0 only.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# L0/L1
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# Filters (ADR-P0018)
miniz_oxide = "0.8"
zune-jpeg   = "0.4"

# Rasterisation threads (ADR-P0004, SL-4.WASM.03) — the tile executor only.
# rayon's *global* pool is used, never a locally built one: `ThreadPoolBuilder`
# reports `Unsupported` on `wasm32-unknown-unknown` (no OS thread to spawn), and
# with no pool installed rayon-core's documented "Global fallback when
# threading is unsupported" runs `par_iter` sequentially — the same bytes, no
# threads. That is what makes one artifact serve the COOP/COEP path and the
# extension path (see `selis-raster::tile::Parallelism`).
rayon       = "1"

# Fonts (Phase 3) — skrifa (MIT OR Apache-2.0, Google Fonts, actively
# maintained) is the font table/metadata parser for embedded TrueType/OpenType.
# The plan's original choice, ttf-parser, was declared unmaintained
# (RUSTSEC-2026-0192) — denied by the supply-chain gate (ADR-P0021); skrifa is
# its maintained successor ecosystem.
skrifa = "0.47"

# Shaping (Phase 3, SL-3.SHAPE.01) — swash (MIT OR Apache-2.0, the fontations
# shaping engine) is the maintained replacement for the plan's original
# rustybuzz (declared unmaintained — RUSTSEC-2026-0206, denied by the
# supply-chain gate).  unicode-script (MIT OR Apache-2.0) drives script
# itemisation. Both stay behind the selis-shape Shapertrait so the replay
# path never depends on them.
swash = "0.2"
unicode-script = "0.5"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-normalization = "0.1"

# Crypto (ADR-P0019) — RustCrypto, all MIT OR Apache-2.0
aes         = "0.8"
cbc         = { version = "0.1", features = ["alloc"] }
getrandom   = "0.2"
md-5        = "0.10"
sha1        = { version = "0.10", features = ["oid"] }
sha2        = { version = "0.10", features = ["oid"] }

# Public-key security handler (SL-1.ENC.03, ADR-P0021): both crates are
# RustCrypto (MIT OR Apache-2.0), pure Rust (wasm32-safe, ADR-P0011), no_std
# with alloc, actively maintained by the same org as the crates above, MSRV
# well under the workspace 1.85. `rsa` 0.9 is the only credible pure-Rust RSA
# implementation (dependency cost of hand-rolling RSA: unjustifiable); `p256`
# covers the EC-P256 ECDH key-agreement path of the CMS subset. Known residual:
# RUSTSEC-2023-0071 (Marvin-style timing side channel in RSA decryption) is an
# accepted, documented risk for local decryption of the user's own document —
# see pdf-plan/31-ENC03-DESIGN-NOTE.md §6 (human sign-off item).
rsa  = { version = "0.9", default-features = false, features = ["pem", "u64_digit"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "pem"] }

# SL-5.SIGN.06 key sources (PKCS#12 / PFX). `p12-keystore` 0.4.1 is
# MIT OR Apache-2.0, pure Rust, MSRV 1.85 (matches the workspace), and
# maintained (releases through 2026). Its default `pbes1` feature brings
# `rc2` (MIT), `des` and `cbc` so legacy RC2/3DES protected .p12 files open as
# well as modern PBES2/AES-256 ones; there is no network or C ABI. We convert
# the parsed PKCS#8 key / X.509 certs to the PEM path `sign_digital` already
# uses, so the signing engine itself is unchanged. EXACT pin, crates.io only
# (ADR-P0021). Native-only: the dependency and its module are gated to
# `cfg(not(target_arch = "wasm32"))` so no WASM chunk grows (ADR-P0011).
p12-keystore = { version = "=0.4.1" }

# CLI
clap        = { version = "4", features = ["derive"] }

# Tier-2 WASM codec sandbox (01-ARCHITECTURE.md §4, SL-0.SBX.06).
# wasmtime (Apache-2.0 WITH LLVM-exception, Bytecode Alliance, crates.io-only)
# is the native embedding that executes untrusted codec modules (OpenJPEG
# Phase 2, Tesseract Phase 5) under a hard linear-memory cap, zero host
# imports, and a fuel meter wired to Budget/CancelToken. Browser shells never
# compile it: the `wasm-host` cargo feature is `wasm32`-excluded and the web
# path uses the browser's own engine behind the same `wasm` protocol module.
# Maintenance: Bytecode Alliance is a foundation-backed upstream with a
# security-response process and monthly releases; cargo-vet imports its
# audits (supply-chain/config.toml [imports.bytecodealliance]).
wasmtime = { version = "48.0.3", default-features = false, features = ["cranelift", "runtime", "wat"] }

# Budgeted form-script interpreter (SL-5.JS.01/02/03, ADR-P0020). rquickjs
# 0.11.0 is MIT and wraps QuickJS (MIT): both permissive and actively
# maintained (DelSkayn, releases through 2026), a small (~200 KB of C) deterministic
# engine with a safe Rust binding. Crucially the DEFAULT feature set has no
# module loader, no dynamic native modules, no threads, no clock, no filesystem
# and no network — there is no host capability to reach, so the Acrobat subset
# we install is the entire surface (ADR-P0020). 0.11.0 is the last release whose
# rust-version is 1.85 (0.13/0.14 require 1.87), matching the workspace MSRV.
# EXACT pin, crates.io only (ADR-P0021). `loader`, `dyn-load`, `futures` and
# `parallel` are deliberately NOT enabled. wasm32-unknown-unknown has no
# pre-generated QuickJS bindings in this release: it needs `bindgen` + libclang
# + a wasm-targeting C toolchain, none available here — selis-pdf-js is therefore
# a documented NATIVE-ONLY slice (see its README), not a claimed wasm sandbox.
rquickjs = { version = "=0.11.0" }

# Test-only
proptest    = "1"

# Internal crates — L0
selis-error   = { path = "crates/selis-error", version = "0.1.0" }
selis-bytes   = { path = "crates/selis-bytes", version = "0.1.0" }
selis-archive = { path = "crates/selis-archive", version = "0.1.0" }
selis-geom    = { path = "crates/selis-geom", version = "0.1.0" }
selis-color   = { path = "crates/selis-color", version = "0.1.0" }
selis-log     = { path = "crates/selis-log", version = "0.1.0" }
# L1
selis-io      = { path = "crates/selis-io", version = "0.1.0" }
selis-sandbox = { path = "crates/selis-sandbox", version = "0.1.0" }
selis-crypto  = { path = "crates/selis-crypto", version = "0.1.0", default-features = false }
# L2
selis-pdf-cos      = { path = "crates/selis-pdf-cos", version = "0.1.0", default-features = false }
selis-pdf-filter   = { path = "crates/selis-pdf-filter", version = "0.1.0" }
selis-pdf-form     = { path = "crates/selis-pdf-form", version = "0.1.0" }
# Native-only consent-gated form-script interpreter (SL-5.JS.02); gated off on
# wasm32 by the crate itself, so no WASM chunk links QuickJS.
selis-pdf-js       = { path = "crates/selis-pdf-js", version = "0.1.0" }
selis-pdf-doc      = { path = "crates/selis-pdf-doc", version = "0.1.0" }
selis-pdf-content  = { path = "crates/selis-pdf-content", version = "0.1.0" }
selis-pdf-text     = { path = "crates/selis-pdf-text", version = "0.1.0" }
selis-pdf-edit     = { path = "crates/selis-pdf-edit", version = "0.1.0" }
selis-pdf-optimize = { path = "crates/selis-pdf-optimize", version = "0.1.0" }
selis-image        = { path = "crates/selis-image", version = "0.1.0" }
selis-raster       = { path = "crates/selis-raster", version = "0.1.0" }
selis-font         = { path = "crates/selis-font", version = "0.1.0" }
selis-shape        = { path = "crates/selis-shape", version = "0.1.0" }
# L3
# `rng` (encryption) is off by default here so a render-only chunk can opt out;
# the viewer and the CLI turn it back on explicitly.
selis-pdf-engine = { path = "crates/selis-pdf-engine", version = "0.1.0", default-features = false }
selis-policy     = { path = "crates/selis-policy", version = "0.1.0" }
selis-job        = { path = "crates/selis-job", version = "0.1.0" }
# Default features are off for *workspace dependents* so the wasm convert chunk
# does not link the bundled Liberation TTFs. Building the crate itself (its
# native tests) or using its published manifest still enables `embed-fonts`
# through the crate's own [features] default.
selis-pdf-convert = { path = "crates/selis-pdf-convert", version = "0.1.0", default-features = false }
selis-pdf-tools   = { path = "crates/selis-pdf-tools", version = "0.1.0", default-features = false }
selis-pdf-sign    = { path = "crates/selis-pdf-sign", version = "0.1.0" }
selis-pdf-annot   = { path = "crates/selis-pdf-annot", version = "0.1.0" }
selis-pdf-wasm-tools = { path = "crates/selis-pdf-wasm-tools", version = "0.1.0" }

# ---------------------------------------------------------------------------
# Lints — 03-CONVENTIONS.md §1. The hostile-input set.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code               = "warn"
missing_docs              = "deny"
unreachable_pub           = "deny"
elided_lifetimes_in_paths = "deny"

[workspace.lints.clippy]
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
indexing_slicing         = "deny"
arithmetic_side_effects  = "deny"
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
integer_division         = "deny"
unwrap_in_result         = "deny"
large_stack_arrays       = "deny"
recursive_format_impl    = "deny"
mem_forget               = "deny"
todo                     = "deny"
unimplemented            = "deny"
missing_panics_doc       = "deny"

[profile.release]
panic = "unwind" # SL-0.ERR.03: the trampoline needs unwinding.
lto   = "thin"

[profile.bench]
lto = "thin"



