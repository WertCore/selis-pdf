[package]
name = "selis-pdf-cos"
description = "The COS object layer of the Selis PDF engine: lexer, object model, xref, revisions. Apache-2.0 (ADR-P0030)."
edition.workspace = true
rust-version.workspace = true
# ADR-P0030: the parser crates publish under Apache-2.0; the rest of the
# workspace stays proprietary (LicenseRef-Selis-Proprietary).
license = "Apache-2.0"
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["rng"]
# Drawing entropy needs a CSPRNG. Parsing, verification, the browser tools and
# the browser security chunk all run without it: the security chunk takes its
# key material from the page (`R6Material::from_bytes`) rather than asking the
# guest to invent it.
rng = ["selis-crypto/rng"]

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-sandbox = { workspace = true }
selis-io = { workspace = true }
selis-crypto = { workspace = true, default-features = false }
selis-pdf-filter = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
miniz_oxide = { workspace = true }
selis-pdf-filter = { workspace = true }
