[package]
name = "selis-pdf-edit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Forwarded to the COS and document layers; see `selis-pdf-doc`.
rng = ["selis-pdf-cos/rng", "selis-pdf-doc/rng"]

[dependencies]
selis-font = { workspace = true }
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-sandbox = { workspace = true }
selis-geom = { workspace = true }
selis-io = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-pdf-doc = { workspace = true }
# SL-5.EDIT.07: the real signature report is the read-back oracle for the
# signature-preservation verification gate in `signature_guard`. The dependency
# points one way (sign does not depend on edit), so there is no normal-build
# cycle.
selis-pdf-sign = { workspace = true }
selis-pdf-filter = { workspace = true }
selis-log = { workspace = true }
md-5 = { workspace = true }

[dev-dependencies]
# Read-back verification for the full-rewrite writer (EDIT.05): open the
# rewritten bytes with the real engine in tests. A dev-dependency cycle with
# selis-pdf-engine is intentional and permitted by Cargo.
selis-pdf-engine = { workspace = true }
