# The error-code registry — 03-CONVENTIONS.md §3, SL-0.ERR.01.
#
# NEVER reuse a number. NEVER change a `meaning`. `xtask check-codes` enforces
# both, plus "used in source but absent here".
#
# `doc_state` answers, for every error: *what happened to the user's document?*
#   NotLoaded | Loaded | PartiallyLoaded | Unchanged | Modified
#
# Ranges:
#   1000–1499 COS / structure / xref      1500–1799 Filters and codecs
#   1800–1999 Encryption and permissions  2000–2299 Fonts and text
#   2300–2599 Content and rendering       2600–2799 Annotations and forms
#   2800–2999 Edit and save               3000–3199 Redaction
#   3200–3399 Signatures and PKI          3400–3599 OCR and conversion
#   3600–3799 Accessibility/conformance   4000–4299 Budget / sandbox
#   4300–4499 Policy / entitlement        5000–5299 I/O and sources
#   6000–6299 Bindings                    7000–7299 Service tier

