[package]
name = "selis-pdf-wasm"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The wasmtime-driven harnesses (`xtask perf-wasm`, `xtask wasm-protocol`)
# load this artifact's `.wasm` directly; browsers use the same exports
# through the wasm shell (SL-4.WASM.01+). The `rlib` exists for the
# conformance tooling that links the protocol schema natively (the fuzz
# target, ADR-P0042); browsers still load only the cdylib.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
selis-bytes = { workspace = true }
selis-error = { workspace = true }
selis-geom = { workspace = true }
# The lazy-CJK chunk loader (SL-4.WASM.07) drives the engine's resident set
# (`CjkFontSet`) directly, so the bindings layer names the font crate the same
# way it already names `selis-pdf-doc`'s navigation types. Strictly downward
# L4 -> L2, and the chunk table is the compatibility surface ADR-P0043 makes it.
selis-font = { workspace = true }
selis-io = { workspace = true }
selis-pdf-content = { workspace = true }
# The navigation wire shapes (SL-3.DOC-NAV) name `selis-pdf-doc`'s action and
# destination types directly rather than re-declaring them: a second
# declaration of "what is a /Launch" in the bindings layer is exactly the place
# the two would drift, and the whole point of the ADR-P0020 split is that one
# vocabulary crosses the boundary. A strictly-downward L4 -> L2 edge, the same
# one `selis-pdf-text` already is.
selis-pdf-doc = { workspace = true }
selis-pdf-engine = { workspace = true }
selis-pdf-text = { workspace = true }
selis-sandbox = { workspace = true }
# SHA-256 for the CJK chunk cache-poisoning guard (SL-4.WASM.07). Already
# vendored via selis-crypto and used by the L1 crypto crate, so this adds no
# supply-chain surface - the same reasoning xtask's dependency on it records.
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
