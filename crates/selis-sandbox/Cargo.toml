[package]
name = "selis-sandbox"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
selis-error = { workspace = true }
# Native Tier-2 codec-sandbox runtime. Gated: not compiled for the browser
# targets, where the host delegates to the browser's own WASM engine (the
# `wasm` module is the runtime-independent contract both paths implement).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true, optional = true }

[features]
default = []
# The native wasmtime embedding (SL-0.SBX.06). Off by default so pure-kernel
# consumers (and the wasm32 build) never link Cranelift.
wasm-host = ["dep:wasmtime"]
# The `std::time::Instant`-backed clock adapter (SL-0.SBX.07). A platform
# capability for L4/L5 shells: only binding/app crates enable this, and no
# crate below L4 may construct `InstantClock` (they take `&dyn Clock` from
# their caller). Compiled out for wasm32 (ADR-P0011).
instant-clock = []

[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }
