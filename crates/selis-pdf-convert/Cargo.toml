[package]
name = "selis-pdf-convert"
description = "The Selis conversion crate: Markdown/HTML subsets to PDF via the writer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-sandbox = { workspace = true }
# No `rng`: this crate parses and emits only. Encryption lives behind
# `selis-pdf-cos/rng`, and enabling it drags `getrandom`'s wasm-bindgen shims
# into the convert chunk, which then cannot instantiate in a browser.
selis-pdf-cos = { workspace = true, default-features = false }
selis-font = { workspace = true }
