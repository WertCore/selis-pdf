[package]
name = "selis-pdf-convert"
description = "The Selis conversion crate: Markdown/HTML subsets to PDF via the writer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-archive = { workspace = true }
selis-sandbox = { workspace = true }
# No `rng`: this crate parses and emits only. Encryption lives behind
# `selis-pdf-cos/rng`, and enabling it drags `getrandom`'s wasm-bindgen shims
# into the convert chunk, which then cannot instantiate in a browser.
selis-pdf-cos = { workspace = true, default-features = false }
selis-font = { workspace = true }
# PNG data URIs: decode the IDAT (zlib + PNG filters) with the engine's image
# reader, then Flate-encode the raw samples for the image XObject. Flate is
# already linked here through selis-pdf-cos -> selis-pdf-filter; selis-image is
# the only new dependency on the conversion path.
selis-image = { workspace = true }
selis-pdf-filter = { workspace = true }

[dev-dependencies]
# Read-back/render verification: generate a real JPEG fixture, re-open the
# converted bytes in the engine and rasterize the page to check image ink.
selis-pdf-engine = { workspace = true }
# The render-parity test compares embedded Liberation Sans against the
# standard-14 substitute, so the test build must actually ship that substitute
# (feature-off builds only carry the Serif subset and paint no Helvetica ink).
selis-font = { workspace = true, features = ["builtin-fallback-fonts"] }

[features]
# Compile in the bundled Liberation TTF programs so `Options::embed_font` can
# emit real /FontFile2 subsets. Native builds want this; the wasm convert chunk
# opts out (`default-features = false`) because its C ABI exposes no font choice
# and its linked size is budget-gated.
default = ["embed-fonts"]
embed-fonts = []
