[package]
name = "selis-pdf-wasm-content"
description = "Lazy WASM chunk: first-class add-content and object-edit ops for the browser editor (SL-5.TEXTEDIT.05/06/07/08). Separate from the tools chunk so the font/image code it links does not inflate the all-purpose tools download."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# No `native-fs`: every path is a key in the in-memory tool session. The
# engine crates never see a filesystem or a network.
selis-pdf-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
