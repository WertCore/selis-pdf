[package]
name = "selis-pdf-form"
description = "The AcroForm field model of the Selis PDF engine (SL-5.FORM.01): read the field tree, validate fills, rewrite the bytes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
selis-bytes = { workspace = true }
selis-sandbox = { workspace = true }
selis-font = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-pdf-filter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Read-back evidence for FORM.02: sign a document with the committed PEM
# fixtures, regenerate appearances, and prove the signature still verifies over
# the preserved verbatim prefix. Dev-only, so no WASM form chunk grows. The
# dependency points one way (sign does not depend on form); no normal-build cycle.
selis-pdf-sign = { workspace = true }
selis-crypto = { workspace = true }
