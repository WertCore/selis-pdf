[package]
name = "selis-pdf-optimize"
description = "Document optimisation passes shared by the CLI, desktop and browser tools: lossy image downsample/re-encode for the Compress tool's level/target tiers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Forwarded to the COS layer; the document and edit layers forward their own
# rng features directly from `selis-pdf-engine`.
rng = ["selis-pdf-cos/rng"]

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-sandbox = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-pdf-filter = { workspace = true }
selis-image = { workspace = true }