[package]
name = "selis-pdf-tools"
description = "Byte-oriented document tools shared by the CLI and the browser tools chunk."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["native-fs"]
# Native filesystem input/output plus the CLI's chunked, cancellable commit.
# The browser tools chunk disables default features and uses the in-memory
# store instead; nothing on that path names a filesystem.
native-fs = ["selis-sandbox/instant-clock", "selis-pdf-cos/rng"]
# The password and permission operations (unlock, protect, clear-permissions).
# Off by default: decrypting on the way out runs through the engine's resolver —
# the same path the viewer uses and the one the qpdf/PDFium/poppler evidence was
# measured against — and the WRITE.07 gate opens the output as a document
# model. Those two links are the whole weight of the security chunk, so the
# plain tools chunk must not carry them. Note it does NOT turn `rng` on: the
# caller injects the key material, so the guest still links no entropy source.
security = ["dep:selis-crypto", "dep:selis-pdf-doc", "dep:selis-pdf-engine"]

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-io = { workspace = true }
selis-sandbox = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-pdf-filter = { workspace = true }
selis-pdf-form = { workspace = true }
selis-image = { workspace = true }
selis-font = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
selis-crypto = { workspace = true, optional = true }
selis-pdf-doc = { workspace = true, optional = true }
selis-pdf-engine = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
