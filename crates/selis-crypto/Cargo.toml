[package]
name = "selis-crypto"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes = { workspace = true }
getrandom = { workspace = true }
md-5 = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
selis-error = { workspace = true }
selis-sandbox = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# wasm32-unknown-unknown has no OS entropy source; getrandom's `js` feature
# routes to crypto.getRandomValues via wasm-bindgen so the web shell keeps a
# real CSPRNG (ADR-P0011). Other targets use the OS source unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
