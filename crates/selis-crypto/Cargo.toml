[package]
name = "selis-crypto"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["rng"]
# Native and viewer builds use the OS/browser CSPRNG. The browser tools chunk
# disables this feature because its six operations never encrypt; that keeps
# `getrandom`'s wasm-bindgen JS glue out of the lazy tools artifact.
rng = ["dep:getrandom"]

[dependencies]
aes = { workspace = true }
md-5 = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
selis-error = { workspace = true }
selis-sandbox = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# wasm32-unknown-unknown has no OS entropy source; with `rng` enabled,
# getrandom's `js` feature routes to crypto.getRandomValues via wasm-bindgen
# so the web shell keeps a real CSPRNG (ADR-P0011). The tools chunk leaves
# `rng` off and never links this path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, optional = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true, optional = true }

[dev-dependencies]
# The PKCS#7 fixtures use `rsa::rand_core::OsRng`; the library's own `rng`
# feature is separate from that test-only re-export.
rsa = { workspace = true, features = ["getrandom"] }
