[package]
name = "selis-crypto"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["rng"]
# Native and viewer builds use the OS CSPRNG. The browser chunks disable this
# feature: wasm32 has no OS entropy source, and the lazy chunks are built with a
# closed set of JS imports so a link-time surprise cannot ship as a runtime
# crash. Instead the page injects the 64 bytes of key material
# (`R6Material::from_bytes`) and every other random-looking field is derived from
# the file key, which keeps `getrandom`'s wasm-bindgen glue out of the artifacts.
rng = ["dep:getrandom"]

[dependencies]
aes = { workspace = true }
md-5 = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
selis-error = { workspace = true }
selis-sandbox = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# wasm32-unknown-unknown has no OS entropy source; with `rng` enabled,
# getrandom's `js` feature routes to crypto.getRandomValues via wasm-bindgen
# so the web shell keeps a real CSPRNG (ADR-P0011). The tools chunk leaves
# `rng` off and never links this path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, optional = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true, optional = true }

[dev-dependencies]
# The PKCS#7 fixtures use `rsa::rand_core::OsRng`; the library's own `rng`
# feature is separate from that test-only re-export.
rsa = { workspace = true, features = ["getrandom"] }
