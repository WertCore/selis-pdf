[package]
name = "selis-pdf-wasm-convert"
description = "WASM lazy chunk: PDF→Office/HTML conversion (SL-4.WASM.02). Separate module, lazy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-sandbox = { workspace = true }
# The convert C ABI has no font-choice parameter and the chunk is size-gated;
# keep the bundled Liberation TTFs out of this build. Embedding requested via
# the Rust `Options` here fails loudly (ConvertUnsupported) rather than growing
# the linked module.
selis-pdf-convert = { workspace = true, default-features = false }
selis-pdf-cos = { workspace = true }
