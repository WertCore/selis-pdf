[package]
name = "selis-pdf-engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Tier-2 WASM codec sandbox passthrough (SL-1.FILT.08): enables the JPXDecode
# path in the render pipeline; a default build surfaces JPX as a typed
# deviation instead.
wasm-host = ["selis-pdf-filter/wasm-host"]

# Fallback-font delivery, forwarded so a downstream target can choose it
# without depending on selis-font directly. Desktop (the CLI) turns this on to
# get all twelve Liberation faces built in and render fully offline; the web
# module leaves it off and ships only the subsetted Serif faces, fetching the
# rest at runtime (SL-3.FONT.12).
#
# It changes only which bytes are resident, never which face substitutes for a
# given name, so turning it on cannot alter layout.
builtin-fallback-fonts = ["selis-font/builtin-fallback-fonts"]

[dependencies]
selis-error = { workspace = true }
selis-bytes = { workspace = true }
selis-crypto = { workspace = true }
selis-geom = { workspace = true }
selis-sandbox = { workspace = true }
selis-io = { workspace = true }
selis-log = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-pdf-doc = { workspace = true }
selis-pdf-edit = { workspace = true }
selis-pdf-filter = { workspace = true }
selis-pdf-optimize = { workspace = true }
selis-image = { workspace = true }
selis-policy = { workspace = true }
selis-job = { workspace = true }
selis-pdf-content = { workspace = true }
selis-font = { workspace = true }
selis-raster = { workspace = true }
selis-color = { workspace = true }

[dev-dependencies]
miniz_oxide = { workspace = true }
# The tiled-render tests install a 4-lane pool to prove the threaded executor
# really runs on several lanes (SL-4.WASM.03).
rayon = { workspace = true }
