[package]
name = "selis-pdf-sign"
description = "PDF signatures of the Selis PDF engine (SL-5.SIGN.01): visual stamps, detached CMS signing, and signature reports that never over-claim."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
selis-bytes = { workspace = true }
selis-crypto = { workspace = true, default-features = false }
selis-error = { workspace = true }
selis-pdf-cos = { workspace = true }
selis-sandbox = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SL-5.SIGN.06: PKCS#12 key source. Native-only so no WASM chunk grows
# (ADR-P0011); `p12-keystore` 0.4.1 is MIT OR Apache-2.0, pure Rust, MSRV 1.85.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p12-keystore = { workspace = true }

[dev-dependencies]
# The identity/TSA tests generate a real RSA key locally from the OS CSPRNG.
# This only enables a feature on the already-pinned `rsa`/`rand_core` packages.
rsa = { workspace = true, features = ["getrandom"] }
sha2 = { workspace = true }
# SL-5.SIGN.07 render-parity evidence: the engine opens the signed bytes and
# compares RGBA before/after with the widget rectangle masked out. Dev-only —
# no WASM chunk grows, and the engine already depends on this crate transitively.
selis-pdf-engine = { workspace = true, default-features = false }
