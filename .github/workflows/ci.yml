# CI pipeline — 03-CONVENTIONS.md §9.
#
# Stage          | Runs on   | Gate
# fmt + lint     | every PR  | required
# build-matrix   | every PR  | required
# test-fast      | every PR  | required
# supply-chain   | every PR  | required
# size-check     | every PR  | required
# wasm-protocol  | every PR  | required (SL-4.WASM.01 conformance on wasmtime)
# wasm-threads   | every PR  | required (SL-4.WASM.03: the no-COOP/COEP extension path)
# wasm-browser   | every PR  | required (SL-4.WASM.08: the corpus rendered in a real
#                |          | headless browser, hash-matched against the native render)
# browser-check  | every PR  | reported (WEB.02: the real-browser harness — the
#                |          | service-worker lifecycle in a real engine. Skips,
#                |          | loudly, where no engine is installed)
# determinism    | every PR  | required (job pending)
# write05-oracle | every PR  | required (qpdf --check on 100% of tool outputs)
# write06-kill   | every PR  | required (crash-atomicity, 500 points x 3 ops)
# write07        | every PR  | required (conformance posture over the smoke corpus)
# render-conf    | nightly (cron) + workflow_dispatch | non-blocking (SL-2.CONF.01
#                | differential render sweep: selis vs pinned PDFium + pdf.js
#                | containers at 72/150/300 DPI, plus the SL-2.CONF.03
#                | oracle-vs-oracle calibration legs; artifacts for triage)
# test-slow      | nightly   | required for release (job pending)
# fuzz-soak      | nightly + dispatch | non-blocking
# perf           | nightly + dispatch | blocks release on >5% regression

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every 2 days at 03:00 UTC. GitHub cron steps by day-of-month, so the
    # gap at a month boundary is 1 day instead of 2; there is no true
    # "every 48 hours" cron. Nightly-gated jobs (fuzz-soak, perf) run on
    # this schedule; scheduled runs always use main.
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    # On-demand campaign legs (SL-1.ROB.02): the cron default keeps the
    # 10-minute per-target soak, a dispatched run scales it, e.g.
    #   gh workflow run ci.yml -f fuzz_minutes=120
    inputs:
      fuzz_minutes:
        description: 'fuzz-soak: minutes per target (cron default: 10)'
        required: false
        default: '10'
      run_perf:
        description: 'Also run the perf job'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── fmt + lint + gates ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: true
          # The lint policy is the workspace deny list (Cargo.toml
          # [workspace.lints]) enforced by `cargo xtask lint`; the toolchain
          # action's default RUSTFLAGS="-D warnings" would also promote every
          # warn-level clippy lint (e.g. too_many_arguments on the /Encrypt
          # dict API) above the documented policy.
          rustflags: ""
      # `cargo xtask lint` also runs `cargo deny check` + `cargo vet` (SL-0.WS.07).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-vet
      - run: cargo xtask lint
      # CI lesson: every cfg branch must be lint-clean in BOTH branches, but
      # `xtask lint` clippies the default feature set only — the Tier-2 codec
      # path (SL-0.SBX.06 host, SL-1.FILT.08 jpx driver) exists only under
      # `wasm-host`. Without this leg a deny-level violation in that cfg
      # branch (`indexing_slicing` on module-payload parsing is the classic)
      # hides from the gate in dead-feature code. Same policy as `xtask lint`:
      # the workspace `[lints]` deny list, not `-D warnings`.
      - run: cargo clippy -p selis-sandbox -p selis-pdf-filter --features wasm-host --all-targets
      # SL-4.SHIP.01, named as its own step so a failure says which policy
      # broke rather than surfacing as a generic `xtask lint` failure. It also
      # runs inside `xtask lint`; the duplicate is deliberate — a privacy gate
      # that only fails as part of a six-gate run is a gate nobody notices.
      - name: Crash-report hygiene (ADR-P0017)
        run: cargo xtask check-crash-hygiene

  # ── build matrix (6 targets, 03-CONVENTIONS.md §9) ──────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, allow_fail: false }
          - { target: wasm32-unknown-unknown, allow_fail: false }
          - { target: aarch64-apple-darwin, allow_fail: true }
          - { target: x86_64-pc-windows-msvc, allow_fail: true }
          - { target: aarch64-apple-ios, allow_fail: true }
          - { target: aarch64-linux-android, allow_fail: true }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true
      - run: cargo build --workspace --target ${{ matrix.target }}
        timeout-minutes: 15
        continue-on-error: ${{ matrix.allow_fail }}

  # ── supply chain: deny + vet + SBOM (SL-0.WS.07) ───────────────────────────
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo install cargo-vet --locked
      - run: cargo deny check
      - run: cargo vet --locked
      - run: cargo xtask sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/sbom.json

  # ── unit + property tests ──────────────────────────────────────────────────
  test-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - run: cargo test --workspace
        timeout-minutes: 10
      # The web feature configuration, which `--workspace` cannot reach.
      #
      # `apps/cli` requests `selis-pdf-engine/builtin-fallback-fonts` to keep
      # the full twelve-face Liberation set built in for desktop. Cargo
      # unifies features across a whole build, so in `cargo test --workspace`
      # *every* test binary - including the engine's own - links all twelve
      # faces. The web configuration, where only the subsetted Serif faces are
      # embedded and the rest are fetched, is therefore never exercised there.
      #
      # That configuration is not a duplicate run: the tests gated on
      # `not(feature = "builtin-fallback-fonts")` exist only in it, and they
      # are the ones that prove a document naming a non-resident standard-14
      # font reports it as missing rather than silently rendering blank. Run
      # this leg and the coverage disappears; delete it and the workspace run
      # stays green while nothing is left testing the delivery seam. See
      # `crates/selis-pdf-engine/tests/fallback_lazy.rs`.
      - run: cargo test -p selis-pdf-engine
        timeout-minutes: 10
      # The Tier-2 codec sandbox (SL-0.SBX.06) is feature-gated
      # (`wasm-host`), so --workspace alone never compiles the wasmtime
      # embedding or its hostile-module containment tests. The feature is
      # target-excluded on wasm32, so this job stays native-only.
      - run: cargo test -p selis-sandbox --features wasm-host
        timeout-minutes: 15
      # SL-1.FILT.08: the JPXDecode sandbox path (drives the pinned OpenJPEG
      # module behind Budget/fuel, malformed-JPX corpus contained). Same
      # feature gate — the browser runs the module on its own engine — and
      # the suite JIT-compiles the 233 KB module per case, so it gets the
      # same native-only leg as the host's own containment tests.
      - run: cargo test -p selis-pdf-filter --features wasm-host
        timeout-minutes: 15

  # ── WRITE.07 conformance-posture gate over the fetched smoke corpus ───────
  write07:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Fetch and extract the smoke corpus
        run: |
          cargo xtask corpus fetch --tag smoke
          mkdir -p corpus/pdfs
          tar -xzf ~/.cache/selis-corpus/pdfjs.gz -C corpus/pdfs \
            --wildcards "pdf.js-*/test/pdfs/*.pdf" --strip-components=3
          tar -xzf ~/.cache/selis-corpus/pdfassoc.gz -C corpus/pdfs \
            --wildcards "pdf20examples-master/*.pdf" --strip-components=1
          n=$(find corpus/pdfs -maxdepth 1 -name '*.pdf' | wc -l)
          echo "smoke corpus: $n files"
          test "$n" -gt 100
      - run: cargo test -p selis-cli --bin selis tool_conformance
        timeout-minutes: 15

  # ── WASM size budgets + 2% regression rule (SL-0.WS.09) ────────────────────
  size-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-opt (binaryen, via npm)
        run: npm install -g wasm-opt
      - run: cargo xtask size-check
        timeout-minutes: 15

  # ── SL-4.WASM.01: the Worker-protocol conformance harness ────────────────
  # Builds the selis-pdf-wasm guest for wasm32 and drives the wire format as
  # a black box over wasmtime: every message round-trips, guest == native
  # render checksums, budget exhaustion and cancellation cross the boundary
  # as typed codes, malformed messages are contained. (The Vitest/worker leg
  # of the DoD lands with the JS shell, SL-4.UI.01.)
  wasm-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true
      - run: cargo xtask wasm-protocol
        timeout-minutes: 20

  # SL-4.WASM.03 (DoD, clause 2): the extension path — the one with no
  # COOP/COEP, hence no SharedArrayBuffer, hence no wasm threads — is exercised
  # in CI. The guest is built for wasm32 (where rayon's ThreadPoolBuilder is
  # Unsupported and par_iter falls back to the sequential global path, so the
  # single artifact serves both paths per ADR-P0004) and the corpus identity
  # assertions run on that target: tiled == untiled, and the two executors are
  # byte-identical. This job is the no-threads leg; `wasm-protocol` above is the
  # wire leg. The browser-side COOP/COEP host leg is SL-4.UI.01's Vitest scope.
  wasm-threads:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true
      # The fallback must be a policy choice, not a link error: if the raster
      # path needed a real OS thread to compile for wasm32, this step fails.
      - run: cargo build -p selis-raster -p selis-pdf-engine --target wasm32-unknown-unknown
      # The corpus identity assertions (tiled == untiled, executors
      # hash-equal) run natively; the wasm32 build above is what proves the
      # no-threads target compiles the same source.
      - run: cargo test -p selis-pdf-engine -p selis-raster tiled
        timeout-minutes: 20

  # ── SL-4.WASM.08 (DoD): headless-browser render hash-matches native ──────
  # The corpus is rendered by a *real browser's* WebAssembly engine (V8 — an
  # independent code generator with its own Liftoff baseline and TurboFan
  # tiers, not wasmtime/Cranelift as in `perf-wasm` and `wasm-protocol`), over
  # the raw render ABI, and every page's RGBA8 pixmap must hash-match the
  # native render of the same document.
  #
  # The browser is an EXTERNAL TOOL, exactly as `qpdf` is in `write05-oracle`
  # below: nothing is added to Cargo.toml, package.json, or pnpm-lock.yaml, and
  # the ubuntu-24.04 image already ships Microsoft Edge, so this job downloads
  # nothing. The leg resolves the binary at runtime and FAILS if there is no
  # browser — it never skips, because a determinism gate that rendered nothing
  # would be green (SL-3.CONF.06).
  #
  # Engine: **Microsoft Edge**, a Chromium fork that runs the same V8 the web
  # app ships on. Chrome and distro `chromium` remain accepted alternates; the
  # claim under test is V8-determinism against the native engine, which holds
  # on any Chromium build.
  #
  # Licence: Chromium is BSD-3-Clause; the branded Edge build adds
  # proprietary media codecs, which this leg never touches (it decodes no
  # media — it hashes pixmaps). Pinning a browser *download* (a puppeteer /
  # playwright package, or a vendored Chrome-for-Testing tarball) would be a
  # supply-chain addition and is deliberately NOT done here; that proposal, and
  # its maintenance story, belongs to SL-0.SEC.02, not to this gate.
  wasm-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true
      - name: Name the engine under test
        run: |
          browser="$(command -v microsoft-edge || command -v microsoft-edge-stable || command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$browser" ]; then
            echo "no chromium-family browser on this runner — this gate cannot be skipped"
            exit 1
          fi
          echo "engine under test: $browser ($("$browser" --version))"
      - run: cargo xtask wasm-browser --out target/wasm-browser/report.json
        timeout-minutes: 25
      - name: Upload the per-page comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-browser-report
          path: target/wasm-browser/report.json
          if-no-files-found: error

  # ── WEB.02: the real-browser harness ────────────────────────────────────
  # Proves the *browser's* half of the offline story: that a real engine
  # delivers service-worker install/activate, hands the page a controller via
  # clients.claim(), and enforces respondWith. apps/web/host proves the policy
  # in Node against a Cache Storage double; nothing proved the browser.
  #
  # This job is allowed to be a no-op on a machine with no engine — that is
  # what the harness's skip is for, and it is recorded as "skipped": true in
  # the report rather than as a pass. `--strict` is deliberately NOT set here:
  # a self-hosted runner without Edge should not turn the whole pipeline red
  # over a DoD that is honestly still open.
  browser-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Name the engine under test
        run: |
          browser="$(command -v microsoft-edge || command -v chromium || command -v google-chrome || true)"
          if [ -n "$browser" ]; then
            echo "engine under test: $browser ($("$browser" --version))"
          else
            echo "no chromium-family browser on this runner - the harness will SKIP, and say so"
          fi
      - run: cargo xtask browser-check --out target/browser-check/report.json
        timeout-minutes: 10
      - name: Upload the per-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-report
          path: target/browser-check/report.json
          if-no-files-found: error

  # ── WRITE.05: qpdf --check over 100% of tool outputs (structural oracle) ───
  # Local qpdf on the runner (apt); the xtask oracle command falls back to the
  # pinned container when absent, so the job also validates the container path.
  write05-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Install qpdf (structural oracle, Apache-2.0)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Run the tool suite over the smoke fixtures
        # `xtask fixtures` builds the CLI itself (rust-cache restores
        # compilation artifacts but not reliably the final binary) and then
        # runs every Phase 1A write path over a formed fixture set.
        run: |
          mkdir -p target/tool-outputs
          cargo xtask fixtures --outdir target/tool-outputs
      - name: qpdf --check every tool output
        run: cargo xtask oracle check-output-dir target/tool-outputs
        timeout-minutes: 10

  # ── WRITE.06: crash-atomicity kill tests (500 points x 3 operations) ───────
  # The debug-only crash injection is a debug build; no release flag involved.
  write06-kill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Kill-test harness (500 points x split/rotate-incremental/compress)
        run: cargo test -p selis-cli --test write06_kill_test -- --ignored --test-threads 4
        timeout-minutes: 40

  # ── fuzz-soak (nightly + dispatch, non-blocking) — SL-0.SEC.02 / SL-1.ROB.02
  # One job per parser entry point (fuzz/Cargo.toml); a new fuzz target must
  # be added to the matrix in the same commit (03-CONVENTIONS.md §6). The cron
  # schedule keeps the 10-minute default; a dispatched leg scales it via the
  # fuzz_minutes input, e.g. `gh workflow run ci.yml -f fuzz_minutes=120`.
  fuzz-soak:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build]
    # Fixed ceiling (GH expressions have no arithmetic). Covers a dispatched
    # leg of ~300 fuzz-minutes plus install/build/coverage overhead; the cron
    # default (10 min/target) self-terminates in ~20 minutes regardless.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target:
          - cos_parse
          - cos_lex
          - doc_open
          - filter_chain
          - jpx_stream
          - pkcs7_cms
          - pkcs7_perms
          - x509_identity
          - wasm_dispatch
          - font_ttf
          - font_cff
          - font_cmap
          - font_type1
          - shaper
    env:
      FUZZ_MINUTES: ${{ inputs.fuzz_minutes || '10' }}
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: true
      - run: cargo install cargo-fuzz --locked
      - name: Seed the corpus from the committed seeds
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_TARGET"
          if [ -d "fuzz/seeds/$FUZZ_TARGET" ]; then
            cp -v fuzz/seeds/"$FUZZ_TARGET"/* "fuzz/corpus/$FUZZ_TARGET"/
          fi
      - name: Soak ${{ matrix.target }} for ${{ env.FUZZ_MINUTES }} minutes
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run "$FUZZ_TARGET" -- \
            -max_total_time=$(( FUZZ_MINUTES * 60 )) \
            -rss_limit_mb=4096 -timeout=60 -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          # cargo-fuzz's artifact_prefix is fuzz/artifacts/<target>/.
          path: |
            fuzz/artifacts/**
            fuzz/crash-*
            fuzz/oom-*
            fuzz/timeout-*
            fuzz/leak-*
          if-no-files-found: ignore
      - name: Coverage report over the accumulated corpus
        if: always()
        working-directory: fuzz
        run: |
          rustup component add llvm-tools-preview
          cargo +nightly fuzz coverage "$FUZZ_TARGET" "corpus/$FUZZ_TARGET"
          covdir="coverage/$FUZZ_TARGET"
          if [ ! -f "$covdir/lcov.info" ]; then
            bin="$(find target -type f -path '*coverage*' -name "$FUZZ_TARGET" | head -1)"
            # llvm-tools-preview installs llvm-cov under lib/rustlib/<host>/bin
            # on current nightlies, not under <sysroot>/bin (run 34474171477
            # died here with exit 127) — search the sysroot, then PATH.
            llvm_cov="$(find "$(rustc --print sysroot)" -type f -name llvm-cov | head -1)"
            if [ -z "$llvm_cov" ] && command -v llvm-cov >/dev/null 2>&1; then
              llvm_cov="$(command -v llvm-cov)"
            fi
            "$llvm_cov" export --format=lcov \
              --instr-profile "$covdir/coverage.profdata" "$bin" \
              > "$covdir/lcov.info"
          fi
          python3 - "$covdir/lcov.info" <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import sys
          lf = lh = 0
          for line in open(sys.argv[1]):
              if line.startswith("LF:"):
                  lf += int(line[3:])
              elif line.startswith("LH:"):
                  lh += int(line[3:])
          pct = 100.0 * lh / lf if lf else 0.0
          print(f"### {sys.argv[1].split('/')[1]} line coverage: {pct:.1f}% ({lh}/{lf})")
          EOF
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target }}
          path: fuzz/coverage/${{ matrix.target }}/
          if-no-files-found: ignore
      - name: Upload accumulated corpus (dispatched legs only)
        # always(): a failed coverage step must not skip corpus minting —
        # every pre-2026-09-11 leg lost its corpus this way.
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: ignore

  # ── perf budgets (nightly) — SL-0.PERF.02; blocks release on >5% regression
  # per 03-CONVENTIONS.md §9. The baseline is re-recorded on the runner first,
  # so the regression comparison is same-machine (a committed baseline from a
  # different machine cannot gate percentages).
  perf:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_perf)
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Log in to GHCR (pinned oracle images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Verify render benchmark fixtures (SL-2.PERF.02)
        run: cargo xtask render-set --check
        timeout-minutes: 10
      - name: Measure render throughput vs pinned PDFium (SL-2.PERF.02)
        # bench/render-results.json is what `perf-check` gates the ≥0.6×
        # ratio row on; regenerating it here (pinned driver, release engine)
        # makes the gate measure this runner, not a stale reference record.
        run: |
          IMG=$(cargo xtask oracle image-ref pdfium)
          docker pull "$IMG"
          CID=$(docker create "$IMG")
          docker cp "$CID:/usr/local/bin/pdfium_driver" ./pdfium_driver
          docker cp "$CID:/usr/local/lib/libpdfium.so" ./libpdfium.so
          docker rm "$CID"
          chmod +x ./pdfium_driver
          LD_LIBRARY_PATH=. cargo run --release -p xtask -- perf-render \
            --pdfium-driver ./pdfium_driver --repeats 5
        timeout-minutes: 30
      - name: Record runner-fresh baseline
        run: cargo xtask bench --record-baseline
        timeout-minutes: 20
      - name: Compare budgets against the fresh baseline
        run: cargo xtask perf-check
        timeout-minutes: 20

  # ── render-conf (scheduled + dispatch) — SL-2.CONF.01: differential render
  # sweep against the two *independent* render oracles (21-TESTING §4: two
  # minimum for a Render promotion). selis vs the pinned PDFium and pdf.js
  # GHCR images (xtask/oracles.toml, digest-pinned) at 72/150/300 DPI over a
  # deterministic stride sample of the fetched render corpus (page 1 per
  # file, ΔE76 > 2.3, G2 per-file threshold 0.5%). Scheduled, never per-push:
  # thousands of per-file container dispatches are hours of runner time no PR
  # gate should pay. Disagreements collapse into root-cause signatures in
  # sweep-report.json (SL-0.ORACLE.05); artifacts feed the G2 readout and the
  # SL-2.CONF.02 area promotion. The SL-3.CONF.01 text legs ride the same job:
  # page-1 extraction with selis vs MuPDF/PDFium/pdf.js through the pinned
  # images (text-sweep step + text-report.json artifacts).
  render-conf:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Log in to GHCR (pinned oracle images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Fetch and extract the render corpus (pdfjs, pdfassoc, ghent, verapdf)
        run: |
          cargo xtask corpus fetch --tag render
          cargo xtask corpus fetch --tag conformance
          mkdir -p corpus/pdfs
          tar -xzf ~/.cache/selis-corpus/pdfjs.gz -C corpus/pdfs \
            --wildcards "pdf.js-*/test/pdfs/*.pdf" --strip-components=3
          tar -xzf ~/.cache/selis-corpus/pdfassoc.gz -C corpus/pdfs \
            --wildcards "pdf20examples-master/*.pdf" --strip-components=1
          mkdir -p corpus/pdfs/verapdf
          tar -xzf ~/.cache/selis-corpus/verapdf.gz -C corpus/pdfs/verapdf \
            --strip-components=1
          mkdir -p corpus/pdfs/ghent
          # GNU tar cannot read zip archives (the Ghent suite ships as one) —
          # use python's zipfile module, guaranteed on the runner (run
          # 34523221142: "This does not look like a tar archive").
          python3 -m zipfile -e ~/.cache/selis-corpus/ghent.zip corpus/pdfs/ghent
          find corpus/pdfs/ghent -mindepth 2 -name '*.pdf' \
            -exec mv -t corpus/pdfs/ghent {} +
          n=$(find corpus/pdfs -name '*.pdf' | wc -l)
          echo "render corpus: $n files"
          test "$n" -gt 1000
      - name: Generate the deterministic synthetic corpus
        run: cargo xtask corpus synthetic-generate
      - name: Build selis (release)
        run: cargo build --release -p selis-cli
      - name: Sweep selis vs PDFium + pdf.js at 72/150/300 DPI
        # SL-3.CONF.06: the sweep fails its step when a leg measures 0
        # comparable pages (a green job measuring nothing is the bug runs
        # 34806315351/34946893403 demonstrated). The report is still written
        # first, so the uploads below (if: always) preserve the evidence.
        run: |
          cargo xtask oracle sweep \
            --tool pdfium --tool pdfjs \
            --dpi 72,150,300 \
            --sample 400 \
            --jobs 4 \
            --timeout-secs 120 \
            --selis target/release/selis \
            --out sweep
      - name: Oracle-vs-oracle calibration (SL-2.CONF.03)
        # What two INDEPENDENT renderers agree on under the identical metric:
        # every pair of {PDFium, pdf.js, MuPDF, MuPDF-again} on the same
        # pages. MuPDF runs twice — the second copy is the self-agreement
        # sanity leg (must stay ~100% at ~0%). Two legs: a stride sample of
        # the general corpus, and the full Ghent prepress suite, whose
        # colour-management divergence is calibrated separately.
        run: |
          cargo xtask oracle sweep --calibrate \
            --tool pdfium --tool pdfjs --tool mutool --tool mutool \
            --dpi 150 --sample 300 --exclude ghent/ \
            --jobs 4 --timeout-secs 180 \
            --out sweep-calibration
          cargo xtask oracle sweep --calibrate \
            --tool pdfium --tool pdfjs --tool mutool --tool mutool \
            --dpi 150 --include ghent/ \
            --jobs 4 --timeout-secs 180 \
            --out sweep-calibration-ghent
      - name: Sweep the text legs (SL-3.CONF.01)
        # Page-1 text extraction with selis and the three text oracles through
        # the PINNED GHCR IMAGES (MuPDF needs no driver change; PDFium/pdf.js
        # use their drivers' `--text` modes), compared under the documented
        # normaliser (xtask/src/text_norm.rs), plus the selis golden renders
        # per DPI and the extracted-text hash. Same schedule/dispatch gating
        # as the render legs above. Calibration pairs included: the G3 bar is
        # read off selis-vs-oracle agreement, the oracle pairs calibrate it.
        #
        # SL-3.CONF.06: like the render legs, a 0-comparable text leg fails
        # its step (xtask/src/text_sweep.rs) instead of staying green while
        # measuring nothing.
        run: |
          cargo xtask oracle text-sweep \
            --tool mutool --tool pdfium --tool pdfjs \
            --dpi 72,150,300 --sample 400 --calibrate \
            --jobs 4 --timeout-secs 180 \
            --selis target/release/selis \
            --out sweep-text
      - name: Upload the sweep artifacts
        # SL-3.CONF.06: a 0-comparable leg fails its sweep step above, but
        # the report is written before the failure so the evidence still
        # uploads for triage.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-conf-sweep
          path: |
            sweep/sweep-report.json
            sweep/verdicts.jsonl
          if-no-files-found: error
      - name: Upload the calibration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-conf-calibration
          path: |
            sweep-calibration/sweep-report.json
            sweep-calibration/verdicts.jsonl
            sweep-calibration-ghent/sweep-report.json
            sweep-calibration-ghent/verdicts.jsonl
          if-no-files-found: error
      - name: Upload the text-sweep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-conf-text
          path: |
            sweep-text/text-report.json
            sweep-text/verdicts.jsonl
            sweep-text/golden.jsonl
          if-no-files-found: error
