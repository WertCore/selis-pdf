# CI pipeline — 03-CONVENTIONS.md §9.
#
# Stage          | Runs on   | Gate
# fmt + lint     | every PR  | required
# build-matrix   | every PR  | required
# test-fast      | every PR  | required
# supply-chain   | every PR  | required
# size-check     | every PR  | required
# determinism    | every PR  | required (job pending)
# write05-oracle | every PR  | required (qpdf --check on 100% of tool outputs)
# write06-kill   | every PR  | required (crash-atomicity, 500 points x 3 ops)
# test-slow      | nightly   | required for release (job pending)
# fuzz-soak      | nightly + dispatch | non-blocking
# perf           | nightly + dispatch | blocks release on >5% regression

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every 2 days at 03:00 UTC. GitHub cron steps by day-of-month, so the
    # gap at a month boundary is 1 day instead of 2; there is no true
    # "every 48 hours" cron. Nightly-gated jobs (fuzz-soak, perf) run on
    # this schedule; scheduled runs always use main.
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    # On-demand campaign legs (SL-1.ROB.02): the cron default keeps the
    # 10-minute per-target soak, a dispatched run scales it, e.g.
    #   gh workflow run ci.yml -f fuzz_minutes=120
    inputs:
      fuzz_minutes:
        description: 'fuzz-soak: minutes per target (cron default: 10)'
        required: false
        default: '10'
      run_perf:
        description: 'Also run the perf job'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── fmt + lint + gates ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: true
          # The lint policy is the workspace deny list (Cargo.toml
          # [workspace.lints]) enforced by `cargo xtask lint`; the toolchain
          # action's default RUSTFLAGS="-D warnings" would also promote every
          # warn-level clippy lint (e.g. too_many_arguments on the /Encrypt
          # dict API) above the documented policy.
          rustflags: ""
      # `cargo xtask lint` also runs `cargo deny check` + `cargo vet` (SL-0.WS.07).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-vet
      - run: cargo xtask lint

  # ── build matrix (6 targets, 03-CONVENTIONS.md §9) ──────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, allow_fail: false }
          - { target: wasm32-unknown-unknown, allow_fail: false }
          - { target: aarch64-apple-darwin, allow_fail: true }
          - { target: x86_64-pc-windows-msvc, allow_fail: true }
          - { target: aarch64-apple-ios, allow_fail: true }
          - { target: aarch64-linux-android, allow_fail: true }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true
      - run: cargo build --workspace --target ${{ matrix.target }}
        timeout-minutes: 15
        continue-on-error: ${{ matrix.allow_fail }}

  # ── supply chain: deny + vet + SBOM (SL-0.WS.07) ───────────────────────────
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo install cargo-vet --locked
      - run: cargo deny check
      - run: cargo vet --locked
      - run: cargo xtask sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/sbom.json

  # ── unit + property tests ──────────────────────────────────────────────────
  test-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - run: cargo test --workspace
        timeout-minutes: 10
      # The Tier-2 codec sandbox (SL-0.SBX.06) is feature-gated
      # (`wasm-host`), so --workspace alone never compiles the wasmtime
      # embedding or its hostile-module containment tests. The feature is
      # target-excluded on wasm32, so this job stays native-only.
      - run: cargo test -p selis-sandbox --features wasm-host
        timeout-minutes: 15

  # ── WRITE.07 conformance-posture gate over the fetched smoke corpus ───────
  write07:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Fetch and extract the smoke corpus
        run: |
          cargo xtask corpus fetch --tag smoke
          mkdir -p corpus/pdfs
          tar -xzf ~/.cache/selis-corpus/pdfjs.gz -C corpus/pdfs \
            --wildcards "pdf.js-*/test/pdfs/*.pdf" --strip-components=3
          tar -xzf ~/.cache/selis-corpus/pdfassoc.gz -C corpus/pdfs \
            --wildcards "pdf20examples-master/*.pdf" --strip-components=1
          n=$(find corpus/pdfs -maxdepth 1 -name '*.pdf' | wc -l)
          echo "smoke corpus: $n files"
          test "$n" -gt 100
      - run: cargo test -p selis-cli --bin selis tool_conformance
        timeout-minutes: 15

  # ── WASM size budgets + 2% regression rule (SL-0.WS.09) ────────────────────
  size-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-opt (binaryen, via npm)
        run: npm install -g wasm-opt
      - run: cargo xtask size-check
        timeout-minutes: 15

  # ── WRITE.05: qpdf --check over 100% of tool outputs (structural oracle) ───
  # Local qpdf on the runner (apt); the xtask oracle command falls back to the
  # pinned container when absent, so the job also validates the container path.
  write05-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Install qpdf (structural oracle, Apache-2.0)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Run the tool suite over the smoke fixtures
        # `xtask fixtures` builds the CLI itself (rust-cache restores
        # compilation artifacts but not reliably the final binary) and then
        # runs every Phase 1A write path over a formed fixture set.
        run: |
          mkdir -p target/tool-outputs
          cargo xtask fixtures --outdir target/tool-outputs
      - name: qpdf --check every tool output
        run: cargo xtask oracle check-output-dir target/tool-outputs
        timeout-minutes: 10

  # ── WRITE.06: crash-atomicity kill tests (500 points x 3 operations) ───────
  # The debug-only crash injection is a debug build; no release flag involved.
  write06-kill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Kill-test harness (500 points x split/rotate-incremental/compress)
        run: cargo test -p selis-cli --test write06_kill_test -- --ignored --test-threads 4
        timeout-minutes: 40

  # ── fuzz-soak (nightly + dispatch, non-blocking) — SL-0.SEC.02 / SL-1.ROB.02
  # One job per parser entry point (fuzz/Cargo.toml); a new fuzz target must
  # be added to the matrix in the same commit (03-CONVENTIONS.md §6). The cron
  # schedule keeps the 10-minute default; a dispatched leg scales it via the
  # fuzz_minutes input, e.g. `gh workflow run ci.yml -f fuzz_minutes=120`.
  fuzz-soak:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build]
    timeout-minutes: ${{ fromJSON(inputs.fuzz_minutes || '10') + 30 }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - cos_parse
          - cos_lex
          - doc_open
          - filter_chain
          - font_ttf
          - font_cff
          - font_cmap
          - font_type1
          - shaper
    env:
      FUZZ_MINUTES: ${{ inputs.fuzz_minutes || '10' }}
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: true
      - run: cargo install cargo-fuzz --locked
      - name: Seed the corpus from the committed seeds
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_TARGET"
          if [ -d "fuzz/seeds/$FUZZ_TARGET" ]; then
            cp -v fuzz/seeds/"$FUZZ_TARGET"/* "fuzz/corpus/$FUZZ_TARGET"/
          fi
      - name: Soak ${{ matrix.target }} for ${{ env.FUZZ_MINUTES }} minutes
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run "$FUZZ_TARGET" -- \
            -max_total_time=$(( FUZZ_MINUTES * 60 )) \
            -rss_limit_mb=4096 -timeout=60 -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: |
            fuzz/crash-*
            fuzz/oom-*
            fuzz/timeout-*
            fuzz/leak-*
          if-no-files-found: ignore
      - name: Coverage report over the accumulated corpus
        if: always()
        working-directory: fuzz
        run: |
          rustup component add llvm-tools-preview
          cargo +nightly fuzz coverage "$FUZZ_TARGET" "corpus/$FUZZ_TARGET"
          covdir="coverage/$FUZZ_TARGET"
          if [ ! -f "$covdir/lcov.info" ]; then
            bin="$(find target -type f -path '*coverage*' -name "$FUZZ_TARGET" | head -1)"
            "$(rustc --print sysroot)/bin/llvm-cov" export --format=lcov \
              --instr-profile "$covdir/coverage.profdata" "$bin" \
              > "$covdir/lcov.info"
          fi
          python3 - "$covdir/lcov.info" <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import sys
          lf = lh = 0
          for line in open(sys.argv[1]):
              if line.startswith("LF:"):
                  lf += int(line[3:])
              elif line.startswith("LH:"):
                  lh += int(line[3:])
          pct = 100.0 * lh / lf if lf else 0.0
          print(f"### {sys.argv[1].split('/')[1]} line coverage: {pct:.1f}% ({lh}/{lf})")
          EOF
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target }}
          path: fuzz/coverage/${{ matrix.target }}/
          if-no-files-found: ignore
      - name: Upload accumulated corpus (dispatched legs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: ignore

  # ── perf budgets (nightly) — SL-0.PERF.02; blocks release on >5% regression
  # per 03-CONVENTIONS.md §9. The baseline is re-recorded on the runner first,
  # so the regression comparison is same-machine (a committed baseline from a
  # different machine cannot gate percentages).
  perf:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_perf)
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Record runner-fresh baseline
        run: cargo xtask bench --record-baseline
        timeout-minutes: 20
      - name: Compare budgets against the fresh baseline
        run: cargo xtask perf-check
        timeout-minutes: 20
