# CI pipeline — 03-CONVENTIONS.md §9.
#
# Stage          | Runs on   | Gate
# fmt + lint     | every PR  | required
# build-matrix   | every PR  | required
# test-fast      | every PR  | required
# supply-chain   | every PR  | required
# size-check     | every PR  | required
# determinism    | every PR  | required
# test-slow      | nightly   | required for release
# fuzz-soak      | nightly   | non-blocking
# perf           | nightly   | blocks release on >5% regression

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── fmt + lint + gates ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: true
      - run: cargo xtask lint

  # ── build matrix (6 targets, 03-CONVENTIONS.md §9) ──────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
          - aarch64-apple-ios
          - aarch64-linux-android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true
      - run: cargo build --workspace --target ${{ matrix.target }}
        timeout-minutes: 15

  # ── supply chain: deny + vet + SBOM (SL-0.WS.07) ───────────────────────────
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo install cargo-vet --locked
      - run: cargo deny check
      - run: cargo vet --locked
      - run: cargo xtask sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/sbom.json

  # ── unit + property tests ──────────────────────────────────────────────────
  test-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - run: cargo test --workspace
        timeout-minutes: 10

  # ── fuzz-soak (nightly, non-blocking) — SL-0.SEC.02 / SL-1.ROB.02 ──────────
  fuzz-soak:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: true
      - run: cargo install cargo-fuzz --locked
      - name: Soak cos_parse for 10 minutes
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run cos_parse -- -max_total_time=600
          cargo +nightly fuzz run cos_lex -- -max_total_time=600
          cargo +nightly fuzz run doc_open -- -max_total_time=600
        timeout-minutes: 40