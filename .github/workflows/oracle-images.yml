# Oracle images job — SL-0.ORACLE.01 (ADR-P0009).
#
# Builds the five pinned oracle images from docker/oracles/ on every change to
# them, smoke-tests each oracle against fixtures/smoke.pdf, and prints the
# digests to record in xtask/oracles.toml. Pushing is gated behind the repo
# variable ENABLE_ORACLE_PUSH=1 (Settings → Variables), so the job validates
# the recipes on CI without needing registry creds.
#
# No job here fetches wild-corpus data (policy §7; see xtask check-wild-hygiene).

name: oracle-images

on:
  push:
    branches: [main]
    paths:
      - "docker/oracles/**"
      - "xtask/oracles.toml"
  pull_request:
    paths:
      - "docker/oracles/**"
      - "xtask/oracles.toml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # GHCR image names must be lowercase; the owner is "WertCore".
  OWNER_LC: wertcore
  # To record image digests: set the repo variable ENABLE_ORACLE_PUSH=1
  # (Settings → Secrets and variables → Actions → Variables). The workflow
  # then pushes with its own GITHUB_TOKEN (packages: write is already
  # declared) and the Record step emits image@sha256:... digests.

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: qpdf
            tag: 11.9.0
          - tool: mupdf
            tag: 1.23.9
          - tool: ghostscript
            tag: 9.56.1
          - tool: pdfium
            tag: chromium-7961
          - tool: pdfjs
            tag: 6.2.108
    steps:
      - uses: actions/checkout@v4

      - name: Assert the matrix tag matches xtask/oracles.toml
        run: grep -q "version = \"${{ matrix.tag }}\"" xtask/oracles.toml

      - name: Build the pinned image
        working-directory: docker/oracles/${{ matrix.tool }}
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER_LC }}/selis-pdf/oracle-${{ matrix.tool }}:${{ matrix.tag }} \
            .

      - name: Smoke the oracle against the fixture
        working-directory: docker/oracles
        run: |
          IMG=ghcr.io/${{ env.OWNER_LC }}/selis-pdf/oracle-${{ matrix.tool }}:${{ matrix.tag }}
          # qpdf is a structural oracle: --json on the fixture must succeed
          # and print a v2 JSON array. The render oracles must produce a
          # non-empty PNG of the fixture page.
          case "${{ matrix.tool }}" in
            qpdf)
              docker run --rm -v "$PWD/fixtures/smoke.pdf:/in.pdf:ro" "$IMG" --json /in.pdf > /dev/null
              echo "smoke structural check ok" ;;
            mupdf)
              docker run --rm -v "$PWD/fixtures:/fx:ro" -v "$PWD/out:/out" "$IMG" draw -r 150 -o /out/smoke.png /fx/smoke.pdf
              test -s out/smoke.png && echo "smoke render ok" ;;
            ghostscript)
              docker run --rm -v "$PWD/fixtures:/fx:ro" -v "$PWD/out:/out" "$IMG" -sDEVICE=png16m -r150 -o /out/smoke.png /fx/smoke.pdf
              test -s out/smoke.png && echo "smoke render ok" ;;
            pdfium)
              docker run --rm -v "$PWD/fixtures:/fx:ro" -v "$PWD/out:/out" "$IMG" --page 1 --dpi 150 /fx/smoke.pdf /out/smoke.png
              test -s out/smoke.png && echo "smoke render ok" ;;
            pdfjs)
              docker run --rm -v "$PWD/fixtures:/fx:ro" -v "$PWD/out:/out" "$IMG" --page 1 --dpi 150 /fx/smoke.pdf /out/smoke.png
              test -s out/smoke.png && echo "smoke render ok" ;;
          esac

      - name: Push to GHCR (only when vars.ENABLE_ORACLE_PUSH = 1)
        if: ${{ vars.ENABLE_ORACLE_PUSH == '1' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ env.OWNER_LC }}/selis-pdf/oracle-${{ matrix.tool }}:${{ matrix.tag }}

      - name: Record the image digest
        run: |
          IMG=ghcr.io/${{ env.OWNER_LC }}/selis-pdf/oracle-${{ matrix.tool }}:${{ matrix.tag }}
          # RepoDigests is populated only after a push; pre-push builds report
          # the config id, which is not a pin. The pushed digest is what gets
          # recorded into xtask/oracles.toml.
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMG" 2>/dev/null || echo "unpushed (set vars.ENABLE_ORACLE_PUSH=1 to record)")
          echo "${{ matrix.tool }}: $DIGEST" | tee -a oracle-digests.txt

      - uses: actions/upload-artifact@v4
        with:
          name: oracle-digests-${{ matrix.tool }}
          path: oracle-digests.txt
          if-no-files-found: ignore
